name: Build Matix

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------ WINDOWS
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build the WPF app
        run: dotnet publish MatixMathClub.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw 'Could not find ISCC.exe - Inno Setup did not install' }
          Write-Host "Using $iscc"
          & $iscc 'installer\Matix.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@v6
        with:
          name: matix-win
          path: dist/matix-installer.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------- MAC
  mac:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Do we have the Apple credentials?
        id: apple
        env:
          CERT: ${{ secrets.MAC_CERT_P12 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, sign and notarise
        if: steps.apple.outputs.signed == 'true'
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder --mac --publish never

      - name: Prove it is really signed
        if: steps.apple.outputs.signed == 'true'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -n 1)
          echo "Checking $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP" || echo "stapler could not validate - notarisation may still be in flight"
          spctl --assess --type execute --verbose "$APP"

      - name: Build the Mac app
        if: steps.apple.outputs.signed == 'false'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac --publish never
          echo "Built without an Apple signature. Users follow the unlock steps on the download page."

      - uses: actions/upload-artifact@v6
        with:
          name: matix-mac
          path: dist/*.dmg
          if-no-files-found: error

  # ------------------------------------------------------------------ ANDROID
  android:
    name: Android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Wrap the web app for Android
        run: |
          mkdir -p mobile/www
          cp app/app.html mobile/www/index.html
          cp app/logo.svg mobile/www/logo.svg || true
          cd mobile
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init Matix com.matix.mathclub --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build the apk
        run: |
          cd mobile/android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/matix.apk

      - uses: actions/upload-artifact@v6
        with:
          name: matix-android
          path: out/matix.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ RELEASE
  release:
    name: Publish the release
    needs: [windows, mac, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Zip everything up
        run: |
          mkdir -p release
          cd artifacts/matix-win && zip -r ../../release/matix-win.zip . && cd ../..
          cd artifacts/matix-mac && zip -r ../../release/matix-mac.zip . && cd ../..
          cd artifacts/matix-android && zip -r ../../release/matix-android.zip . && cd ../..
          ls -la release

      - name: Put them on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.zip --clobber
          else
            gh release create "$TAG" release/*.zip --title "Matix ${TAG#v}" --generate-notes
          fi
