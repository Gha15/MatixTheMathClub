<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matix — Workspace</title>
<style>
  :root{
    --bg:#ffffff;--card:#ffffff;--sidebar:#f7f7f5;--sidebar2:#efeeec;--text:#2c2c2b;--muted:#7d7a75;
    --border:#e6e5e3;--hover:#efedeb;--soft:#f9f8f7;
    --brand:#5b46c9;--brand2:#283f71;--accent:#f7a600;--blue:#2783de;--blue-soft:#e5f2fc;
    --green:#46a171;--red:#e56458;--radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(91,70,201,.2)}

  /* ---------- Sign in ---------- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,#ece8ff,transparent),radial-gradient(800px 500px at 100% 0,#fdeecf,transparent),var(--soft);z-index:200}
  .gate-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow);text-align:center;animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .gate-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.7rem;font-weight:800}
  .gate-card h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
  .gate-card p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
  .fld{text-align:left;margin-bottom:12px}
  .fld label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:5px}
  input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.95rem;background:#fff;font-family:inherit;color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--radius);padding:10px 16px;font-size:.92rem;font-weight:700;background:var(--brand);color:#fff;transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--hover);filter:none}
  .btn.accent{background:linear-gradient(90deg,var(--accent),#ff8a4c);color:#3a1d00}
  .btn.sm{padding:6px 11px;font-size:.82rem}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--border)}
  .err{color:var(--red);font-size:.83rem;min-height:16px;margin-top:8px;font-weight:600}
  .swap{margin-top:16px;font-size:.88rem;color:var(--muted)}
  .swap a{color:var(--brand);font-weight:700;cursor:pointer}

  /* ---------- App shell ---------- */
  #app{display:none;height:100%}
  .layout{display:flex;height:100%}
  .sidebar{width:250px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;transition:margin-left .22s ease}
  .sb-top{padding:12px 10px 6px}
  .ws{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);cursor:default}
  .ws-logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
  .ws-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-name small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}
  .sb-search{margin:8px 8px 4px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);background:var(--sidebar2);color:var(--muted);font-size:.86rem;cursor:pointer;transition:background .12s}
  .sb-search:hover{background:var(--hover)}
  .sb-search kbd{margin-left:auto;font-size:.68rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
  .nav{padding:6px 8px;overflow-y:auto;flex:1}
  .nav-lbl{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;display:flex;align-items:center;justify-content:space-between}
  .nav-lbl button{border:none;background:transparent;color:var(--muted);font-size:1.05rem;line-height:1;border-radius:5px;padding:0 5px}
  .nav-lbl button:hover{background:var(--hover);color:var(--text)}
  .nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);font-size:.9rem;color:#4b4a47;cursor:pointer;transition:background .1s;position:relative}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--sidebar2);color:var(--text);font-weight:600}
  .nav-item .ic{width:20px;text-align:center;flex-shrink:0}
  .nav-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .nav-item .del{opacity:0;border:none;background:transparent;color:var(--muted);border-radius:5px;font-size:.85rem;padding:2px 5px}
  .nav-item:hover .del{opacity:1}
  .nav-item .del:hover{background:#fff;color:var(--red)}
  .sb-foot{border-top:1px solid var(--border);padding:8px;display:flex;align-items:center;gap:9px}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#c4b5fd);color:#312e81;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;background-size:cover;background-position:center}
  .sb-foot .u{flex:1;min-width:0}
  .sb-foot .u b{font-size:.86rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-foot .u span{font-size:.72rem;color:var(--muted)}
  .icon-btn{border:none;background:transparent;color:var(--muted);border-radius:6px;padding:5px 7px;font-size:.95rem}
  .icon-btn:hover{background:var(--hover);color:var(--text)}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  .tabstrip{display:flex;align-items:center;gap:2px;height:42px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--soft);overflow-x:auto;flex-shrink:0}
  .tabstrip::-webkit-scrollbar{height:0}
  .menu-toggle{display:none;border:none;background:transparent;font-size:1.2rem;padding:4px 8px;border-radius:6px;color:var(--muted)}
  .menu-toggle:hover{background:var(--hover)}
  .tab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px 8px 0 0;font-size:.85rem;color:var(--muted);cursor:pointer;max-width:190px;white-space:nowrap;border:1px solid transparent;border-bottom:none;position:relative;top:1px}
  .tab .ic{flex-shrink:0}
  .tab .lb{overflow:hidden;text-overflow:ellipsis}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);color:var(--text);border-color:var(--border);font-weight:600}
  .tab .x{border:none;background:transparent;color:var(--muted);border-radius:4px;font-size:.9rem;line-height:1;padding:1px 4px;opacity:.6}
  .tab .x:hover{background:rgba(0,0,0,.08);opacity:1;color:var(--red)}
  .tab-add{border:none;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;border-radius:6px;padding:3px 9px;flex-shrink:0}
  .tab-add:hover{background:var(--hover);color:var(--text)}
  .content{flex:1;overflow-y:auto;position:relative}
  .frame{width:100%;height:100%;border:none;display:block;background:#fff}
  .wrap{max-width:860px;margin:0 auto;padding:40px 32px 80px}
  .wrap.wide{max-width:1080px}

  /* ---------- Content styling ---------- */
  .page-title{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .page-title .emoji{font-size:2rem}
  .page-sub{color:var(--muted);font-size:1rem;margin-bottom:26px}
  .hero{border-radius:16px;padding:30px 30px;margin-bottom:26px;color:#fff;background:linear-gradient(120deg,var(--brand2),var(--brand) 60%,#8b5cf6);position:relative;overflow:hidden}
  .hero:after{content:'';position:absolute;right:-50px;top:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(247,166,0,.45),transparent 70%)}
  .hero .badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.04em;margin-bottom:12px}
  .hero h1{font-size:1.9rem;font-weight:800;margin-bottom:8px}
  .hero p{opacity:.94;max-width:560px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:box-shadow .15s}
  .card.hover:hover{box-shadow:var(--shadow)}
  .callout{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .callout .ci{font-size:1.3rem;flex-shrink:0}
  .callout h3{font-size:1rem;margin-bottom:3px}
  .callout p{color:#565450;font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .pcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:transform .14s,box-shadow .14s;animation:pop .3s ease}
  .pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .thumb{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background-size:cover;background-position:center;color:#fff}
  .pcard .meta{padding:11px 13px}
  .pcard .pn{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .pb{font-size:.8rem;color:var(--muted);margin-top:2px}
  .tag{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:middle}
  .tag.ai{background:#efe9ff;color:var(--brand)}
  .tag.draft{background:#f0efed;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .seg{display:inline-flex;background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
  .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  .empty .big{font-size:2.4rem;margin-bottom:10px}
  .stage{width:100%;height:min(70vh,640px);border:1px solid var(--border);border-radius:12px;background:#fff}
  label.fl{display:block;font-weight:700;font-size:.85rem;margin:16px 0 5px}
  .hint-item{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .hint-item h3{font-size:1rem;margin-bottom:4px}
  .hint-item p{color:#565450;font-size:.93rem;white-space:pre-wrap}
  .hint-item .meta{font-size:.74rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;align-items:center}
  .idea-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:10px;background:#fff}
  .idea-item .vote{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
  .idea-item .vote button{border:1px solid var(--border);background:var(--soft);border-radius:7px;width:34px;height:30px;font-size:.9rem}
  .idea-item .vote button:hover{background:var(--hover)}
  .idea-item .vote b{font-size:.85rem}
  .idea-item .txt{flex:1}
  .idea-item .txt .by{font-size:.75rem;color:var(--muted);margin-top:5px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:.8rem;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer}
  .chip.active{background:var(--brand);color:#fff;border-color:transparent}
  .chip .c{font-size:.68rem;background:rgba(0,0,0,.08);border-radius:10px;padding:0 6px;margin-left:5px}
  .chip.active .c{background:rgba(255,255,255,.25)}
  .nitem{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-left:4px solid var(--accent2,#3b82f6);border-radius:11px;padding:12px 14px;margin-bottom:9px;background:#fff}
  .nitem .nic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;color:#fff}
  .nitem .nbody{flex:1;min-width:0}
  .nitem .nl{font-weight:600;font-size:.92rem}
  .nitem .nd{font-size:.85rem;color:#565450;margin-top:2px;word-break:break-word}
  .nitem .nq{font-size:.84rem;color:var(--muted);border-left:2px solid var(--border);padding-left:9px;margin-top:5px;white-space:pre-wrap}
  .nitem .nt{font-size:.72rem;color:var(--muted);margin-top:5px}
  .new{font-size:.58rem;font-weight:800;color:#052e16;background:linear-gradient(90deg,#fbbf24,#fde047);border-radius:9px;padding:1px 6px;margin-left:7px;vertical-align:middle}
  .toggle{display:flex;align-items:center;gap:10px;font-size:.88rem;color:#4b4a47;padding:5px 0;cursor:pointer}
  .toggle input{width:16px;height:16px;accent-color:var(--brand)}
  .ide{border-radius:11px;overflow:hidden;border:1px solid #26263a;margin-top:6px}
  .ide-bar{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#2b2b40,#1c1c2b);padding:9px 13px}
  .ide-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .ide-bar i:nth-child(1){background:#ff5f56}.ide-bar i:nth-child(2){background:#ffbd2e}.ide-bar i:nth-child(3){background:#27c93f}
  .ide-bar .f{color:#aab0c6;font:600 13px ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
  .ide-ta{display:block;width:100%;min-height:300px;background:#16161f;color:#e7e7f2;caret-color:#a78bfa;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;white-space:pre;tab-size:2;border:none;outline:none;padding:15px;resize:vertical}

  /* ---------- Command palette ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,30,30,.4);display:none;align-items:flex-start;justify-content:center;padding:90px 16px 16px;z-index:150;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .palette{width:100%;max-width:560px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;animation:pop .18s ease}
  .palette .pin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .palette .pin input{border:none;padding:0;font-size:1.05rem}
  .palette .pin input:focus{outline:none}
  .presults{max-height:52vh;overflow-y:auto;padding:6px}
  .pres-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px 4px}
  .pres{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.92rem}
  .pres:hover,.pres.sel{background:var(--hover)}
  .pres .ic{width:22px;text-align:center;flex-shrink:0}
  .pres .sub{color:var(--muted);font-size:.78rem}
  .pres .kind{margin-left:auto;font-size:.7rem;color:var(--muted);background:var(--soft);border:1px solid var(--border);padding:1px 7px;border-radius:5px}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(30,30,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:180;backdrop-filter:blur(2px)}
  .modal.open{display:flex}
  .modal-card{width:100%;max-width:460px;background:#fff;border-radius:16px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .2s ease;max-height:90vh;overflow-y:auto}
  .modal-card h2{font-size:1.25rem;font-weight:800;margin-bottom:4px}
  .modal-card .mh-sub{color:var(--muted);font-size:.9rem;margin-bottom:8px}
  .modal-x{float:right;border:none;background:transparent;font-size:1.4rem;color:var(--muted);line-height:1}
  .emoji-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .emoji-pick button{width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:1.2rem}
  .emoji-pick button.sel{border-color:var(--brand);background:#efe9ff}

  @media(max-width:820px){
    .sidebar{position:fixed;z-index:120;box-shadow:var(--shadow);margin-left:-250px}
    .sidebar.open{margin-left:0}
    .menu-toggle{display:block}
    .wrap{padding:26px 18px 70px}
    .page-title{font-size:1.7rem}
  }
</style>
<style>
.gate-logo,.ws-logo{background:#fff!important;color:transparent!important;overflow:hidden}
.gate-logo{padding:10px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(40,63,113,.12)}
.ws-logo{padding:3px;border:1px solid var(--border)}
.gate-logo svg,.ws-logo svg{width:100%;height:100%;display:block}
body{background:linear-gradient(180deg,#faf9ff,#ffffff)}
/* dark mode must undo the hard-coded light gradient above, or the page
   stays white behind the cards and light text becomes unreadable */
body.dark{background:linear-gradient(180deg,#191919,#141414)}
#gate{background:radial-gradient(1200px 600px at 15% -10%,rgba(91,70,201,.14),transparent),radial-gradient(1000px 500px at 110% 10%,rgba(247,166,0,.12),transparent),linear-gradient(180deg,#f7f6fb,#ffffff)}
.card{transition:box-shadow .16s ease,transform .16s ease,border-color .16s}
.card:hover{box-shadow:0 8px 24px rgba(40,63,113,.09);border-color:#d9d7f2}
.nav-item{transition:background .12s,color .12s}
.nav-item.active{position:relative;background:linear-gradient(90deg,rgba(91,70,201,.13),rgba(91,70,201,.02))}
.nav-item.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--brand),var(--brand2))}
.tab.active{box-shadow:inset 0 -2px 0 var(--brand)}
.page-title .emoji{filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.ls-card .ls-top{display:flex;align-items:baseline;gap:10px}
.ls-card .ls-top h3{font-weight:800;font-size:1.05rem}
.ls-by{margin-left:auto;color:var(--muted);font-size:.78rem;white-space:nowrap}
.ls-desc{color:var(--muted);font-size:.9rem;margin:4px 0}
.ls-content{margin-top:8px;font-size:.94rem;line-height:1.55}
.utbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.utbl th{text-align:left;padding:10px 12px;background:var(--soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.utbl td{padding:10px 12px;border-top:1px solid var(--border)}
.utbl .pw{font-family:ui-monospace,Menlo,monospace;color:var(--brand2)}
.rolechip{background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase}
</style>
<style>
/* ===== cooler polish ===== */
.btn{background:linear-gradient(135deg,var(--brand),#7d5cff);box-shadow:0 2px 8px rgba(91,70,201,.28)}
.btn:hover{box-shadow:0 5px 16px rgba(91,70,201,.4);filter:brightness(1.03)}
.btn.ghost,.btn.danger{background:#fff;box-shadow:none}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.accent{background:linear-gradient(135deg,var(--accent),#ff8a4c);color:#3a1d00;box-shadow:0 2px 8px rgba(247,166,0,.3)}
.sidebar{background:linear-gradient(180deg,#f8f7fc,#f1f0f6)}
.content{scroll-behavior:smooth}
.nav::-webkit-scrollbar,.content::-webkit-scrollbar{width:10px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb{background:#d9d7e6;border-radius:10px;border:3px solid transparent;background-clip:content-box}
.wrap{animation:fadeUp .34s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-title{background:linear-gradient(90deg,var(--brand2),var(--brand));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-title .emoji{-webkit-text-fill-color:initial}
.hero{box-shadow:0 14px 34px rgba(40,63,113,.24)}
.hero:before{content:"";position:absolute;left:-50px;bottom:-70px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-2px)}
.pcard:hover{box-shadow:0 12px 26px rgba(40,63,113,.16)}
.ws-logo{transition:transform .3s ease}
.ws:hover .ws-logo{transform:rotate(-6deg) scale(1.06)}
.tab-add{font-weight:700}
.tab-add:hover{background:linear-gradient(135deg,rgba(91,70,201,.14),rgba(247,166,0,.14));color:var(--brand)}
.chip{transition:transform .1s,background .12s}
.chip:hover{transform:translateY(-1px)}
.chip.active{background:linear-gradient(135deg,var(--brand),#7d5cff);border-color:transparent;box-shadow:0 2px 8px rgba(91,70,201,.3)}
.nav-lbl button{transition:transform .1s}
.nav-lbl button:hover{transform:scale(1.15)}
.gate-card{box-shadow:0 20px 50px rgba(40,63,113,.16)}
.u-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.u-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:transform .12s,box-shadow .12s}
.u-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(40,63,113,.12)}
.u-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;overflow:hidden;flex-shrink:0}
.u-avatar.img,.u-hero-av.img{background-size:cover;background-position:center;background-repeat:no-repeat;font-size:0;color:transparent}
.u-contrib{display:flex;flex-direction:column;gap:8px}
.bug{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--soft)}
.bug .vote{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.bug .vote button{width:30px;height:26px;border:1px solid var(--border);background:transparent;border-radius:7px;color:var(--muted)}
.bug .vote b{font-size:.8rem}
.bug-b{flex:1;min-width:0}
.bug-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bug-h b{font-size:.98rem}
.bug-st{font-size:.68rem;font-weight:800;color:#fff;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.bug-t{font-size:.9rem;margin-top:4px;white-space:pre-wrap;word-wrap:break-word}
.bug-reps{margin-top:8px;border-left:2px solid var(--border);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.bug-rep{font-size:.86rem}
.bug-rep .wh{font-size:.7rem;color:var(--muted);margin-left:6px}
.bug-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bug-form{margin-top:8px}
.u-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.u-row .t{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.u-cmt:last-child{border-bottom:0}
.u-cmt .b{flex:1;min-width:0}
.u-cmt .who{font-weight:700;font-size:.82rem}
.u-cmt .tx{font-size:.9rem;margin-top:2px;word-wrap:break-word}
.u-cmt .wh{font-size:.72rem;color:var(--muted);margin-top:3px}
.u-name{font-weight:700;font-size:.92rem}
.u-pw{font-family:ui-monospace,Menlo,monospace;color:var(--brand2);font-size:.78rem;background:var(--soft);padding:2px 7px;border-radius:6px;margin-top:2px;word-break:break-all}
/* ===== users directory ===== */
.u-stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.u-stat{background:linear-gradient(135deg,rgba(91,70,201,.09),rgba(247,166,0,.09));border:1px solid var(--border);border-radius:14px;padding:12px 18px;min-width:96px;text-align:center}
.u-stat b{display:block;font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
.u-stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.u-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
.u-toolbar input{max-width:280px;flex:1;min-width:180px}
.u-loading{color:var(--muted);padding:30px 0;font-size:.9rem}
.u-card{cursor:pointer;position:relative;overflow:hidden}
.u-card:after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:0;transition:opacity .16s}
.u-card:hover:after{opacity:1}
.u-card.owner{border-color:rgba(247,166,0,.5);background:linear-gradient(#fff,#fffcf5)}
.u-bio{font-size:.78rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u-mini{display:flex;gap:9px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:2px}
.u-view{font-size:.74rem;font-weight:700;color:var(--brand);opacity:0;transition:opacity .16s,transform .16s;transform:translateX(-4px);margin-top:auto}
.u-card:hover .u-view,.u-game:hover .u-view{opacity:1;transform:none}
.rolechip.own{background:linear-gradient(135deg,var(--brand2),#ffb52e);color:#fff;border-color:transparent}
.u-hero{display:flex;gap:18px;align-items:center;padding:26px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#7d5cff);color:#fff;box-shadow:0 18px 44px rgba(91,70,201,.3)}
.u-hero.owner{background:linear-gradient(135deg,#5b46c9,var(--brand2))}
.u-hero-av{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.45)}
.u-hero-name{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.u-hero-sub{font-size:.8rem;opacity:.85;margin-top:6px}
.u-hero .rolechip{background:rgba(255,255,255,.24);color:#fff;border-color:transparent}
.u-games{display:flex;flex-direction:column;gap:8px}
.u-game{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s}
.u-game:hover{transform:translateX(3px);border-color:var(--brand);box-shadow:0 8px 20px rgba(40,63,113,.1)}
.u-game-n{font-weight:600;font-size:.9rem}
.u-game .sub{font-size:.75rem;color:var(--muted)}
.owner-note{border-color:rgba(247,166,0,.45);background:linear-gradient(#fff,#fffdf6)}
/* ===== desktop title bar (shown only inside the Matix desktop app) ===== */
.titlebar{display:none;position:fixed;top:0;left:0;right:0;height:36px;z-index:500;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff;user-select:none;-webkit-user-select:none}
body.desktop .titlebar{display:flex}
body.desktop{padding-top:36px}
body.desktop #gate{top:36px}
.tb-drag{display:flex;align-items:center;gap:9px;padding-left:12px;flex:1;height:100%;-webkit-app-region:drag;app-region:drag;min-width:0}
.tb-logo{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-logo svg{width:100%;height:100%}
.tb-logo svg path{fill:#fff}
.tb-title{font-size:.78rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.tb-btns{display:flex;height:100%;-webkit-app-region:no-drag;app-region:no-drag}
.tb-btn{width:46px;height:100%;border:0;background:transparent;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:background .12s}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn.close:hover{background:#e81123}
/* ===== settings block at the bottom of the menu ===== */
.sb-settings{border-top:1px solid var(--border);padding:4px 8px 8px}
.set-item{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius);font-size:.88rem;text-align:left;transition:background .12s}
.set-item:hover{background:var(--hover)}
.set-item .nm{flex:1}
.switch{width:34px;height:19px;border-radius:20px;background:var(--border);position:relative;transition:background .18s;flex-shrink:0}
.switch:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch.on{background:var(--brand)}
.switch.on:after{transform:translateX(15px)}
/* ===== dark mode ===== */
body.dark{
  --bg:#191919;--card:#242424;--sidebar:#202020;--sidebar2:#262626;--text:#e8e6e3;--muted:#9b9894;
  --border:#343434;--hover:#2c2c2c;--soft:#1f1f1f;
  --brand:#8b73ff;--brand2:#7d5cff;--blue-soft:#1d2f42;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
}
body.dark .card,body.dark .u-card,body.dark .u-game,body.dark .pcard,body.dark .gate-card,body.dark .modal-card,body.dark .cc-box,body.dark .palette{background:#242424;border-color:var(--border);color:var(--text)}
body.dark .cc-box{background:linear-gradient(#262626,#212121)}
body.dark .u-card.owner{background:linear-gradient(#282520,#242424);border-color:rgba(247,166,0,.4)}
body.dark .owner-note{background:linear-gradient(#282520,#242424)}
body.dark input,body.dark textarea,body.dark select{background:#1d1d1d;border-color:var(--border);color:var(--text)}
body.dark input::placeholder,body.dark textarea::placeholder{color:#7a7772}
body.dark #gate{background:radial-gradient(900px 500px at 15% -10%,#241f3d,transparent),radial-gradient(800px 500px at 100% 0,#2d2517,transparent),var(--soft)}
body.dark .tabstrip{background:var(--sidebar)}
body.dark .tab{color:var(--muted)}
body.dark .tab.active{background:var(--bg);color:var(--text)}
body.dark .u-stat{background:linear-gradient(135deg,rgba(139,115,255,.14),rgba(247,166,0,.12))}
body.dark .toast{background:linear-gradient(135deg,#3a3852,#2a2838)}
body.dark .seg{background:var(--soft)}
body.dark .seg button{color:var(--muted)}
body.dark .seg button.active{background:#2f2f2f;color:var(--text)}
body.dark .empty{color:var(--muted)}
body.dark .stage{background:#fff}
body.dark ::selection{background:rgba(139,115,255,.35)}
/* dark: fix elements that had hard-coded light colours */
body.dark .sidebar{background:linear-gradient(180deg,#1e1e22,#1a1a1d);border-right-color:var(--border)}
body.dark .sb-search{background:#2a2a2e;color:var(--muted)}
body.dark .sb-search:hover{background:#323238}
body.dark .sb-search kbd{background:#3a3a40;color:var(--muted);border-color:#45454c}
body.dark .nav-item{color:var(--text)}
body.dark .nav-item:hover{background:rgba(255,255,255,.06)}
body.dark .nav-item.active{background:linear-gradient(90deg,rgba(139,115,255,.26),rgba(139,115,255,.05));color:#fff}
body.dark .ws-name{color:var(--text)}
body.dark .ws-name small{color:var(--muted)}
body.dark .sb-foot .u b{color:var(--text)}
body.dark .sb-settings{border-top-color:var(--border)}
body.dark .set-item{color:var(--text)}
body.dark .switch{background:#3a3a40}
body.dark .page-title{background:linear-gradient(90deg,#b9a8ff,#8b73ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.dark .hint-item{background:#242424;border-color:var(--border)}
body.dark .hint-item h3{color:var(--text)}
body.dark .hint-item p{color:#c9c6c2}
body.dark .card h2,body.dark .card h3,body.dark h1,body.dark h2,body.dark h3{color:var(--text)}
body.dark h2:not(.page-title),body.dark h3:not(.page-title){color:#f0eeeb!important;-webkit-text-fill-color:#f0eeeb!important}
body.dark .wrap h2 .emoji,body.dark .page-title .emoji{-webkit-text-fill-color:initial}
body.dark .icon-btn{color:var(--muted)}
body.dark .icon-btn:hover{background:var(--hover);color:var(--text)}
/* the light theme forces .btn.ghost/.btn.danger to a white background, so
   dark mode has to undo it or the label text is white-on-white */
body.dark .btn.ghost,body.dark .btn.danger{background:#262626}
body.dark .btn.ghost:hover,body.dark .btn.danger:hover{background:#333}
body.dark .btn.ghost{color:var(--text);border-color:var(--border)}
body.dark .btn.ghost:hover{background:var(--hover)}
body.dark .tab-add{color:var(--muted)}
body.dark .tab-add:hover{background:var(--hover);color:var(--text)}
body.dark .nav-lbl{color:var(--muted)}
body.dark .u-toolbar input{background:#1d1d1d}
body.dark .pres-lbl{color:var(--muted)}
body.dark .pres:hover,body.dark .pres.sel{background:rgba(255,255,255,.07)}
/* ===== owner delete affordances ===== */
.tab .tdel{border:0;background:transparent;cursor:pointer;font-size:.72rem;opacity:.45;padding:0 3px;border-radius:5px;line-height:1;transition:opacity .14s,background .14s,transform .1s}
.tab:hover .tdel,.tab.active .tdel{opacity:.8}
.tab .tdel:hover{opacity:1;background:rgba(192,57,43,.14);transform:scale(1.15)}
.pres{display:flex;align-items:center;gap:10px}
.pres-del{border:0;background:rgba(192,57,43,.08);cursor:pointer;font-size:.85rem;opacity:.55;padding:5px 8px;border-radius:8px;transition:opacity .14s,background .14s,transform .1s;flex-shrink:0}
.pres:hover .pres-del,.pres.sel .pres-del{opacity:.95}
.pres-del:hover{opacity:1;background:rgba(192,57,43,.14);transform:scale(1.12)}
/* ===== cooler custom dialogs ===== */
.cc-modal{position:fixed;inset:0;background:rgba(24,22,44,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;animation:ccFade .16s ease}
@keyframes ccFade{from{opacity:0}to{opacity:1}}
@keyframes ccPop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ccGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.cc-modal.open{display:flex}
.cc-box{position:relative;background:linear-gradient(#fff,#fbfaff);border:1px solid rgba(91,70,201,.14);border-radius:20px;padding:30px 28px 24px;max-width:380px;width:90%;box-shadow:0 30px 70px rgba(30,28,60,.36),0 0 0 1px rgba(255,255,255,.7) inset;animation:ccPop .2s cubic-bezier(.2,.9,.3,1.3);text-align:center;overflow:hidden}
.cc-box:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),#7d5cff,var(--brand2))}
.cc-icon{font-size:2.2rem;margin-bottom:10px;display:block;animation:ccGlow 2s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(91,70,201,.28))}
.cc-msg{font-size:.96rem;color:var(--text);line-height:1.55;white-space:pre-line;font-weight:500}
.cc-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.cc-actions .btn{flex:1}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1001;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(135deg,#32304a,#232135);color:#fff;padding:11px 20px;border-radius:12px;font-size:.85rem;font-weight:500;box-shadow:0 14px 32px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.08) inset;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.toast.err{background:linear-gradient(135deg,#e05a45,#c0392b)}
.toast.ok{background:linear-gradient(135deg,#2fa86c,#1c7d50)}
input,textarea,select{transition:border-color .14s,box-shadow .14s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,70,201,.14)}
.stage{box-shadow:0 10px 26px rgba(40,63,113,.1);transition:box-shadow .16s}
.empty .big{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pcard{transition:transform .14s,box-shadow .14s}
.pcard:hover{transform:translateY(-3px)}
.tag.draft{background:var(--soft);color:var(--muted)}
.tag.ai{background:linear-gradient(135deg,rgba(91,70,201,.16),rgba(247,166,0,.16));color:var(--brand2)}
.btn.sm{transition:transform .1s}
.btn.sm:active{transform:scale(.96)}
.seg button.active{box-shadow:0 2px 8px rgba(91,70,201,.28)}
::selection{background:rgba(91,70,201,.22)}

/* ---------- title bar v2: always on, tabs live up here, Notion style ---------- */
.titlebar,#titlebar{display:flex}
body{padding-top:40px}
#gate{top:40px}
body.desktop{padding-top:40px}
body.desktop #gate{top:40px}
#titlebar{height:40px;justify-content:flex-start;gap:0}
body.dark #titlebar{background:#1b1b1b;border-bottom:1px solid #303030}
body:not(.desktop) #tbMin,body:not(.desktop) #tbMax,body:not(.desktop) #tbClose{display:none}
.tb-left{display:flex;align-items:center;gap:5px;height:100%;padding-left:11px;flex-shrink:0;-webkit-app-region:drag;app-region:drag}
.tb-ico-btn{width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;-webkit-app-region:no-drag;app-region:no-drag;transition:background .12s}
.tb-ico-btn:hover{background:rgba(255,255,255,.3)}
body.dark .tb-ico-btn{background:rgba(255,255,255,.08);color:var(--text)}
body.dark .tb-ico-btn:hover{background:rgba(255,255,255,.18)}
.tb-menu{display:none}
.tb-tabs{flex:1;min-width:0;display:flex;align-items:center;gap:3px;height:100%;padding:0 8px;overflow-x:auto;-webkit-app-region:no-drag;app-region:no-drag}
.tb-tabs::-webkit-scrollbar{height:0}
.tb-tabs .tab{top:0;border:0;border-radius:8px;color:rgba(255,255,255,.8);background:transparent;padding:5px 9px;max-width:170px}
.tb-tabs .tab:hover{background:rgba(255,255,255,.14);color:#fff}
.tb-tabs .tab.active{background:rgba(255,255,255,.95);color:var(--brand2);font-weight:700;box-shadow:none}
body.dark .tb-tabs .tab{color:var(--muted)}
body.dark .tb-tabs .tab:hover{background:rgba(255,255,255,.08);color:var(--text)}
body.dark .tb-tabs .tab.active{background:#2c2c2c;color:var(--text);box-shadow:none}
.tb-tabs .tab-add{color:rgba(255,255,255,.85)}
.tb-tabs .tab-add:hover{background:rgba(255,255,255,.16);color:#fff}
body.dark .tb-tabs .tab-add{color:var(--muted)}
.tb-grab{flex:0 0 46px;height:100%;-webkit-app-region:drag;app-region:drag}
.tabstrip{display:none}
#tbReload .sp{display:inline-block;transition:transform .5s ease}
#tbReload.spin .sp{transform:rotate(360deg)}
.tb-panel{position:fixed;top:44px;left:10px;width:262px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:15px;z-index:700;display:none}
.tb-panel.open{display:block}
.tb-panel h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:0 0 8px}
.tb-modes{display:flex;gap:7px;margin-bottom:15px}
.tb-mode{flex:1;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:10px;padding:9px 0;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:border-color .12s,background .12s}
.tb-mode:hover{border-color:var(--brand)}
.tb-mode.on{border-color:var(--brand);background:rgba(91,70,201,.1);color:var(--brand)}
body.dark .tb-mode.on{background:rgba(139,115,255,.16)}
.tb-brow{display:flex;align-items:center;gap:9px}
.tb-brow input[type=range]{flex:1;accent-color:var(--brand)}
.tb-bval{font-size:.78rem;font-weight:700;color:var(--muted);text-align:right;margin-top:4px}
.tb-reset{margin-top:10px;width:100%;border:0;background:transparent;color:var(--muted);font-size:.78rem;padding:6px;border-radius:8px;cursor:pointer}
.tb-reset:hover{background:var(--hover);color:var(--text)}
@media(max-width:820px){.tb-menu{display:flex}}

/* ---------- points page ---------- */
.keep-row{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer}
.set-item .go{margin-left:auto;color:var(--muted);font-size:1rem}
.pt-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pt-bal{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:14px;padding:12px 18px;text-align:center;min-width:132px}
.pt-bal b{display:block;font-size:1.7rem;line-height:1.1}
.pt-bal span{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;opacity:.9}
.pt-segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pt-seg{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .12s}
.pt-seg:hover{border-color:var(--brand);color:var(--text)}
.pt-seg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:transform .1s,box-shadow .12s}
.pt-row:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pt-rank{width:30px;text-align:center;font-weight:800;color:var(--muted);flex-shrink:0}
.pt-who{flex:1;min-width:0;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt-who small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.pt-sc{font-weight:800;color:var(--brand);font-size:1.05rem;flex-shrink:0}
.pt-chip{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pt-chip.owner{background:rgba(247,166,0,.18);color:#a86b00}
.pt-chip.manager{background:rgba(91,70,201,.16);color:var(--brand)}
.pt-chip.admin{background:rgba(16,185,129,.16);color:#0b7a5b}
.pt-chip.me{background:var(--brand);color:#fff}
body.dark .pt-chip.owner{color:#f7c96b}
body.dark .pt-chip.admin{color:#34d399}
.pt-detail{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:18px}
.pt-big{font-size:2.4rem;font-weight:800;color:var(--brand);line-height:1}
.pt-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:16px 0 8px}
.pt-ctrls{display:flex;gap:6px;flex-wrap:wrap}
.pt-note{width:100%;min-height:74px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);resize:vertical}
.pt-card{display:flex;align-items:center;gap:13px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 15px;margin-bottom:9px}
.pt-card .ic{font-size:1.5rem;flex-shrink:0}
.pt-card b{display:block;font-size:.92rem}
.pt-card small{color:var(--muted);font-size:.78rem}
.pt-cost{margin-left:auto;font-weight:800;color:var(--brand);flex-shrink:0;white-space:nowrap}
.pt-req{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 15px;margin-bottom:9px}
.pt-req .who{font-weight:700;margin-bottom:3px}
.pt-req .mt{color:var(--muted);font-size:.8rem;margin-bottom:10px}
/* ---------- profile modal ---------- */
.pf-prev{display:flex;align-items:center;gap:13px;background:var(--soft);border-radius:12px;padding:13px;margin-bottom:15px}
.pf-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;flex-shrink:0;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover}
.modal-card textarea{width:100%;min-height:74px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.88rem;background:var(--bg);color:var(--text);resize:vertical}

/* ---------- Matix AI ---------- */
.ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);max-width:860px;margin:0 auto}
.ai-head{display:flex;align-items:center;gap:11px;padding:4px 0 14px}
.ai-orb{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ai-head b{font-size:1.1rem;display:block}
.ai-head small{color:var(--muted);font-size:.8rem}
.ai-scroll{flex:1;overflow-y:auto;padding:4px 2px 12px}
.ai-msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.ai-msg .av{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:var(--soft);color:var(--text)}
.ai-msg.me .av{background:var(--brand);color:#fff}
.ai-bub{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;font-size:.9rem;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.ai-msg.me .ai-bub{background:var(--brand);border-color:var(--brand);color:#fff}
.ai-bub code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.85em}
.ai-msg.me .ai-bub code{background:rgba(255,255,255,.2)}
.ai-act{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:10px;background:var(--soft);padding:9px 12px;margin:8px 0;font-size:.84rem}
.ai-act .tick{color:var(--brand);font-weight:800;flex-shrink:0}
.ai-act.fail{border-left-color:#e5484d}
.ai-act.fail .tick{color:#e5484d}
.ai-think{display:flex;gap:5px;padding:4px 2px}
.ai-think i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block;animation:aiBounce 1.1s infinite}
.ai-think i:nth-child(2){animation-delay:.15s}
.ai-think i:nth-child(3){animation-delay:.3s}
@keyframes aiBounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.ai-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.ai-chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:.8rem;cursor:pointer;transition:border-color .12s,transform .1s}
.ai-chip:hover{border-color:var(--brand);transform:translateY(-1px)}
.ai-bar{display:flex;gap:9px;align-items:flex-end;border-top:1px solid var(--border);padding-top:12px}
.ai-bar textarea{flex:1;min-height:46px;max-height:150px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:.9rem;background:var(--card);color:var(--text);resize:none}
.ai-bar textarea:focus{outline:none;border-color:var(--brand)}
.ai-warn{border:1px solid var(--border);border-radius:12px;background:var(--soft);padding:14px 16px;font-size:.86rem;line-height:1.6;margin-bottom:14px}
.ai-warn b{display:block;margin-bottom:5px}
.ai-warn code{background:var(--card);border:1px solid var(--border);padding:2px 6px;border-radius:6px;font-size:.85em}
body.dark .ai-bub{background:#232323}
body.dark .ai-msg.me .ai-bub{background:var(--brand)}
body.dark .ai-warn{background:#1e1e22;border-color:var(--border)}
body.dark .ai-chip{background:#2a2a2e;border-color:var(--border)}
body.dark .tb-panel{background:#1e1e22}

/* ---------- Theme customiser / club site / bans / likes ---------- */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.th-card{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;background:var(--card);transition:transform .12s,border-color .12s,box-shadow .12s}
.th-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(40,63,113,.14)}
.th-card.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,70,201,.16)}
.th-sw{height:38px;border-radius:10px;margin-bottom:9px}
.th-nm{font-weight:700;font-size:.9rem}
.th-dots{display:flex;gap:5px;margin-top:6px}
.th-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.th-pick{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.th-pick label{display:block;font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.03em}
.th-pick input[type=color]{width:64px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:3px;cursor:pointer}
.th-lock{text-align:center;padding:34px 20px}
.th-lock .big{font-size:2.6rem}
.th-bar{height:9px;border-radius:99px;background:var(--soft,#eee);overflow:hidden;margin:12px auto 6px;max-width:320px}
.th-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent,#F7A600))}
.u-ban{margin-top:8px;width:100%;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:9px;padding:5px 8px;font-size:.74rem;font-weight:700;cursor:pointer}
.u-ban:hover{border-color:#e5484d;color:#e5484d}
.u-ban.on{border-color:#16a34a;color:#16a34a}
.btn.liked{color:#e5484d;border-color:rgba(229,72,77,.45)}

.ai-keyrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-keyrow input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.ai-keyok{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.ai-keyok .lnk{border:none;background:none;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline;font-size:.8rem;padding:0}
body.dark .ai-keyrow input{background:#1d1d1d}

/* ---------- Math Chat ---------- */
.mc{display:flex;height:100%;overflow:hidden}
.mc-side{width:290px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--card)}
.mc-shead{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.mc-shead b{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.mc-search{width:100%;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--soft);color:var(--text);font-size:.85rem}
.mc-list{flex:1;overflow-y:auto;padding:6px}
.mc-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .12s}
.mc-row:hover{background:var(--hover)}
.mc-row.on{background:linear-gradient(120deg,rgba(91,70,201,.14),rgba(247,166,0,.10))}
.mc-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem;background:linear-gradient(135deg,var(--brand),var(--brand2));overflow:hidden;position:relative}
.mc-av img{width:100%;height:100%;object-fit:cover}
.mc-dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.mc-mid{min-width:0;flex:1}
.mc-nm{font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:6px}
.mc-pv{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mc-end{text-align:right;flex-shrink:0}
.mc-tm{font-size:.68rem;color:var(--muted)}
.mc-un{display:inline-block;min-width:19px;padding:1px 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:.68rem;font-weight:800;margin-top:4px}
.mc-badge{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:99px;border:1px solid}
.mc-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--soft)}
.mc-top{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.mc-top .mc-av{width:36px;height:36px}
.mc-tn{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:7px}
.mc-st{font-size:.72rem;color:var(--muted)}
.mc-st.on{color:#22c55e;font-weight:700}
.mc-back{display:none;border:none;background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.mc-msgs{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:3px}
.mc-day{align-self:center;font-size:.68rem;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 12px;border-radius:99px;margin:12px 0 8px}
.mc-b{max-width:min(74%,540px);padding:8px 13px;border-radius:16px;font-size:.9rem;line-height:1.5;position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(40,63,113,.07)}
.mc-b.in{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.mc-b.out{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom-right-radius:5px}
.mc-b.sticker{background:transparent!important;box-shadow:none;font-size:2.6rem;padding:2px 6px;line-height:1.1}
.mc-b.math{font-family:ui-monospace,Menlo,monospace;font-size:1rem;background:var(--card);border:1px dashed var(--brand);color:var(--text)}
.mc-b.math.out{background:rgba(91,70,201,.10)}
.mc-meta{display:block;font-size:.62rem;opacity:.62;margin-top:3px;text-align:right}
.mc-b.out .mc-meta{color:#fff}
.mc-type{align-self:flex-start;display:flex;gap:4px;padding:9px 14px;background:var(--card);border-radius:16px;border-bottom-left-radius:5px;margin-top:4px}
.mc-type i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:mcB 1s infinite}
.mc-type i:nth-child(2){animation-delay:.15s}
.mc-type i:nth-child(3){animation-delay:.3s}
@keyframes mcB{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.mc-bar{display:flex;gap:8px;align-items:flex-end;padding:11px 14px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0}
.mc-bar textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:9px 13px;background:var(--soft);color:var(--text);font:inherit;font-size:.88rem;max-height:120px}
.mc-ib{border:1px solid var(--border);background:var(--soft);color:var(--text);width:38px;height:38px;border-radius:11px;font-size:1.05rem;cursor:pointer;flex-shrink:0;transition:background .12s}
.mc-ib:hover{background:var(--hover);border-color:var(--brand)}
.mc-pick{position:absolute;bottom:66px;left:14px;right:14px;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.18);padding:11px;display:none;z-index:5}
.mc-pick.open{display:block}
.mc-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.mc-grid button{border:none;background:transparent;font-size:1.2rem;padding:5px 0;border-radius:8px;cursor:pointer}
.mc-grid button:hover{background:var(--hover)}
.mc-mrow{display:flex;gap:8px;margin-top:8px}
.mc-mrow input{flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 11px;background:var(--soft);color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.mc-prev{margin-top:8px;padding:9px;border:1px dashed var(--border);border-radius:10px;text-align:center;color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:.9rem;min-height:38px}
.mc-wrapmain{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.mc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:30px}
.mc-empty .big{font-size:3rem}
.mc-enc{align-self:center;font-size:.7rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:5px 13px;border-radius:10px;margin-bottom:10px;text-align:center;max-width:88%}
body.dark .mc-side,body.dark .mc-top,body.dark .mc-bar,body.dark .mc-b.in,body.dark .mc-day,body.dark .mc-type,body.dark .mc-pick,body.dark .mc-enc{background:#1d1d1d}
body.dark .mc-main{background:#141414}
body.dark .mc-search,body.dark .mc-bar textarea,body.dark .mc-ib,body.dark .mc-mrow input{background:#262626}
body.dark .mc-b.math{background:#232323}
@media(max-width:820px){
  .mc-side{width:100%;position:absolute;inset:0;z-index:3}
  .mc.conv .mc-side{display:none}
  .mc-back{display:block}
  .mc-b{max-width:86%}
}
</style>
</head>
<body>

<!-- ========== SIGN IN ========== -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo" id="gateLogo"></div>
    <h1 id="gTitle">Sign in to Matix</h1>
    <p id="gSub">Your math club workspace</p>
    <div class="fld"><label>Username</label><input id="gUser" placeholder="username" autocomplete="username"></div>
    <div class="fld"><label>Password</label><input id="gPass" type="password" placeholder="password" autocomplete="current-password"></div>
    <label class="toggle keep-row" id="gKeepWrap"><input type="checkbox" id="gKeep" checked><span>Keep me signed in on this device</span></label>
    <div class="err" id="gErr"></div>
    <button class="btn block" id="gBtn">Sign in</button>
    <div class="swap" id="gSwap">New to Matix? <a id="gSwapA">Create an account</a></div>
  </div>
</div>

<!-- ========== DESKTOP TITLE BAR (Matix app only) ========== -->
<div class="titlebar" id="titlebar">
  <div class="tb-left">
    <div class="tb-logo" id="tbLogo"></div>
    <span class="tb-title">Matix</span>
    <button class="tb-ico-btn" id="tbSettings" title="Appearance — brightness &amp; dark mode">⚙</button>
    <button class="tb-ico-btn tb-menu" id="tbMenu" title="Menu">☰</button>
  </div>
  <div class="tb-tabs" id="tbTabs"></div>
  <div class="tb-grab"></div>
  <div class="tb-btns">
    <button class="tb-btn" id="tbReload" title="Reload this tab (Ctrl R)"><span class="sp">↻</span></button>
    <button class="tb-btn" id="tbMin" title="Minimize">─</button>
    <button class="tb-btn" id="tbMax" title="Maximize">☐</button>
    <button class="tb-btn close" id="tbClose" title="Close">✕</button>
  </div>
</div>

<div class="tb-panel" id="tbPanel">
  <h4>Appearance</h4>
  <div class="tb-modes">
    <button class="tb-mode" id="tbLight"><span>☀️</span><span>Light</span></button>
    <button class="tb-mode" id="tbDark"><span>🌙</span><span>Dark</span></button>
  </div>
  <h4>Brightness</h4>
  <div class="tb-brow"><span>🔅</span><input type="range" id="tbBright" min="60" max="120" step="5" value="100"><span>🔆</span></div>
  <div class="tb-bval" id="tbBrightVal">100%</div>
  <button class="tb-reset" id="tbBrightReset">Reset to 100%</button>
</div>

<!-- ========== APP ========== -->
<div id="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sb-top">
        <div class="ws"><div class="ws-logo" id="wsLogo"></div><div class="ws-name">Matix<small>the Math Club</small></div></div>
      </div>
      <div class="sb-search" id="openSearch"><span>🔍</span><span>Search</span><kbd>Ctrl K</kbd></div>
      <nav class="nav" id="nav"></nav>
      <div class="sb-settings">
        <div class="nav-lbl"><span>Settings</span></div>
        <button class="set-item" id="profileBtn">
          <span class="ic">🎨</span>
          <span class="nm">My profile</span>
          <span class="go">›</span>
        </button>
        <button class="set-item" id="darkToggle">
          <span class="ic" id="darkIcon">🌙</span>
          <span class="nm">Dark mode</span>
          <span class="switch" id="darkSwitch"></span>
        </button>
      </div>
      <div class="sb-foot">
        <div class="avatar" id="sbAv"></div>
        <div class="u"><b id="sbName"></b><span id="sbRole"></span></div>
        <button class="icon-btn" id="signOut" title="Sign out">⏻</button>
      </div>
    </aside>

    <div class="main">
      <div class="tabstrip" id="tabstrip">
        <button class="menu-toggle" id="menuToggle">☰</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<!-- ========== SEARCH PALETTE ========== -->
<div class="overlay" id="overlay">
  <div class="palette">
    <div class="pin"><span>🔍</span><input id="paletteInput" placeholder="Search pages, games and ideas…" autocomplete="off"></div>
    <div class="presults" id="presults"></div>
  </div>
</div>

<!-- ========== GENERIC MODAL ========== -->
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>

<!-- ========== CUSTOM ALERT / CONFIRM ========== -->
<div class="cc-modal" id="ccModal">
  <div class="cc-box">
    <div class="cc-icon" id="ccIcon">❓</div>
    <div class="cc-msg" id="ccMsg"></div>
    <div class="cc-actions">
      <button class="btn ghost" id="ccCancel">Cancel</button>
      <button class="btn danger" id="ccOk">OK</button>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   Matix Workspace — single-file Notion-style app
   Firebase Realtime DB via REST (compatible with existing Matix data)
   ===================================================================== */
var FB='https://matix-1d538-default-rtdb.firebaseio.com';
var IDEAS_FB='https://matix-the-math-club-views-default-rtdb.firebaseio.com';
var VALID_MEMBERS={ghadi:'iamtheownerofmatix',dahlia:'cheeseflower',yara:'yara10yoyo20',jad:'ilikebatatameshwiyye',marwan:'ilikebeingnumberonebutiamnumbertwo',mak:'mak2130',hicham:'pwrbulleye'};
var OWNERS=['ghadi'];

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
/* ---------- Custom alert / confirm / toast (replaces native browser dialogs) ---------- */
function customConfirm(msg,onYes,opts){
  opts=opts||{};
  var m=$('ccModal');$('ccMsg').textContent=msg;$('ccIcon').textContent=opts.icon||(opts.alertOnly?'ℹ️':'❓');
  var cancelBtn=$('ccCancel'),okBtn=$('ccOk');
  cancelBtn.style.display=opts.alertOnly?'none':'';
  okBtn.textContent=opts.okText||(opts.alertOnly?'OK':'Confirm');
  okBtn.className='btn '+(opts.danger===false?'':'danger');
  m.classList.add('open');
  function close(){m.classList.remove('open');okBtn.onclick=null;cancelBtn.onclick=null;m.onclick=null;document.removeEventListener('keydown',onKey);}
  var settled=false;
  function no(){if(settled)return;settled=true;close();if(opts.onCancel)opts.onCancel();}
  function yes(){if(settled)return;settled=true;close();if(onYes)onYes();}
  function onKey(e){if(e.key==='Escape'){no();}else if(e.key==='Enter'){yes();}}
  okBtn.onclick=yes;
  cancelBtn.onclick=no;
  m.onclick=function(e){if(e.target===m)no();};
  document.addEventListener('keydown',onKey);
}
function customAlert(msg,onOk,opts){
  opts=opts||{};opts.alertOnly=true;opts.danger=opts.danger===undefined?false:opts.danger;
  if(!opts.onCancel&&onOk)opts.onCancel=onOk;
  customConfirm(msg,onOk,opts);
}
function toast(msg,kind){
  var w=$('toastWrap');
  if(!w){w=el('div','toast-wrap');w.id='toastWrap';document.body.appendChild(w);}
  var t=el('div','toast'+(kind?' '+kind:''),esc(msg));
  w.appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},250);},2800);
}
function initials(u){return (u||'?').slice(0,2).toUpperCase();}
function normUser(u){var c=String(u||'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(c==='matix'||c==='ghadimatix')return 'ghadi';return c;}
function timeAgo(ms){if(!ms)return '';var s=Math.floor((Date.now()-ms)/1000);if(s<60)return 'just now';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';var d=Math.floor(h/24);if(d<30)return d+'d ago';return new Date(ms).toLocaleDateString();}
function fileToText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsText(f);});}
function fileToDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}

/* ---------- Firebase REST ---------- */
function fbGet(path,base){return fetch((base||FB)+path+'.json').then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPut(path,data,base){return fetch((base||FB)+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPost(path,data,base){return fetch((base||FB)+path+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPatch(path,data,base){return fetch((base||FB)+path+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbDel(path,base){return fetch((base||FB)+path+'.json',{method:'DELETE'})['catch'](function(){});}

/* ---------- auth ---------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
var KEEP_KEY='mx_keep_user';
function wantsKeep(){var b=$('gKeep');return b?!!b.checked:true;}
function getUser(){return sessionStorage.getItem('mx_user')||sessionStorage.getItem('matix_auth_user')||lsGet(KEEP_KEY)||null;}
function setUser(u){sessionStorage.setItem('mx_user',u);sessionStorage.setItem('matix_auth_user',u);if(wantsKeep()){lsSet(KEEP_KEY,u);}else{lsDel(KEEP_KEY);}}
function clearUser(){sessionStorage.removeItem('mx_user');sessionStorage.removeItem('matix_auth_user');}
var ROLE_OWNER=false;
var OWNER_SECTIONS=[{kind:'changelog',icon:'📝',name:'Changelog'}];
function findSection(k){var a=STATIC.concat(OWNER_SECTIONS);for(var i=0;i<a.length;i++)if(a[i].kind===k)return a[i];return null;}
function isOwner(u){return ROLE_OWNER||OWNERS.indexOf(normUser(u||ME))>=0;}
var ME=null;

function doSignIn(rawU,pass){
  var u=(rawU||'').toLowerCase().replace(/\s+/g,'').trim();
  if(!u||!pass)return Promise.resolve(false);
  return fbGet('/members/'+encodeURIComponent(u)).then(function(data){
    if(data&&data.password){return data.password===pass;}
    return (VALID_MEMBERS[u]&&VALID_MEMBERS[u]===pass);
  }).then(function(ok){
    if(!ok)return false;
    return fbGet('/bans/'+encodeURIComponent(u)).then(function(b){
      if(b){toast('This account has been suspended by the owner.','err');return false;}
      setUser(u);return true;
    });
  });
}
function doJoin(rawU,pass){
  var u=(rawU||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!u||u.length<2)return Promise.resolve('short');
  if(!pass||pass.length<4)return Promise.resolve('shortpass');
  if(VALID_MEMBERS[u])return Promise.resolve('reserved');
  return fbGet('/members/'+encodeURIComponent(u)).then(function(ex){
    if(ex)return 'taken';
    return fbPut('/members/'+encodeURIComponent(u),{password:pass,joinedAt:Date.now(),testUser:true}).then(function(){
      fbPut('/profiles/'+encodeURIComponent(u),{displayName:u,bio:'',updatedAt:Date.now()});
      setUser(u);return 'ok';
    });
  });
}
function verifyPassword(u,pass){
  if(!pass)return Promise.resolve(false);
  return fbGet('/members/'+encodeURIComponent(u)).then(function(m){
    if(m&&m.password)return m.password===pass;
    return VALID_MEMBERS[u]===pass;
  });
}

  $('gSwapA').onclick=function(){authMode=join?'signin':'join';refreshGate();$('gErr').textContent='';};
}
$('gBtn').onclick=async function(){
  var b=$('gBtn'),e=$('gErr');e.textContent='';b.disabled=true;
  var u=$('gUser').value,p=$('gPass').value;
  if(authMode==='join'){
    var r=await doJoin(u,p);
    if(r==='ok'){enterApp();}
    else{e.textContent={short:'Username too short (min 2).',shortpass:'Password too short (min 4).',reserved:'That username is reserved.',taken:'That username is already taken.'}[r]||'Could not create account.';b.disabled=false;}
  }else{
    var ok=await doSignIn(u,p);
    if(ok){enterApp();}else{e.textContent='Wrong username or password.';b.disabled=false;}
  }
};
$('gPass').addEventListener('keydown',function(e){if(e.key==='Enter')$('gBtn').click();});

function enterApp(){
  ME=normUser(getUser());
  $('gate').style.display='none';
  $('app').style.display='block';
  $('sbName').textContent=ME;
  setLogos();
  $('sbRole').textContent=isOwner()?'Owner':'Member';

  renderNav();

}
function loadAvatar(){
  fbGet('/profiles/'+encodeURIComponent(ME)).then(function(pr){
    var av=$('sbAv'); if(!av)return;
    if(!pr){av.textContent=initials(ME);return;}
    var img=profileImg(pr);
    if(img){
      av.textContent='';
      av.style.backgroundImage='url('+img+')';
      av.style.backgroundSize='cover';
      av.style.backgroundPosition='center';
      return;
    }
    /* never print raw image data as text - fall back to emoji, then initials */
    var e=safeEmoji(pr.emoji||pr.avatar);
    av.textContent=e||initials(ME);
  });
}

];
function renderNav(){
  var nav=$('nav');nav.innerHTML='';
  STATIC.forEach(function(s){
    var it=el('div','nav-item','<span class="ic">'+s.icon+'</span><span class="nm">'+s.name+'</span>');
    it.dataset.kind=s.kind;
    it.onclick=function(){openTab({kind:s.kind});};
    nav.appendChild(it);
  });
  if(isOwner()){var ol=el('div','nav-lbl');ol.innerHTML='<span>Owner</span>';nav.appendChild(ol);OWNER_SECTIONS.forEach(function(s){var oi=el('div','nav-item','<span class="ic">'+s.icon+'</span><span class="nm">'+s.name+'</span>');oi.dataset.kind=s.kind;oi.onclick=function(){openTab({kind:s.kind});};nav.appendChild(oi);});}

  nav.appendChild(lbl);
  var listWrap=el('div');listWrap.id='pagesList';nav.appendChild(listWrap);

}
function loadCustomPages(){
  fbGet('/apppages').then(function(o){
    CUSTOM_PAGES=o||{};
    var w=$('pagesList');if(!w)return;w.innerHTML='';
    var keys=Object.keys(CUSTOM_PAGES).filter(function(k){return !CUSTOM_PAGES[k].searchOnly;}).sort(function(a,b){return (CUSTOM_PAGES[a].at||0)-(CUSTOM_PAGES[b].at||0);});
    if(!keys.length){w.innerHTML='<div style="padding:6px 8px;font-size:.8rem;color:var(--muted)">'+(isOwner()?'No pages yet — click + to add one.':'No pages yet.')+'</div>';}
    keys.forEach(function(k){
      var p=CUSTOM_PAGES[k];
      var it=el('div','nav-item','<span class="ic">'+(p.icon||'📄')+'</span><span class="nm">'+esc(p.name||'Untitled')+'</span>');
      it.dataset.pageid=k;
      it.onclick=function(){openTab({kind:'page',refId:k});};
      if(isOwner()){var d=el('button','del','×');d.title='Delete page';d.onclick=function(e){e.stopPropagation();customConfirm('Delete page "'+(p.name||'')+'"?',function(){fbDel('/apppages/'+k).then(function(){closeTabsFor('page',k);loadCustomPages();toast('Page deleted');});});};it.appendChild(d);}

function highlightNav(){
  var t=activeTab();
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
  if(!t)return;
  if(t.kind==='page'){var n=document.querySelector('.nav-item[data-pageid="'+t.refId+'"]');if(n)n.classList.add('active');}
  else{var n2=document.querySelector('.nav-item[data-kind="'+t.kind+'"]');if(n2)n2.classList.add('active');}
}

/* =====================================================================
   TABS
   ===================================================================== */
var TABS=[];var ACTIVE=null;var tabSeq=1;
function activeTab(){for(var i=0;i<TABS.length;i++)if(TABS[i].id===ACTIVE)return TABS[i];return null;}
function tabMeta(spec){
  if(spec.kind==='page'){var p=CUSTOM_PAGES[spec.refId]||{};return {icon:p.icon||'📄',title:p.name||'Page'};}
  if(spec.kind==='game'){return {icon:'🎮',title:spec.title||'Game'};}
  var s=findSection(spec.kind)||{icon:'📄',name:'Page'};
  return {icon:s.icon,title:s.name};
}
function sameRef(a,b){return a.kind===b.kind && (a.refId||'')===(b.refId||'');}
function openTab(spec){
  for(var i=0;i<TABS.length;i++){if(sameRef(TABS[i],spec)){ACTIVE=TABS[i].id;drawTabs();renderContent();return;}}
  var m=tabMeta(spec);
  var t={id:tabSeq++,kind:spec.kind,refId:spec.refId||null,title:m.title,icon:m.icon};
  TABS.push(t);ACTIVE=t.id;drawTabs();renderContent();
  if(window.innerWidth<=820)$('sidebar').classList.remove('open');
}
function closeTab(id){
  var idx=-1;for(var i=0;i<TABS.length;i++)if(TABS[i].id===id)idx=i;
  if(idx<0)return;
  TABS.splice(idx,1);
  if(ACTIVE===id){if(TABS.length){ACTIVE=TABS[Math.max(0,idx-1)].id;}else{ACTIVE=null;}}
  drawTabs();renderContent();
}
function closeTabsFor(kind,refId){TABS=TABS.filter(function(t){return !(t.kind===kind&&t.refId===refId);});if(!activeTab()&&TABS.length)ACTIVE=TABS[TABS.length-1].id;drawTabs();renderContent();}
/* ---------- owner: delete an item (app page or game) from anywhere ---------- */
function canDeleteItem(kind){return isOwner()&&(kind==='page'||kind==='game');}
function deleteItem(kind,refId,name,done){
  if(!canDeleteItem(kind))return;
  var label=kind==='game'?'game':'page';
  customConfirm('Delete the '+label+' “'+(name||'Untitled')+'”?\nThis cannot be undone.',function(){
    var path=kind==='game'?('/hubprojects/'+refId):('/apppages/'+refId);
    fbDel(path).then(function(){
      closeTabsFor(kind,refId);
      if(kind==='page'){loadCustomPages();}
      toast((kind==='game'?'Game':'Page')+' deleted','ok');
      if(done)done();
    })['catch'](function(){toast('Could not delete — check your connection.','err');});
  },{icon:'🗑️',okText:'Delete'});
}
function tabHost(){
  var tb=$('tbTabs');
  if(tb)return tb;
  return $('tabstrip');
}
function drawTabs(){
  var strip=tabHost();
  [$('tabstrip'),$('tbTabs')].forEach(function(h){if(h)h.querySelectorAll('.tab,.tab-add').forEach(function(n){n.remove();});});
  TABS.forEach(function(t){
    var tab=el('div','tab'+(t.id===ACTIVE?' active':''));
    tab.innerHTML='<span class="ic">'+t.icon+'</span><span class="lb">'+esc(t.title)+'</span>';
    if(canDeleteItem(t.kind)&&t.refId){
      var dl=el('button','tdel','🗑');dl.title='Delete this '+(t.kind==='game'?'game':'page')+' (owner)';
      dl.onclick=function(e){e.stopPropagation();deleteItem(t.kind,t.refId,t.title);};
      tab.appendChild(dl);
    }
    var x=el('button','x','×');x.title='Close tab';x.onclick=function(e){e.stopPropagation();closeTab(t.id);};
    tab.appendChild(x);
    tab.onclick=function(){ACTIVE=t.id;drawTabs();renderContent();};
    strip.appendChild(tab);
  });
  var add=el('button','tab-add','+');add.title='Open new tab (search)';add.onclick=openPalette;strip.appendChild(add);
  highlightNav();
}
function renderContent(){
  var c=$('content');var t=activeTab();
  if(!t){c.innerHTML='<div class="empty" style="padding-top:120px"><div class="big">📄</div>No tab open.<br><br><button class="btn" onclick="openPalette()">+ Open a page</button></div>';return;}
  if(t.kind==='home')return renderHome(c);
  if(t.kind==='games')return renderGames(c);
  if(t.kind==='ideas')return renderIdeas(c);
  if(t.kind==='messages')return renderMessages(c);
  if(t.kind==='lessons')return renderLessons(c);
  if(t.kind==='points')return renderPoints(c);
  if(t.kind==='ai')return renderAI(c);
  if(t.kind==='theme')return renderTheme(c);
  if(t.kind==='chat')return renderChat(c);
  if(t.kind==='changelog')return renderChangelog(c);
  if(t.kind==='users')return renderUsers(c);
  if(t.kind==='bugs')return renderBugs(c);
  if(t.kind==='page')return renderCustomPage(c,t.refId);
  if(t.kind==='game')return renderGamePlay(c,t.refId);
}

/* =====================================================================
   GAMES HUB (like hub.html) — mini internal router
   ===================================================================== */
var gamesView={name:'list'};
function renderGames(c){
  if(gamesView.name==='list')return gamesList(c);
  if(gamesView.name==='mine')return gamesMine(c);
  if(gamesView.name==='create')return gamesCreate(c);
  if(gamesView.name==='project')return gamesProject(c,gamesView.id);
  if(gamesView.name==='edit')return gamesEdit(c,gamesView.id);
  gamesList(c);
}
function gamesHeader(active){
  return '<div class="toolbar"><div class="seg">'+
    '<button data-g="list" class="'+(active==='list'?'active':'')+'">Explore</button>'+
    '<button data-g="mine" class="'+(active==='mine'?'active':'')+'">My projects</button>'+
    '</div><button class="btn accent" data-g="create" style="margin-left:auto">�� New game</button></div>';
}
function wireGamesHeader(c){document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){gamesView={name:b.dataset.g};renderGames(c);};});}
function thumbBox(p){var G=['#a5b4fc,#c4b5fd','#fca5a5,#fdba74','#6ee7b7,#93c5fd','#f9a8d4,#c4b5fd','#fcd34d,#fca5a5','#67e8f9,#a5b4fc'];var h=0,s=p.name||'';for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;var g=G[h%G.length];return p.thumb?'<div class="thumb" style="background-image:url('+p.thumb+')"></div>':'<div class="thumb" style="background:linear-gradient(135deg,'+g+')">🎮</div>';}
function gamesList(c){
  c.innerHTML='<div class="wrap wide"><div class="page-title"><span class="emoji">🎮</span>Games Hub</div><div class="page-sub">Play games made by the club — or build your own and publish it for everyone.</div>'+gamesHeader('list')+'<div id="gGrid">Loading���</div></div>';
  wireGamesHeader(c);
  fbGet('/hubprojects').then(function(o){
    o=o||{};var arr=Object.keys(o).map(function(k){var v=o[k]||{};v.id=k;return v;}).filter(function(v){return v.published!==false;});
    arr.sort(function(a,b){return likeCount(b)-likeCount(a);});
    var g=$('gGrid');
    if(!arr.length){g.innerHTML='<div class="empty"><div class="big">🎮</div>No games yet — be the first to publish one!</div>';return;}
    g.innerHTML='<div class="grid">'+arr.map(function(p){return '<div class="pcard" data-open="'+p.id+'">'+thumbBox(p)+'<div class="meta"><div class="pn">'+esc(p.name||'Untitled')+(p.madeWithAI?'<span class="tag ai">✨ AI</span>':'')+'</div><div class="pb">by @'+esc(p.author||'?')+' · '+(iLike(p)?'❤':'🤍')+' '+likeCount(p)+'</div></div></div>';}).join('')+'</div>';
    g.querySelectorAll('[data-open]').forEach(function(card){card.onclick=function(){gamesView={name:'project',id:card.dataset.open};renderGames(c);};});
  });
