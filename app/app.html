.tb-menu{display:none}
.tb-tabs{flex:1;min-width:0;display:flex;align-items:center;gap:3px;height:100%;padding:0 8px;overflow-x:auto;-webkit-app-region:no-drag;app-region:no-drag}
.tb-tabs::-webkit-scrollbar{height:0}
.tb-tabs .tab{top:0;border:0;border-radius:8px;color:rgba(255,255,255,.8);background:transparent;padding:5px 9px;max-width:170px}
.tb-tabs .tab:hover{background:rgba(255,255,255,.14);color:#fff}
.tb-tabs .tab.active{background:rgba(255,255,255,.95);color:var(--brand2);font-weight:700;box-shadow:none}
body.dark .tb-tabs .tab{color:var(--muted)}
body.dark .tb-tabs .tab:hover{background:rgba(255,255,255,.08);color:var(--text)}
body.dark .tb-tabs .tab.active{background:#2c2c2c;color:var(--text);box-shadow:none}
.tb-tabs .tab-add{color:rgba(255,255,255,.85)}
.tb-tabs .tab-add:hover{background:rgba(255,255,255,.16);color:#fff}
body.dark .tb-tabs .tab-add{color:var(--muted)}
.tb-grab{flex:0 0 46px;height:100%;-webkit-app-region:drag;app-region:drag}
.tabstrip{display:none}
#tbReload .sp{display:inline-block;transition:transform .5s ease}
#tbReload.spin .sp{transform:rotate(360deg)}
.tb-panel{position:fixed;top:44px;left:10px;width:262px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:15px;z-index:700;display:none}
.tb-panel.open{display:block}
.tb-panel h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:800;margin:0 0 8px}
.tb-modes{display:flex;gap:7px;margin-bottom:15px}
.tb-mode{flex:1;border:1px solid var(--border);background:transparent;color:var(--text);border-radius:10px;padding:9px 0;font-size:.8rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:border-color .12s,background .12s}
.tb-mode:hover{border-color:var(--brand)}
.tb-mode.on{border-color:var(--brand);background:rgba(91,70,201,.1);color:var(--brand)}
body.dark .tb-mode.on{background:rgba(139,115,255,.16)}
.tb-brow{display:flex;align-items:center;gap:9px}
.tb-brow input[type=range]{flex:1;accent-color:var(--brand)}
.tb-bval{font-size:.78rem;font-weight:700;color:var(--muted);text-align:right;margin-top:4px}
.tb-reset{margin-top:10px;width:100%;border:0;background:transparent;color:var(--muted);font-size:.78rem;padding:6px;border-radius:8px;cursor:pointer}
.tb-reset:hover{background:var(--hover);color:var(--text)}
@media(max-width:820px){.tb-menu{display:flex}}

/* ---------- points page ---------- */
.keep-row{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:8px;cursor:pointer}
.set-item .go{margin-left:auto;color:var(--muted);font-size:1rem}
.pt-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.pt-bal{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:14px;padding:12px 18px;text-align:center;min-width:132px}
.pt-bal b{display:block;font-size:1.7rem;line-height:1.1}
.pt-bal span{font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;opacity:.9}
.pt-segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pt-seg{border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:999px;padding:7px 14px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .12s}
.pt-seg:hover{border-color:var(--brand);color:var(--text)}
.pt-seg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--card);margin-bottom:8px;cursor:pointer;transition:transform .1s,box-shadow .12s}
.pt-row:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.pt-rank{width:30px;text-align:center;font-weight:800;color:var(--muted);flex-shrink:0}
.pt-who{flex:1;min-width:0;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pt-who small{display:block;color:var(--muted);font-weight:400;font-size:.75rem}
.pt-sc{font-weight:800;color:var(--brand);font-size:1.05rem;flex-shrink:0}
.pt-chip{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pt-chip.owner{background:rgba(247,166,0,.18);color:#a86b00}
.pt-chip.manager{background:rgba(91,70,201,.16);color:var(--brand)}
.pt-chip.admin{background:rgba(16,185,129,.16);color:#0b7a5b}
.pt-chip.me{background:var(--brand);color:#fff}
body.dark .pt-chip.owner{color:#f7c96b}
body.dark .pt-chip.admin{color:#34d399}
.pt-detail{border:1px solid var(--border);border-radius:16px;background:var(--card);padding:18px}
.pt-big{font-size:2.4rem;font-weight:800;color:var(--brand);line-height:1}
.pt-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:16px 0 8px}
.pt-ctrls{display:flex;gap:6px;flex-wrap:wrap}
.pt-note{width:100%;min-height:74px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.85rem;background:var(--bg);color:var(--text);resize:vertical}
.pt-card{display:flex;align-items:center;gap:13px;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 15px;margin-bottom:9px}
.pt-card .ic{font-size:1.5rem;flex-shrink:0}
.pt-card b{display:block;font-size:.92rem}
.pt-card small{color:var(--muted);font-size:.78rem}
.pt-cost{margin-left:auto;font-weight:800;color:var(--brand);flex-shrink:0;white-space:nowrap}
.pt-req{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:13px 15px;margin-bottom:9px}
.pt-req .who{font-weight:700;margin-bottom:3px}
.pt-req .mt{color:var(--muted);font-size:.8rem;margin-bottom:10px}
/* ---------- profile modal ---------- */
.pf-prev{display:flex;align-items:center;gap:13px;background:var(--soft);border-radius:12px;padding:13px;margin-bottom:15px}
.pf-av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;flex-shrink:0;overflow:hidden}
.pf-av img{width:100%;height:100%;object-fit:cover}
.modal-card textarea{width:100%;min-height:74px;border:1px solid var(--border);border-radius:10px;padding:10px;font:inherit;font-size:.88rem;background:var(--bg);color:var(--text);resize:vertical}

/* ---------- Matix AI ---------- */
.ai-wrap{display:flex;flex-direction:column;height:calc(100vh - 120px);max-width:860px;margin:0 auto}
.ai-head{display:flex;align-items:center;gap:11px;padding:4px 0 14px}
.ai-orb{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ai-head b{font-size:1.1rem;display:block}
.ai-head small{color:var(--muted);font-size:.8rem}
.ai-scroll{flex:1;overflow-y:auto;padding:4px 2px 12px}
.ai-msg{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.ai-msg .av{width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.8rem;background:var(--soft);color:var(--text)}
.ai-msg.me .av{background:var(--brand);color:#fff}
.ai-bub{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:11px 14px;font-size:.9rem;line-height:1.55;max-width:100%;overflow-wrap:anywhere}
.ai-msg.me .ai-bub{background:var(--brand);border-color:var(--brand);color:#fff}
.ai-bub code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.85em}
.ai-msg.me .ai-bub code{background:rgba(255,255,255,.2)}
.ai-act{display:flex;align-items:center;gap:9px;border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:10px;background:var(--soft);padding:9px 12px;margin:8px 0;font-size:.84rem}
.ai-act .tick{color:var(--brand);font-weight:800;flex-shrink:0}
.ai-act.fail{border-left-color:#e5484d}
.ai-act.fail .tick{color:#e5484d}
.ai-think{display:flex;gap:5px;padding:4px 2px}
.ai-think i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:block;animation:aiBounce 1.1s infinite}
.ai-think i:nth-child(2){animation-delay:.15s}
.ai-think i:nth-child(3){animation-delay:.3s}
@keyframes aiBounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.ai-chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.ai-chip{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:7px 13px;font-size:.8rem;cursor:pointer;transition:border-color .12s,transform .1s}
.ai-chip:hover{border-color:var(--brand);transform:translateY(-1px)}
.ai-bar{display:flex;gap:9px;align-items:flex-end;border-top:1px solid var(--border);padding-top:12px}
.ai-bar textarea{flex:1;min-height:46px;max-height:150px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:.9rem;background:var(--card);color:var(--text);resize:none}
.ai-bar textarea:focus{outline:none;border-color:var(--brand)}
.ai-warn{border:1px solid var(--border);border-radius:12px;background:var(--soft);padding:14px 16px;font-size:.86rem;line-height:1.6;margin-bottom:14px}
.ai-warn b{display:block;margin-bottom:5px}
.ai-warn code{background:var(--card);border:1px solid var(--border);padding:2px 6px;border-radius:6px;font-size:.85em}
.ai-src{border:1px solid var(--border);border-radius:10px;background:var(--soft);padding:7px 12px;margin:8px 0 8px 38px;font-size:.8rem}
.ai-src summary{cursor:pointer;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
.ai-src summary::-webkit-details-marker{display:none}
.ai-src summary:before{content:'\25B8';display:inline-block;transition:transform .12s}
.ai-src[open] summary:before{transform:rotate(90deg)}
.ai-src-body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:8px;color:var(--text);max-height:260px;overflow:auto;font-size:.82rem}
.ai-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ai-file{border:1px solid var(--border);border-radius:8px;background:var(--soft);padding:0;font-size:.78rem;max-width:260px}
.ai-file summary{cursor:pointer;list-style:none;padding:4px 9px;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ai-file summary::-webkit-details-marker{display:none}
.ai-file-body{white-space:pre-wrap;overflow-wrap:anywhere;padding:0 9px 8px;max-height:200px;overflow:auto;font-size:.78rem;color:var(--text)}
.ai-msg.me .ai-file,.ai-msg.me .ai-file summary{color:#fff;border-color:rgba(255,255,255,.35)}
.ai-attach-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ai-attach-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--soft);border-radius:999px;padding:4px 8px 4px 12px;font-size:.78rem}
.ai-attach-chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.95rem;line-height:1;padding:0 2px}
.ai-ib{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;width:42px;height:46px;font-size:1.05rem;cursor:pointer;flex-shrink:0}
.ai-ib:hover{border-color:var(--brand)}
body.dark .ai-bub{background:#232323}
body.dark .ai-msg.me .ai-bub{background:var(--brand)}
body.dark .ai-warn{background:#1e1e22;border-color:var(--border)}
body.dark .ai-chip{background:#2a2a2e;border-color:var(--border)}
body.dark .ai-src,body.dark .ai-file{background:#1e1e22;border-color:var(--border)}
body.dark .tb-panel{background:#1e1e22}

/* ---------- private: to-do + notes ---------- */
.pv-head{margin-bottom:16px}
.pv-head h2{margin:0 0 4px;font-size:1.2rem}
.pv-head small{color:var(--muted)}
.pv-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:720px){.pv-cols{grid-template-columns:1fr}}
.pv-col{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:14px}
.pv-colhead{font-weight:700;margin-bottom:10px}
.pv-add{display:flex;gap:8px;margin-bottom:10px}
.pv-add input{flex:1;border:1px solid var(--border);border-radius:10px;padding:9px 11px;font:inherit;font-size:.88rem;background:var(--soft);color:var(--text)}
.pv-list{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.pv-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.86rem;background:var(--soft)}
.pv-item label{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer}
.pv-item.done span{text-decoration:line-through;color:var(--muted)}
.pv-del{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.85rem}
.pv-del:hover{color:#e5484d}
.pv-empty{color:var(--muted);font-size:.85rem;padding:8px 2px}

/* ---------- Theme customiser / club site / bans / likes ---------- */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.th-card{border:2px solid var(--border);border-radius:14px;padding:12px;cursor:pointer;background:var(--card);transition:transform .12s,border-color .12s,box-shadow .12s}
.th-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(40,63,113,.14)}
.th-card.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,70,201,.16)}
.th-sw{height:38px;border-radius:10px;margin-bottom:9px}
.th-nm{font-weight:700;font-size:.9rem}
.th-dots{display:flex;gap:5px;margin-top:6px}
.th-dot{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.th-pick{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-top:8px}
.th-pick label{display:block;font-size:.76rem;color:var(--muted);font-weight:700;margin-bottom:5px;letter-spacing:.03em}
.th-pick input[type=color]{width:64px;height:40px;border:1px solid var(--border);border-radius:10px;background:var(--card);padding:3px;cursor:pointer}
.th-lock{text-align:center;padding:34px 20px}
.th-lock .big{font-size:2.6rem}
.th-bar{height:9px;border-radius:99px;background:var(--soft,#eee);overflow:hidden;margin:12px auto 6px;max-width:320px}
.th-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent,#F7A600))}
.u-ban{margin-top:8px;width:100%;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:9px;padding:5px 8px;font-size:.74rem;font-weight:700;cursor:pointer}
.u-ban:hover{border-color:#e5484d;color:#e5484d}
.u-ban.on{border-color:#16a34a;color:#16a34a}
.btn.liked{color:#e5484d;border-color:rgba(229,72,77,.45)}

.ai-keyrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ai-keyrow input{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:.82rem}
.ai-keyok{font-size:.8rem;color:var(--muted);margin-bottom:12px}
.ai-keyok .lnk{border:none;background:none;color:var(--brand);font-weight:700;cursor:pointer;text-decoration:underline;font-size:.8rem;padding:0}
.ai-head .lnk{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;padding:4px 8px;flex-shrink:0;white-space:nowrap}
.ai-head .lnk:hover{color:var(--brand)}
body.dark .ai-keyrow input{background:#1d1d1d}

/* ---------- Math Chat ---------- */
.mc{display:flex;height:100%;overflow:hidden}
.mc-side{width:290px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--card)}
.mc-shead{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.mc-shead b{font-size:1.05rem;font-weight:800;letter-spacing:-.01em}
.mc-search{width:100%;margin-top:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--soft);color:var(--text);font-size:.85rem}
.mc-list{flex:1;overflow-y:auto;padding:6px}
.mc-row{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .12s}
.mc-row:hover{background:var(--hover)}
.mc-row.on{background:linear-gradient(120deg,rgba(91,70,201,.14),rgba(247,166,0,.10))}
.mc-av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem;background:linear-gradient(135deg,var(--brand),var(--brand2));overflow:hidden;position:relative}
.mc-av img{width:100%;height:100%;object-fit:cover}
.mc-dot{position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--card)}
.mc-mid{min-width:0;flex:1}
.mc-nm{font-weight:700;font-size:.88rem;display:flex;align-items:center;gap:6px}
.mc-pv{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mc-end{text-align:right;flex-shrink:0}
.mc-tm{font-size:.68rem;color:var(--muted)}
.mc-un{display:inline-block;min-width:19px;padding:1px 6px;border-radius:99px;background:var(--brand);color:#fff;font-size:.68rem;font-weight:800;margin-top:4px}
.mc-badge{font-size:.62rem;font-weight:800;padding:1px 6px;border-radius:99px;border:1px solid}
.mc-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--soft)}
.mc-top{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.mc-top .mc-av{width:36px;height:36px}
.mc-tn{font-weight:800;font-size:.95rem;display:flex;align-items:center;gap:7px}
.mc-st{font-size:.72rem;color:var(--muted)}
.mc-callbtn{border:none;background:var(--soft);color:var(--brand);width:38px;height:38px;border-radius:50%;font-size:1.05rem;cursor:pointer;margin-left:auto;flex-shrink:0}
.mc-callbtn:hover{background:var(--hover)}
.call-ov{position:fixed;inset:0;background:rgba(10,10,15,.92);z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px}
.call-who{font-size:1.15rem;font-weight:700;text-align:center;padding:0 20px}
.call-remote{width:min(640px,88vw);aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:#111;position:relative}
.call-remote video{width:100%;height:100%;object-fit:cover}
.call-local{position:absolute;width:120px;height:90px;right:12px;bottom:12px;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.5);background:#000}
.call-local video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.call-btns{display:flex;gap:14px;margin-top:4px}
.call-btn{width:56px;height:56px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
.call-btn:hover{background:rgba(255,255,255,.24)}
.call-btn.hangup{background:#e5484d}
.call-btn.hangup:hover{background:#c53a3e}
.call-btn.off{background:rgba(229,72,77,.85)}
.mc-st.on{color:#22c55e;font-weight:700}
.mc-back{display:none;border:none;background:transparent;color:var(--text);font-size:1.1rem;cursor:pointer;padding:2px 6px}
.mc-msgs{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:3px}
.mc-day{align-self:center;font-size:.68rem;font-weight:700;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:3px 12px;border-radius:99px;margin:12px 0 8px}
.mc-b{max-width:min(74%,540px);padding:8px 13px;border-radius:16px;font-size:.9rem;line-height:1.5;position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(40,63,113,.07)}
.mc-b.in{align-self:flex-start;background:var(--card);border-bottom-left-radius:5px}
.mc-b.out{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom-right-radius:5px}
.mc-b.sticker{background:transparent!important;box-shadow:none;font-size:2.6rem;padding:2px 6px;line-height:1.1}
.mc-b.math{font-family:ui-monospace,Menlo,monospace;font-size:1rem;background:var(--card);border:1px dashed var(--brand);color:var(--text)}
.mc-b.math.out{background:rgba(91,70,201,.10)}
.mc-meta{display:block;font-size:.62rem;opacity:.62;margin-top:3px;text-align:right}
.mc-b.out .mc-meta{color:#fff}
.mc-type{align-self:flex-start;display:flex;gap:4px;padding:9px 14px;background:var(--card);border-radius:16px;border-bottom-left-radius:5px;margin-top:4px}
.mc-type i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:mcB 1s infinite}
.mc-type i:nth-child(2){animation-delay:.15s}
.mc-type i:nth-child(3){animation-delay:.3s}
@keyframes mcB{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.mc-bar{display:flex;gap:8px;align-items:flex-end;padding:11px 14px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0}
.mc-bar textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:12px;padding:9px 13px;background:var(--soft);color:var(--text);font:inherit;font-size:.88rem;max-height:120px}
.mc-ib{border:1px solid var(--border);background:var(--soft);color:var(--text);width:38px;height:38px;border-radius:11px;font-size:1.05rem;cursor:pointer;flex-shrink:0;transition:background .12s}
.mc-ib:hover{background:var(--hover);border-color:var(--brand)}
.mc-pick{position:absolute;bottom:66px;left:14px;right:14px;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.18);padding:11px;display:none;z-index:5}
.mc-pick.open{display:block}
.mc-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.mc-grid button{border:none;background:transparent;font-size:1.2rem;padding:5px 0;border-radius:8px;cursor:pointer}
.mc-grid button:hover{background:var(--hover)}
.mc-mrow{display:flex;gap:8px;margin-top:8px}
.mc-mrow input{flex:1;border:1px solid var(--border);border-radius:10px;padding:8px 11px;background:var(--soft);color:var(--text);font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
.mc-prev{margin-top:8px;padding:9px;border:1px dashed var(--border);border-radius:10px;text-align:center;color:var(--muted);font-family:ui-monospace,Menlo,monospace;font-size:.9rem;min-height:38px}
.mc-wrapmain{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}
.mc-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:10px;text-align:center;padding:30px}
.mc-empty .big{font-size:3rem}
.mc-enc{align-self:center;font-size:.7rem;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:5px 13px;border-radius:10px;margin-bottom:10px;text-align:center;max-width:88%}
body.dark .mc-side,body.dark .mc-top,body.dark .mc-bar,body.dark .mc-b.in,body.dark .mc-day,body.dark .mc-type,body.dark .mc-pick,body.dark .mc-enc{background:#1d1d1d}
body.dark .mc-main{background:#141414}
body.dark .mc-search,body.dark .mc-bar textarea,body.dark .mc-ib,body.dark .mc-mrow input{background:#262626}
body.dark .mc-b.math{background:#232323}
@media(max-width:820px){
  .mc-side{width:100%;position:absolute;inset:0;z-index:3}
  .mc.conv .mc-side{display:none}
  .mc-back{display:block}
  .mc-b{max-width:86%}
}
/* ===================== MATH LEARN (Duolingo-style) ===================== */
.lrn{max-width:1000px;margin:0 auto;padding:14px 16px 90px}
.lrn-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20;padding:10px 12px;margin:-6px -6px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.lrn-hud{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.lrn-hud .ic{font-size:17px;line-height:1}
.lrn-hud.fire{color:#ff9600}.lrn-hud.gem{color:#1cb0f6}.lrn-hud.heart{color:#ff4b4b}.lrn-hud.xp{color:#ffc800}
.lrn-hud.boosted{box-shadow:0 0 0 2px #ffc800 inset;animation:lrnPulse 1.4s infinite}
@keyframes lrnPulse{0%,100%{opacity:1}50%{opacity:.6}}
.lrn-nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.lrn-nb{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-weight:800;font-size:13px;cursor:pointer;transition:.15s}
.lrn-nb:hover{transform:translateY(-1px)}
.lrn-nb.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- unit banner + winding path ---------- */
.lrn-unit{margin:26px 0 8px}
.lrn-uhead{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.lrn-uhead .ui{font-size:34px}
.lrn-uhead h3{margin:0;font-size:19px;font-weight:900;letter-spacing:.2px}
.lrn-uhead .us{margin:3px 0 0;font-size:13px;opacity:.92;font-weight:600}
.lrn-ujump{margin-left:auto;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);color:#fff;font-weight:900;font-size:12px;padding:9px 13px;border-radius:12px;cursor:pointer;white-space:nowrap}
.lrn-ujump:hover{background:rgba(255,255,255,.34)}
.lrn-nodes{display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 0 8px}
.lrn-row{display:flex;align-items:center;justify-content:center;width:100%;position:relative}
.lrn-row:nth-child(6n+1){transform:translateX(0)}
.lrn-row:nth-child(6n+2){transform:translateX(64px)}
.lrn-row:nth-child(6n+3){transform:translateX(92px)}
.lrn-row:nth-child(6n+4){transform:translateX(0)}
.lrn-row:nth-child(6n+5){transform:translateX(-92px)}
.lrn-row:nth-child(6n+6){transform:translateX(-64px)}
@media(max-width:620px){.lrn-row:nth-child(6n+2){transform:translateX(38px)}.lrn-row:nth-child(6n+3){transform:translateX(54px)}.lrn-row:nth-child(6n+5){transform:translateX(-54px)}.lrn-row:nth-child(6n+6){transform:translateX(-38px)}}
.lrn-node{width:74px;height:66px;border:0;border-radius:50%;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .12s;background:#e5e5e5;color:#afafaf;box-shadow:0 7px 0 #bfbfbf}
.lrn-node:hover{transform:translateY(-2px)}
.lrn-node:active{transform:translateY(4px);box-shadow:0 2px 0 #bfbfbf}
.lrn-node.open{background:var(--brand);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.28)}
.lrn-node.done{background:#ffc800;color:#fff;box-shadow:0 7px 0 #d9a800}
.lrn-node.cur{animation:lrnBob 1.8s ease-in-out infinite}
@keyframes lrnBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.lrn-node.locked{cursor:not-allowed}
.lrn-crowns{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:11px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 6px;white-space:nowrap}
.lrn-start{position:absolute;top:-42px;left:50%;transform:translateX(-50%);background:var(--card);border:2px solid var(--line);color:var(--brand);font-weight:900;font-size:11px;padding:6px 12px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.14);white-space:nowrap}
.lrn-start:after{content:'';position:absolute;bottom:-7px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--card)}
.lrn-lbl{position:absolute;left:calc(50% + 52px);top:50%;transform:translateY(-50%);font-weight:800;font-size:13px;color:var(--muted);max-width:190px}
@media(max-width:620px){.lrn-lbl{display:none}}

/* ---------- lesson player ---------- */
.lq{max-width:720px;margin:0 auto;padding:14px 16px 120px}
.lq-bar-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.lq-quit{background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.lq-bar{flex:1;height:16px;border-radius:999px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.lq-fill{height:100%;background:var(--brand);border-radius:999px;transition:width .3s}
.lq-hearts{font-weight:900;color:#ff4b4b;font-size:16px;white-space:nowrap}
.lq-q{font-size:22px;font-weight:900;margin:0 0 6px}
.lq-prompt{font-size:15px;color:var(--muted);margin:0 0 20px;font-weight:600}
.lq-eq{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center;margin:0 0 20px}
.lq-choices{display:grid;gap:10px}
.lq-choice{text-align:left;padding:16px 18px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--txt);font-weight:800;font-size:16px;cursor:pointer;transition:.12s}
.lq-choice:hover{background:var(--bg2)}
.lq-choice.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
.lq-choice.right{border-color:#58cc02;background:rgba(88,204,2,.14);color:#3c8b00}
.lq-choice.wrong{border-color:#ff4b4b;background:rgba(255,75,75,.13);color:#d33}
.lq-in{width:100%;padding:16px 18px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--txt);font-size:20px;font-weight:800;font-family:ui-monospace,Menlo,Consolas,monospace}
.lq-in:focus{outline:none;border-color:var(--brand)}
.lq-hintbtn{margin-top:14px;background:none;border:0;color:var(--brand);font-weight:800;font-size:13px;cursor:pointer;text-decoration:underline}
.lq-hint{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(28,176,246,.1);border:1px solid rgba(28,176,246,.35);font-size:14px;font-weight:600}
.lq-foot{position:fixed;left:0;right:0;bottom:0;padding:16px;border-top:2px solid var(--line);background:var(--card);z-index:30}
.lq-foot-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.lq-fb{flex:1;font-weight:900;font-size:16px}
.lq-fb.ok{color:#58cc02}.lq-fb.no{color:#ff4b4b}
.lq-fb small{display:block;font-weight:700;font-size:13px;color:var(--muted);margin-top:3px}
.lq-go{padding:14px 34px;border-radius:14px;border:0;border-bottom:4px solid rgba(0,0,0,.25);background:var(--brand);color:#fff;font-weight:900;font-size:15px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
.lq-go[disabled]{opacity:.45;cursor:not-allowed}
.lq-go.ok{background:#58cc02;border-bottom-color:#46a302}
.lq-go.no{background:#ff4b4b;border-bottom-color:#d33}
.lq-combo{position:fixed;top:80px;right:22px;background:#ffc800;color:#7a5c00;font-weight:900;padding:8px 14px;border-radius:999px;z-index:40;animation:lrnPop .4s}
@keyframes lrnPop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- end screen ---------- */
.lrn-end{max-width:560px;margin:0 auto;text-align:center;padding:50px 20px}
.lrn-end .big{font-size:74px;margin-bottom:8px;animation:lrnPop .5s}
.lrn-end h2{font-size:28px;font-weight:900;margin:0 0 8px}
.lrn-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:26px 0}
.lrn-stat{border-radius:16px;padding:14px;border:2px solid var(--line);font-weight:900}
.lrn-stat b{display:block;font-size:24px;margin-top:4px}
.lrn-stat.x{border-color:#ffc800;color:#c79600}
.lrn-stat.a{border-color:#58cc02;color:#4a9c00}
.lrn-stat.g{border-color:#1cb0f6;color:#1481b8}

/* ---------- quests / shop / badges / board ---------- */
.lrn-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.lrn-card{border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.lrn-card h4{margin:0 0 6px;font-size:15px;font-weight:900}
.lrn-card p{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.lrn-q{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:14px;background:var(--card);margin-bottom:12px}
.lrn-q .qi{font-size:32px}
.lrn-q.done{border-color:#58cc02;background:rgba(88,204,2,.08)}
.lrn-qbar{height:14px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.lrn-qfill{height:100%;background:#ffc800;transition:width .4s}
.lrn-shop{display:flex;gap:14px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--card);margin-bottom:12px}
.lrn-shop .si{font-size:36px}
.lrn-buy{margin-left:auto;padding:11px 18px;border-radius:12px;border:0;border-bottom:4px solid rgba(0,0,0,.25);background:#1cb0f6;color:#fff;font-weight:900;cursor:pointer;white-space:nowrap}
.lrn-buy[disabled]{opacity:.45;cursor:not-allowed}
.lrn-badge{text-align:center;border:2px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.lrn-badge .bi{font-size:44px;filter:grayscale(1);opacity:.32}
.lrn-badge.got .bi{filter:none;opacity:1}
.lrn-badge.got{border-color:#ffc800;box-shadow:0 0 0 3px rgba(255,200,0,.16)}
.lrn-badge b{display:block;margin-top:8px;font-size:13px;font-weight:900}
.lrn-badge span{font-size:11px;color:var(--muted);font-weight:600}
.lrn-lb{border:2px solid var(--line);border-radius:16px;overflow:hidden}
.lrn-lbr{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:800}
.lrn-lbr:last-child{border-bottom:0}
.lrn-lbr.me{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.lrn-lbr .rk{width:28px;font-weight:900;color:var(--muted)}
.lrn-lbr .xp{margin-left:auto;color:#ffc800;font-weight:900}
.lrn-lbr.top1 .rk{color:#ffc800}.lrn-lbr.top2 .rk{color:#b9b9b9}.lrn-lbr.top3 .rk{color:#cd7f32}

/* ---------- owner editor ---------- */
.lrn-ed{border:2px dashed var(--brand);border-radius:16px;padding:16px;margin-bottom:16px;background:color-mix(in srgb,var(--brand) 5%,transparent)}
.lrn-ed h4{margin:0 0 12px;font-size:15px;font-weight:900}
.lrn-f{display:block;margin-bottom:10px}
.lrn-f span{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px}
.lrn-f input,.lrn-f textarea,.lrn-f select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-size:14px;font-family:inherit}
.lrn-f textarea{min-height:80px;resize:vertical}
.lrn-ex{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card)}
.lrn-ex-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:900;font-size:13px}
.lrn-ex-h .del{margin-left:auto;background:none;border:0;color:#ff4b4b;cursor:pointer;font-weight:900}
.lrn-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.lrn-row2{grid-template-columns:1fr}}
.lrn-mini{font-size:12px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);font-weight:800;cursor:pointer}
.lrn-mini:hover{border-color:var(--brand);color:var(--brand)}
.lrn-empty{text-align:center;padding:60px 20px;color:var(--muted)}
.lrn-empty .big{font-size:60px;margin-bottom:12px}

/* ---------- dark mode ---------- */
body.dark .lrn-node{background:#3a3a3a;color:#6b6b6b;box-shadow:0 7px 0 #262626}
body.dark .lrn-node.done{background:#ffc800;color:#3a2c00;box-shadow:0 7px 0 #a37e00}
body.dark .lq-choice.right{background:rgba(88,204,2,.2);color:#8ee34a}
body.dark .lq-choice.wrong{background:rgba(255,75,75,.2);color:#ff8f8f}
body.dark .lrn-start{box-shadow:0 3px 10px rgba(0,0,0,.5)}
body.dark .lrn-badge.got{box-shadow:0 0 0 3px rgba(255,200,0,.22)}

/* ===== Math Learn v2 ===== */
.lrn-h{font-size:20px;font-weight:900;margin:4px 0 2px}
.lrn-sub{color:var(--muted);font-size:13px;margin:0 0 16px;line-height:1.5}
.lrn-kk{display:block;font-size:10px;font-weight:900;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}

/* ---- unit picker ---- */
.lrn-chap{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
.lrn-chap .ch-l{flex:1;min-width:0}
.lrn-chap .ch-k{font-size:11px;font-weight:900;letter-spacing:.10em;text-transform:uppercase;color:var(--muted)}
.lrn-chap .ch-n{font-size:18px;font-weight:900;display:block;margin-top:2px}
.lrn-chap .ch-s{font-size:12px;color:var(--muted)}
.lrn-skip{border:2px solid var(--line);background:var(--card);color:var(--txt);font:inherit;font-weight:800;
  font-size:12px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:.15s}
.lrn-skip:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}
.lrn-skip.done{border-color:#00cd9c;color:#00cd9c;cursor:default}
.lrn-skip.done:hover{transform:none}

.lrn-ugrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.lrn-ucard{--uc:#58cc02;position:relative;background:var(--card);border:2px solid var(--line);
  border-radius:20px;padding:16px;text-align:left;overflow:hidden;transition:.18s}
.lrn-ucard:before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--uc)}
.lrn-ucard:hover{transform:translateY(-3px);border-color:var(--uc);box-shadow:0 12px 26px rgba(0,0,0,.10)}
.lrn-ucard.locked{opacity:.55}
.lrn-ucard.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.lrn-ucard .uc-top{display:flex;align-items:center;gap:11px;margin:4px 0 8px}
.lrn-ucard .uc-ic{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:flex;align-items:center;
  justify-content:center;font-size:24px;background:var(--uc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.lrn-ucard .uc-t{flex:1;min-width:0}
.lrn-ucard .uc-n{font-weight:900;font-size:16px;display:block;line-height:1.25}
.lrn-ucard .uc-tick{font-size:12px;color:#00cd9c;font-weight:800}
.lrn-ucard .uc-d{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.45;min-height:18px}
.lrn-ucard .uc-bar{height:9px;border-radius:999px;background:var(--bg2);overflow:hidden}
.lrn-ucard .uc-fill{height:100%;background:var(--uc);border-radius:999px;transition:width .5s}
.lrn-ucard .uc-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);
  font-weight:700;margin-top:7px}
.lrn-ucard .uc-btns{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.lrn-ucard .uc-go{flex:1;min-width:112px;border:0;background:var(--uc);color:#fff;font:inherit;font-weight:900;
  padding:11px 14px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.20);transition:.12s}
.lrn-ucard .uc-go:active{transform:translateY(3px);box-shadow:none}
.lrn-ucard .uc-skip{border:2px solid var(--line);background:transparent;color:var(--muted);font:inherit;
  font-weight:800;font-size:12px;padding:9px 13px;border-radius:14px;cursor:pointer}
.lrn-ucard .uc-skip:hover{border-color:var(--uc);color:var(--uc)}
.lrn-ucard .uc-lk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  font-weight:700;margin-top:13px}

.lrn-place{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--card);
  border:2px dashed var(--line);border-radius:20px;padding:16px;margin:0 0 20px}
.lrn-place .pi{font-size:30px}
.lrn-place p{margin:2px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}

/* ---- the map ---- */
.lrn-back{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;font-size:13px;
  cursor:pointer;padding:8px 0;margin:0 0 6px;display:inline-flex;align-items:center;gap:7px}
.lrn-back:hover{color:var(--brand)}
.lrn-node{--nc:var(--brand)}
.lrn-node.open,.lrn-node.cur,.lrn-node.done{background:var(--nc);border-color:var(--nc)}
.lrn-node.trophy{border-radius:22px;background:linear-gradient(160deg,#ffc800,#ff9600);border-color:#ff9600}
.lrn-node.trophy.locked{background:var(--bg2);border-color:var(--line)}
.lrn-ubanner{display:flex;align-items:center;gap:13px;background:var(--card);border:2px solid var(--line);
  border-left:7px solid var(--uc,var(--brand));border-radius:18px;padding:14px 16px;margin:0 0 22px}
.lrn-ubanner .ub-ic{font-size:27px}
.lrn-ubanner b{display:block;font-size:17px}
.lrn-ubanner span{font-size:12.5px;color:var(--muted)}

/* ---- player extras ---- */
.lq-teach{white-space:pre-wrap;line-height:1.65;font-size:15px;padding:18px}
.lq-tag{font-size:11px;font-weight:900;background:var(--bg2);padding:5px 10px;border-radius:999px;color:var(--muted)}
.lq-slot{min-height:62px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:12px;
  border:2px dashed var(--line);border-radius:16px;margin:0 0 14px;background:var(--bg2)}
.lq-slot.right{border-color:#58cc02;border-style:solid;background:rgba(88,204,2,.10)}
.lq-slot.wrong{border-color:#ff4b4b;border-style:solid;background:rgba(255,75,75,.10)}
.lq-slot .ph{color:var(--muted);font-size:13px}
.lq-bank{display:flex;flex-wrap:wrap;gap:9px}
.lq-tile{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--txt);
  font:inherit;font-weight:800;font-size:14px;padding:11px 15px;border-radius:14px;cursor:pointer;transition:.12s}
.lq-tile:hover{border-color:var(--brand);color:var(--brand)}
.lq-tile.in{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,transparent)}
.lq-in.right{border-color:#58cc02}
.lq-in.wrong{border-color:#ff4b4b}
.lrn-end .sub{max-width:430px;margin:0 auto 20px;color:var(--muted);font-size:14px;line-height:1.55}
.lrn-endb{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.lrn-x2{color:#ff9600;font-weight:800;font-size:13px;margin:14px 0 0}

/* ---- quests / shop / board extras ---- */
.lrn-qn{font-size:11.5px;color:var(--muted);font-weight:700}
.lrn-gemn{white-space:nowrap}
.lrn-fqnew{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.lrn-you{font-size:11px;color:var(--brand);font-weight:800}
.lrn-lbs{font-size:11.5px;color:var(--muted)}

/* ---- editor ---- */
.lrn-edbtns,.lrn-exbtns,.lrn-edact{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 18px}
.lrn-exbtns,.lrn-edact{margin:12px 0 0}
.lrn-mini.danger{border-color:rgba(255,75,75,.45);color:#ff4b4b}
.lrn-mini.danger:hover{background:rgba(255,75,75,.10)}
.lrn-ai{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);
  color:var(--brand);font:inherit;font-weight:800;font-size:13px;padding:9px 15px;border-radius:12px;cursor:pointer}
.lrn-ai:hover{background:var(--brand);color:#fff}
.lrn-ai[disabled]{opacity:.6;cursor:default}
.lrn-edchap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg2);
  border-radius:14px;padding:12px 14px;margin:22px 0 10px}
.lrn-edchap.plain{background:transparent;padding:12px 0 0}
.lrn-edchap b{font-size:16px}
.lrn-edn{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.lrn-edunit{--uc:#58cc02;border:2px solid var(--line);border-left:6px solid var(--uc);
  border-radius:16px;padding:13px 15px;margin:0 0 11px;background:var(--card)}
.eu-top{display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.eu-top b{font-size:15.5px}
.eu-ic{font-size:22px}
.eu-btns{display:flex;gap:7px;margin-left:auto}
.eu-les{margin:11px 0 0;border-top:1px solid var(--line);padding-top:9px;display:flex;
  flex-direction:column;gap:7px}
.eu-l{--lc:#58cc02;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 10px;
  border-radius:11px;background:var(--bg2);border-left:4px solid var(--lc)}
.eu-lic{font-size:16px}
.eu-lt{font-weight:800;font-size:13.5px}
.eu-l .lrn-edn{margin:0}

.lrn-picks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.lrn-ico{width:44px;height:44px;border:2px solid var(--line);background:var(--card);border-radius:13px;
  font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.13s;padding:0}
.lrn-ico:hover{border-color:var(--brand);transform:translateY(-2px)}
.lrn-ico.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 16%,transparent);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.lrn-sw{width:38px;height:38px;border:3px solid transparent;border-radius:12px;cursor:pointer;padding:0;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);transition:.13s}
.lrn-sw:hover{transform:translateY(-2px)}
.lrn-sw.on{border-color:var(--txt);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px var(--bg2)}
.lrn-swx{width:44px;height:38px;border:2px solid var(--line);border-radius:12px;background:var(--card);
  cursor:pointer;padding:2px}
.lrn-prev{background:var(--bg2);border-radius:16px;padding:14px 16px;margin:0 0 18px}
.lrn-prev .lrn-row{justify-content:flex-start}
.lrn-testhead{border-top:2px dashed var(--line);margin:22px 0 0;padding-top:16px}
.lrn-testhead h4{margin:0 0 4px;font-size:16px;font-weight:900}
.lrn-exmv{display:flex;gap:6px;align-items:center;margin-left:auto}

body.dark .lrn-ucard:hover{box-shadow:0 12px 26px rgba(0,0,0,.45)}
body.dark .lq-tile.in{background:color-mix(in srgb,var(--brand) 26%,transparent)}
body.dark .lrn-sw.on{border-color:#fff}
@media(max-width:640px){
  .lrn-ugrid{grid-template-columns:1fr}
  .lrn-ico{width:40px;height:40px;font-size:19px}
}
/* ===== MATH LEARN v3 ===== */
.lrn-h{margin:14px 0 4px;font-size:20px;font-weight:800}
.lrn-sub{margin:0 0 14px;opacity:.75;font-size:13px;line-height:1.5;max-width:640px}
.lrn-kk{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;font-weight:700}
.lrn-opt{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.5;font-weight:700;margin-left:6px}

/* ---- unit picker ---- */
.lrn-ugrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));margin-bottom:26px}
.lrn-ucard{background:var(--card,#fff);border:1px solid rgba(0,0,0,.09);border-radius:18px;padding:16px;
  position:relative;overflow:hidden;transition:transform .16s,box-shadow .16s;
  box-shadow:0 2px 0 rgba(0,0,0,.06)}
.lrn-ucard:before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc,#58cc02)}
.lrn-ucard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,0,0,.12)}
.lrn-ucard.locked{opacity:.62}
.lrn-ucard.locked:hover{transform:none;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.lrn-ucard.done:after{content:'\2705';position:absolute;top:12px;right:14px;font-size:16px}
.uc-top{display:flex;gap:11px;align-items:center;margin-bottom:8px;padding-left:6px}
.uc-ic{width:44px;height:44px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:23px;background:var(--uc,#58cc02);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.16)}
.uc-t{min-width:0}
.uc-n{display:block;font-weight:800;font-size:16px;line-height:1.25}
.uc-tick{display:block;font-size:11px;font-weight:700;color:var(--uc,#58cc02);margin-top:2px}
.uc-d{margin:0 0 10px;padding-left:6px;font-size:12.5px;opacity:.72;line-height:1.45;min-height:1px}
.uc-bar{height:9px;border-radius:99px;background:rgba(0,0,0,.09);overflow:hidden;margin-left:6px}
.uc-fill{height:100%;border-radius:99px;background:var(--uc,#58cc02);transition:width .4s}
.uc-meta{display:flex;justify-content:space-between;font-size:11.5px;opacity:.7;margin:6px 0 12px;padding-left:6px;font-weight:600}
.uc-btns{display:flex;gap:8px;flex-wrap:wrap;padding-left:6px}
.uc-go{flex:1;min-width:110px;border:0;cursor:pointer;border-radius:13px;padding:11px 14px;font-weight:800;
  font-size:13.5px;color:#fff;background:var(--uc,#58cc02);box-shadow:0 4px 0 rgba(0,0,0,.2);
  text-transform:uppercase;letter-spacing:.03em}
.uc-go:active{transform:translateY(3px);box-shadow:none}
.uc-skip{border:2px solid var(--uc,#58cc02);background:transparent;color:var(--uc,#58cc02);cursor:pointer;
  border-radius:13px;padding:9px 13px;font-weight:800;font-size:12.5px}
.uc-skip:hover{background:var(--uc,#58cc02);color:#fff}
.uc-lk{font-size:11.5px;opacity:.7;padding:8px 6px 10px;font-weight:600}

/* ---- placement banner ---- */
.lrn-place{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:14px 16px;border-radius:16px;
  margin-bottom:18px;background:linear-gradient(135deg,rgba(28,176,246,.14),rgba(206,130,255,.14));
  border:1px solid rgba(28,176,246,.3)}
.lrn-place .pi{font-size:28px}
.lrn-place p{margin:2px 0 0;font-size:12.5px;opacity:.78}

/* ---- the map ---- */
.lrn-back{border:0;background:rgba(0,0,0,.06);cursor:pointer;border-radius:11px;padding:8px 13px;
  font-weight:800;font-size:12.5px;margin:12px 0 12px;color:inherit}
.lrn-back:hover{background:rgba(0,0,0,.11)}
.lrn-ubanner{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:15px 17px;border-radius:18px;
  color:#fff;background:var(--uc,#58cc02);margin-bottom:10px;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.lrn-ubanner b{display:block;font-size:17px;font-weight:800}
.lrn-ubanner span{display:block;font-size:12px;opacity:.9}
.lrn-ubanner .ub-ic{font-size:30px;flex:none}

.lrn-chap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0 6px;padding:12px 15px;
  border-radius:15px;background:rgba(0,0,0,.045);border-left:5px solid var(--cc,#58cc02)}
.ch-l{flex:1;min-width:180px}
.ch-k{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;
  color:var(--cc,#58cc02)}
.ch-n{display:block;font-weight:800;font-size:15.5px;margin:1px 0 3px}
.ch-s{display:block;font-size:11.5px;opacity:.7;font-weight:600}
.ch-bar{height:7px;border-radius:99px;background:rgba(0,0,0,.1);overflow:hidden;margin-top:7px;max-width:320px}
.ch-fill{height:100%;border-radius:99px;background:var(--cc,#58cc02);transition:width .4s}
.lrn-skip{border:2px solid var(--cc,#58cc02);background:var(--card,#fff);color:var(--cc,#58cc02);cursor:pointer;
  border-radius:12px;padding:9px 14px;font-weight:800;font-size:12.5px;white-space:nowrap}
.lrn-skip:hover{background:var(--cc,#58cc02);color:#fff}
.lrn-skip.done{border-style:dashed;cursor:default;background:transparent}
.lrn-skip.done:hover{background:transparent;color:var(--cc,#58cc02)}

.lrn-node{--nc:#58cc02}
.lrn-node.trophy{background:linear-gradient(160deg,#ffd93d,#ff9600);border-color:#e8890b}
.lrn-node.trophy.locked{background:rgba(0,0,0,.12);border-color:transparent}

/* ---- teaching screen ---- */
.lq-teach{max-width:640px;margin:16px auto;padding:20px 22px;border-radius:20px;background:var(--card,#fff);
  border:1px solid rgba(0,0,0,.09);border-top:6px solid var(--nc,#58cc02)}
.lq-teach .lq-tag{color:var(--nc,#58cc02);font-weight:800;font-size:15px;margin-bottom:10px}
.lq-how{font-size:14.5px;line-height:1.65}
.lq-teach ul{margin:8px 0 0;padding-left:20px}
.lq-teach li{font-size:13px;opacity:.8;margin:4px 0;line-height:1.5}

/* ---- order-the-steps ---- */
.lq-slotwrap{margin:14px 0}
.lq-slot{min-height:56px;border:2px dashed rgba(0,0,0,.2);border-radius:14px;padding:9px;display:flex;
  flex-direction:column;gap:7px}
.lq-slot.ph{align-items:center;justify-content:center;font-size:12.5px;opacity:.55}
.lq-slot.right{border-color:#58cc02;background:rgba(88,204,2,.09);border-style:solid}
.lq-slot.wrong{border-color:#ff4b4b;background:rgba(255,75,75,.09);border-style:solid}
.lq-bank{display:flex;flex-direction:column;gap:7px;margin-top:11px}
.lq-tile{border:2px solid rgba(0,0,0,.14);background:var(--card,#fff);cursor:pointer;border-radius:12px;
  padding:12px 14px;font-weight:700;font-size:14px;text-align:left;color:inherit;
  box-shadow:0 2px 0 rgba(0,0,0,.1)}
.lq-tile:hover{border-color:#1cb0f6}
.lq-tile:active{transform:translateY(2px);box-shadow:none}
.lq-tile.in{border-color:#1cb0f6;background:rgba(28,176,246,.1)}
.lq-in.right{border-color:#58cc02;background:rgba(88,204,2,.1)}
.lq-in.wrong{border-color:#ff4b4b;background:rgba(255,75,75,.1)}

/* ---- end screen ---- */
.lrn-end{max-width:520px;margin:26px auto;text-align:center;padding:26px 22px;border-radius:22px;
  background:var(--card,#fff);border:1px solid rgba(0,0,0,.09)}
.lrn-end .big{font-size:56px;line-height:1;margin-bottom:8px}
.lrn-end h3{margin:0 0 6px;font-size:22px;font-weight:800}
.lrn-end .sub{margin:0 auto 16px;font-size:13.5px;opacity:.75;line-height:1.55;max-width:400px}
.lrn-endb{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.lq-combo{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:9999;background:#ff9600;
  color:#fff;font-weight:800;padding:11px 19px;border-radius:99px;box-shadow:0 8px 22px rgba(0,0,0,.25);
  animation:lrnPop .3s ease-out}

/* ---- quests / board bits ---- */
.lrn-qn{display:block;font-size:11.5px;opacity:.72;margin-top:4px;font-weight:700}
.lrn-gemn{font-weight:800;font-size:12.5px;white-space:nowrap;color:#1cb0f6}
.lrn-fqnew{padding:15px 17px;border-radius:16px;background:rgba(0,0,0,.045);border:1px solid rgba(0,0,0,.07)}
.lrn-you{font-size:10px;text-transform:uppercase;letter-spacing:.06em;background:#58cc02;color:#fff;
  padding:2px 6px;border-radius:6px;vertical-align:middle}
.lrn-lbs{width:30px;height:30px;border-radius:50%;flex:none;object-fit:cover}

/* ---- owner editor ---- */
.lrn-edbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.lrn-exbtns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 4px}
.lrn-edact{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid rgba(0,0,0,.09)}
.lrn-mini.danger{border-color:#ff4b4b;color:#ff4b4b}
.lrn-mini.danger:hover{background:#ff4b4b;color:#fff}
.lrn-ai{border:0;cursor:pointer;border-radius:12px;padding:9px 14px;font-weight:800;font-size:12.5px;color:#fff;
  background:linear-gradient(135deg,#a560e8,#ec4899);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.lrn-ai:active{transform:translateY(2px);box-shadow:none}
.lrn-ai:disabled{opacity:.6;cursor:default}
.lrn-edunit{border:1px solid rgba(0,0,0,.1);border-left:5px solid var(--uc,#58cc02);border-radius:16px;
  padding:13px 15px;margin-bottom:13px;background:var(--card,#fff)}
.eu-top{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.eu-ic{font-size:24px;flex:none}
.eu-btns{display:flex;gap:6px;flex-wrap:wrap}
.lrn-edn{display:block;font-size:11.5px;opacity:.68;margin-top:2px;font-weight:600}
.lrn-edchap2{margin:11px 0 0 12px;padding:10px 13px;border-radius:13px;background:rgba(0,0,0,.04);
  border-left:4px solid var(--cc,#1cb0f6)}
.lrn-edchap2.plain{border-left-color:rgba(0,0,0,.16)}
.ec-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ec-ic{font-size:19px;flex:none}
.eu-les{margin-top:9px;display:flex;flex-direction:column;gap:6px}
.eu-l{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 11px;border-radius:11px;
  background:var(--card,#fff);border:1px solid rgba(0,0,0,.08);border-left:4px solid var(--lc,#58cc02)}
.eu-lic{font-size:16px;flex:none}
.eu-lt{flex:1;min-width:110px;font-weight:700;font-size:13.5px}
.lrn-testhead{margin-top:18px;padding-top:14px;border-top:1px solid rgba(0,0,0,.09)}
.lrn-testhead h4{margin:0 0 4px;font-size:15px;font-weight:800}
.lrn-testhead .lrn-sub{margin-bottom:8px}
.lrn-exmv{display:flex;gap:5px;align-items:center}

/* ---- pickers ---- */
.lrn-picks{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 12px}
.lrn-ico{width:40px;height:40px;border:2px solid rgba(0,0,0,.12);background:var(--card,#fff);cursor:pointer;
  border-radius:11px;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center}
.lrn-ico:hover{border-color:#1cb0f6}
.lrn-ico.on{border-color:#58cc02;background:rgba(88,204,2,.14);transform:scale(1.06)}
.lrn-sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  box-shadow:0 0 0 1px rgba(0,0,0,.12) inset}
.lrn-sw.on{border-color:#111;transform:scale(1.12)}
.lrn-swx{width:40px;height:34px;border:2px solid rgba(0,0,0,.14);border-radius:9px;background:none;cursor:pointer;padding:2px}
.lrn-prev{padding:13px 15px;border-radius:14px;background:rgba(0,0,0,.04);
  border:1px dashed rgba(0,0,0,.16);margin-bottom:6px}

/* ---- dark mode ---- */
body.dark .lrn-ucard,body.dark .lq-teach,body.dark .lrn-end,body.dark .lq-tile,
body.dark .eu-l,body.dark .lrn-edunit,body.dark .lrn-skip{background:#1f2430;border-color:rgba(255,255,255,.12)}
body.dark .lrn-chap,body.dark .lrn-edchap2,body.dark .lrn-fqnew,body.dark .lrn-prev,
body.dark .lrn-back{background:rgba(255,255,255,.06)}
body.dark .lrn-back:hover{background:rgba(255,255,255,.12)}
body.dark .uc-bar,body.dark .ch-bar{background:rgba(255,255,255,.14)}
body.dark .lrn-ico{background:#1f2430;border-color:rgba(255,255,255,.14)}
body.dark .lq-slot{border-color:rgba(255,255,255,.22)}
body.dark .lq-tile{border-color:rgba(255,255,255,.16)}
body.dark .lrn-edact,body.dark .lrn-testhead{border-top-color:rgba(255,255,255,.12)}
body.dark .lrn-sw.on{border-color:#fff}

@media(max-width:640px){
  .lrn-ugrid{grid-template-columns:1fr}
  .lrn-chap{margin-top:16px}
  .ch-bar{max-width:none}
  .lrn-end{padding:20px 15px}
  .lrn-node{transform:none!important}
  .lrn-row{transform:none!important}
}
/* ===== MATH LEARN v4 - inline SVG icons, Duolingo polish ===== */
.lrn-svg{width:22px;height:22px;flex:0 0 auto;display:inline-block;vertical-align:-4px}
.lrn-fallback{display:inline-block;font-size:18px;line-height:1}
.lrn-big{width:52px;height:52px}
.lrn-nb .lrn-svg{width:18px;height:18px}
.lrn-hud .lrn-svg{width:19px;height:19px}
.lrn-hud.fire .lrn-svg{color:#ff9600}
.lrn-hud.gem .lrn-svg{color:#1cb0f6}
.lrn-hud.xp .lrn-svg{color:#ffc800}
.lrn-hud .h{color:#ff4b4b}
.lrn-hud .h:not(.on){color:#c8ced6;opacity:.75}
body.dark .lrn-hud .h:not(.on){color:#3a4450}
.lrn-hud.tap{cursor:pointer;border:0;font:inherit;transition:.15s}
.lrn-hud.tap:hover{transform:translateY(-1px);filter:brightness(1.05)}
.lrn-hud.tap:active{transform:scale(.96)}
.lrn-nb{display:inline-flex;align-items:center;gap:7px}
.uc-ic .lrn-svg,.ub-ic .lrn-svg{width:26px;height:26px}
.lrn-node .lrn-svg{width:30px;height:30px}
.lrn-node.chest .lrn-svg,.lrn-node.trophy .lrn-svg{width:32px;height:32px}
.ch-n .lrn-svg{width:19px;height:19px}
.qi .lrn-svg,.si .lrn-svg,.bi .lrn-svg{width:26px;height:26px}
.lrn-skip .lrn-svg{width:16px;height:16px}
.lrn-ico .lrn-svg{width:24px;height:24px}
.lrn-prev .lrn-svg{width:34px;height:34px}
.eu-ic .lrn-svg,.ec-ic .lrn-svg,.eu-lic .lrn-svg{width:20px;height:20px}
.lq-tag .lrn-svg{width:18px;height:18px}
.lrn-end .big .lrn-svg{width:60px;height:60px}

/* chapter you are on */
.lrn-chap.here{border-color:var(--cc);box-shadow:0 0 0 3px rgba(88,204,2,.12)}
.lrn-chap.done .ch-k{color:#00cd9c}
.lrn-skip.dim{opacity:.55}
.lrn-skip.light{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.5)}
.lrn-skip.light:hover{background:rgba(255,255,255,.3);color:#fff}
.lrn-node.chest{background:#fff;border:3px solid var(--nc);color:var(--nc)}
.lrn-node.chest:hover{transform:translateY(-3px)}
body.dark .lrn-node.chest{background:#1b2430}

/* streak popup */
.lrn-streakpop{text-align:center}
.lrn-streakpop .sp-n{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
.lrn-streakpop .sp-n .lrn-svg{width:34px;height:34px;color:#ff9600}
.lrn-streakpop .sp-n b{font-size:34px;line-height:1;color:#ff9600}
.lrn-streakpop .sp-days{display:flex;gap:6px;justify-content:center;margin:14px 0 10px;flex-wrap:wrap}
.lrn-streakpop .sd{width:44px;padding:7px 0;border-radius:12px;background:var(--panel2,#f2f5f8);
  border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.lrn-streakpop .sd .lrn-svg{width:18px;height:18px;color:#c8ced6}
.lrn-streakpop .sd.on .lrn-svg{color:#ff9600}
.lrn-streakpop .sd.now{border-color:#ff9600}
.lrn-streakpop .sd span{font-size:11px;font-weight:800;opacity:.7}
.lrn-streakpop .sd i{font-size:10px;font-style:normal;opacity:.75}
.lrn-streakpop .sp-t{font-size:13px;margin:6px 0 0}
.lrn-streakpop .sp-t.dim{opacity:.6;font-size:12px}
body.dark .lrn-streakpop .sd{background:#1b2430}

/* friends */
.lrn-frtop{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}
.lrn-frlist{display:flex;flex-direction:column;gap:10px}
.fr-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;
  background:var(--panel,#fff);border:2px solid var(--line,#e6eaee)}

<script>
/* =====================================================================
   Matix Workspace — single-file Notion-style app
   Firebase Realtime DB via REST (compatible with existing Matix data)
   ===================================================================== */
var FB='https://matix-1d538-default-rtdb.firebaseio.com';
var IDEAS_FB='https://matix-the-math-club-views-default-rtdb.firebaseio.com';
var VALID_MEMBERS={ghadi:'iamtheownerofmatix',dahlia:'cheeseflower',yara:'yara10yoyo20',jad:'ilikebatatameshwiyye',marwan:'ilikebeingnumberonebutiamnumbertwo',mak:'mak2130',hicham:'pwrbulleye'};
var OWNERS=['ghadi'];

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
/* ---------- Custom alert / confirm / toast (replaces native browser dialogs) ---------- */
function customConfirm(msg,onYes,opts){
  opts=opts||{};
  var m=$('ccModal');var msgBox=$('ccMsg');
  /* opts.html:true renders rich markup; plain text stays escaped by default */
  if(opts.html)msgBox.innerHTML=msg;else msgBox.textContent=msg;
  $('ccIcon').textContent=opts.icon||(opts.alertOnly?'ℹ️':'❓');
  var cancelBtn=$('ccCancel'),okBtn=$('ccOk');
  cancelBtn.style.display=opts.alertOnly?'none':'';
  okBtn.textContent=opts.okText||(opts.alertOnly?'OK':'Confirm');
  okBtn.className='btn '+(opts.danger===false?'':'danger');
  m.classList.add('open');
  function close(){m.classList.remove('open');okBtn.onclick=null;cancelBtn.onclick=null;m.onclick=null;document.removeEventListener('keydown',onKey);}
  var settled=false;
  function no(){if(settled)return;settled=true;close();if(opts.onCancel)opts.onCancel();}
  function yes(){if(settled)return;settled=true;close();if(onYes)onYes();}
  function onKey(e){if(e.key==='Escape'){no();}else if(e.key==='Enter'){yes();}}
  okBtn.onclick=yes;
  cancelBtn.onclick=no;
  m.onclick=function(e){if(e.target===m)no();};
  document.addEventListener('keydown',onKey);
}
function customAlert(msg,onOk,opts){
  opts=opts||{};opts.alertOnly=true;opts.danger=opts.danger===undefined?false:opts.danger;
  if(!opts.onCancel&&onOk)opts.onCancel=onOk;
  customConfirm(msg,onOk,opts);
}
function toast(msg,kind){
  var w=$('toastWrap');
  if(!w){w=el('div','toast-wrap');w.id='toastWrap';document.body.appendChild(w);}
  var t=el('div','toast'+(kind?' '+kind:''),esc(msg));
  w.appendChild(t);
  requestAnimationFrame(function(){t.classList.add('show');});
  setTimeout(function(){t.classList.remove('show');setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},250);},2800);
}
function initials(u){return (u||'?').slice(0,2).toUpperCase();}
function normUser(u){var c=String(u||'').toLowerCase().replace(/[^a-z0-9_]/g,'');if(c==='matix'||c==='ghadimatix')return 'ghadi';return c;}
function timeAgo(ms){if(!ms)return '';var s=Math.floor((Date.now()-ms)/1000);if(s<60)return 'just now';var m=Math.floor(s/60);if(m<60)return m+'m ago';var h=Math.floor(m/60);if(h<24)return h+'h ago';var d=Math.floor(h/24);if(d<30)return d+'d ago';return new Date(ms).toLocaleDateString();}
function fileToText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsText(f);});}
function fileToDataURL(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(f);});}

/* ---------- Firebase REST ---------- */
function fbGet(path,base){return fetch((base||FB)+path+'.json').then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPut(path,data,base){return fetch((base||FB)+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPost(path,data,base){return fetch((base||FB)+path+'.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbPatch(path,data,base){return fetch((base||FB)+path+'.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(function(r){return r.json();})['catch'](function(){return null;});}
function fbDel(path,base){return fetch((base||FB)+path+'.json',{method:'DELETE'})['catch'](function(){});}

/* ---------- auth ---------- */
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){}}
var KEEP_KEY='mx_keep_user';
function wantsKeep(){var b=$('gKeep');return b?!!b.checked:true;}
function getUser(){return sessionStorage.getItem('mx_user')||sessionStorage.getItem('matix_auth_user')||lsGet(KEEP_KEY)||null;}
function setUser(u){sessionStorage.setItem('mx_user',u);sessionStorage.setItem('matix_auth_user',u);if(wantsKeep()){lsSet(KEEP_KEY,u);}else{lsDel(KEEP_KEY);}}
function clearUser(){sessionStorage.removeItem('mx_user');sessionStorage.removeItem('matix_auth_user');}
var ROLE_OWNER=false;
var OWNER_SECTIONS=[{kind:'changelog',icon:'📝',name:'Changelog'}];
function findSection(k){var a=STATIC.concat(OWNER_SECTIONS);for(var i=0;i<a.length;i++)if(a[i].kind===k)return a[i];return null;}
function isOwner(u){return ROLE_OWNER||OWNERS.indexOf(normUser(u||ME))>=0;}
var ME=null;

function doSignIn(rawU,pass){
  var u=(rawU||'').toLowerCase().replace(/\s+/g,'').trim();
  if(!u||!pass)return Promise.resolve(false);
  return fbGet('/members/'+encodeURIComponent(u)).then(function(data){
    if(data&&data.password){return data.password===pass;}
    return (VALID_MEMBERS[u]&&VALID_MEMBERS[u]===pass);
  }).then(function(ok){
    if(!ok)return false;
    return fbGet('/bans/'+encodeURIComponent(u)).then(function(b){
      if(b){toast('This account has been suspended by the owner.','err');return false;}
      setUser(u);return true;
    });
  });
}
function doJoin(rawU,pass){
  var u=(rawU||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!u||u.length<2)return Promise.resolve('short');
  if(!pass||pass.length<4)return Promise.resolve('shortpass');
  if(VALID_MEMBERS[u])return Promise.resolve('reserved');
  return fbGet('/members/'+encodeURIComponent(u)).then(function(ex){
    if(ex)return 'taken';
    return fbPut('/members/'+encodeURIComponent(u),{password:pass,joinedAt:Date.now(),testUser:true}).then(function(){
      fbPut('/profiles/'+encodeURIComponent(u),{displayName:u,bio:'',updatedAt:Date.now()});
      setUser(u);return 'ok';
    });
  });
}
function verifyPassword(u,pass){
  if(!pass)return Promise.resolve(false);
  return fbGet('/members/'+encodeURIComponent(u)).then(function(m){
    if(m&&m.password)return m.password===pass;
    return VALID_MEMBERS[u]===pass;
  });
}

var TABS=[];var ACTIVE=null;var tabSeq=1;
function activeTab(){for(var i=0;i<TABS.length;i++)if(TABS[i].id===ACTIVE)return TABS[i];return null;}
function tabMeta(spec){
  if(spec.kind==='page'){var p=CUSTOM_PAGES[spec.refId]||{};return {icon:p.icon||'📄',title:p.name||'Page'};}
  if(spec.kind==='game'){return {icon:'🎮',title:spec.title||'Game'};}
  if(spec.kind==='ai'&&spec.refId){var ac=AI_CHATS_CACHE[spec.refId]||{};return {icon:'✨',title:ac.title||'Matix AI'};}
  if(spec.kind==='private'){return {icon:'🔒',title:'Private'};}
  var s=findSection(spec.kind)||{icon:'📄',name:'Page'};
  return {icon:s.icon,title:s.name};
}
function sameRef(a,b){return a.kind===b.kind && (a.refId||'')===(b.refId||'');}
function openTab(spec){
  if(spec.kind==='ai'&&!spec.refId){
    aiChatOpenOrNew(function(id){if(id)openTab({kind:'ai',refId:id});});
    return;
  }
  for(var i=0;i<TABS.length;i++){if(sameRef(TABS[i],spec)){ACTIVE=TABS[i].id;drawTabs();renderContent();return;}}
  var m=tabMeta(spec);
  var t={id:tabSeq++,kind:spec.kind,refId:spec.refId||null,title:m.title,icon:m.icon};
  TABS.push(t);ACTIVE=t.id;drawTabs();renderContent();
  if(window.innerWidth<=820)$('sidebar').classList.remove('open');
}
function closeTab(id){
  var idx=-1;for(var i=0;i<TABS.length;i++)if(TABS[i].id===id)idx=i;
  if(idx<0)return;
  TABS.splice(idx,1);
  if(ACTIVE===id){if(TABS.length){ACTIVE=TABS[Math.max(0,idx-1)].id;}else{ACTIVE=null;}}
  drawTabs();renderContent();
}
function closeTabsFor(kind,refId){TABS=TABS.filter(function(t){return !(t.kind===kind&&t.refId===refId);});if(!activeTab()&&TABS.length)ACTIVE=TABS[TABS.length-1].id;drawTabs();renderContent();}
/* ---------- owner: delete an item (app page or game) from anywhere ---------- */
function canDeleteItem(kind){return isOwner()&&(kind==='page'||kind==='game');}
function deleteItem(kind,refId,name,done){
  if(!canDeleteItem(kind))return;
  var label=kind==='game'?'game':'page';
  customConfirm('Delete the '+label+' “'+(name||'Untitled')+'”?\nThis cannot be undone.',function(){
    var path=kind==='game'?('/hubprojects/'+refId):('/apppages/'+refId);
    fbDel(path).then(function(){
      closeTabsFor(kind,refId);
      if(kind==='page'){loadCustomPages();}
      toast((kind==='game'?'Game':'Page')+' deleted','ok');
      if(done)done();
    })['catch'](function(){toast('Could not delete — check your connection.','err');});
  },{icon:'🗑️',okText:'Delete'});
}
function tabHost(){
  var tb=$('tbTabs');
  if(tb)return tb;
  return $('tabstrip');
}
function drawTabs(){
  var strip=tabHost();
  [$('tabstrip'),$('tbTabs')].forEach(function(h){if(h)h.querySelectorAll('.tab,.tab-add').forEach(function(n){n.remove();});});
  TABS.forEach(function(t){
    var tab=el('div','tab'+(t.id===ACTIVE?' active':''));
    tab.innerHTML='<span class="ic">'+t.icon+'</span><span class="lb">'+esc(t.title)+'</span>';
    if(canDeleteItem(t.kind)&&t.refId){
      var dl=el('button','tdel','🗑');dl.title='Delete this '+(t.kind==='game'?'game':'page')+' (owner)';
      dl.onclick=function(e){e.stopPropagation();deleteItem(t.kind,t.refId,t.title);};
      tab.appendChild(dl);
    }
    var x=el('button','x','×');x.title='Close tab';x.onclick=function(e){e.stopPropagation();closeTab(t.id);};
    tab.appendChild(x);
    tab.onclick=function(){ACTIVE=t.id;drawTabs();renderContent();};
    strip.appendChild(tab);
  });
  var add=el('button','tab-add','+');add.title='Open new tab (search)';add.onclick=openPalette;strip.appendChild(add);
  highlightNav();
}
function renderContent(){
  var c=$('content');var t=activeTab();
  if(!t){c.innerHTML='<div class="empty" style="padding-top:120px"><div class="big">📄</div>No tab open.<br><br><button class="btn" onclick="openPalette()">+ Open a page</button></div>';return;}
  if(t.kind==='home')return renderHome(c);
  if(t.kind==='games')return renderGames(c);
  if(t.kind==='ideas')return renderIdeas(c);
  if(t.kind==='messages')return renderMessages(c);
  if(t.kind==='learn')return renderLearn(c);
  if(t.kind==='points')return renderPoints(c);
  if(t.kind==='ai')return renderAI(c,t.refId);
  if(t.kind==='theme')return renderTheme(c);
  if(t.kind==='chat')return renderChat(c);
  if(t.kind==='changelog')return renderChangelog(c);
  if(t.kind==='users')return renderUsers(c);
  if(t.kind==='bugs')return renderBugs(c);
  if(t.kind==='page')return renderCustomPage(c,t.refId);
  if(t.kind==='game')return renderGamePlay(c,t.refId);
  if(t.kind==='private')return renderPrivate(c);
}

    Object.keys(follows).forEach(function(k){var f=follows[k],u=normUser(k);if(!u||u===ME)return;msgEvents.push({type:'follower',user:u,at:(f&&f.at)||0});});
    Object.keys(members).forEach(function(k){var u=normUser(k);if(!u||u===ME)return;var jt=members[k]&&members[k].joinedAt;if(!jt)return;msgEvents.push({type:'joined',user:u,at:jt});});
    Object.keys(comments).forEach(function(k){var cm=comments[k];if(!cm)return;var u=normUser(cm.by);if(u===ME)return;msgEvents.push({type:'comment',user:u,at:cm.at||0,text:cm.text||''});});
    Object.keys(stored).forEach(function(k){var s=stored[k];if(!s)return;var ev={type:s.type||'role',at:s.at||0,title:s.title||'Notification',body:s.body||'',notifKey:k};['user','targetUser','requestId','requestedBy','amount','rewardId','rewardName','prevValue','prevRole'].forEach(function(f){if(s[f]!==undefined)ev[f]=s[f];});msgEvents.push(ev);});
    Object.keys(changelog).forEach(function(k){var cl=changelog[k];if(!cl)return;msgEvents.push({type:'changelog',at:cl.at||0,title:'📜 '+(cl.title||'Changelog update'),body:cl.description||''});});
    Object.keys(memes).forEach(function(k){var mm=memes[k];if(!mm)return;var by=normUser(mm.postedBy);if(by===ME)return;msgEvents.push({type:'meme',at:mm.createdAt||0,title:'😂 New joke / meme',body:(mm.title?'“'+mm.title+'”':'A new meme was posted')+' — @'+(mm.postedBy||'?')});});
    Object.keys(lessons).forEach(function(k){var ls=lessons[k];if(!ls)return;var by=normUser(ls.createdBy);if(by===ME)return;msgEvents.push({type:'lesson',at:ls.createdAt||0,title:'📚 New lesson',body:(ls.title||'Untitled')+' — by @'+(ls.createdBy||'ghadi')});});
    Object.keys(dels).forEach(function(k){var dd=dels[k];if(!dd)return;var u=normUser(k);if(u===ME)return;msgEvents.push({type:'deleted',user:u,at:dd.at||0,title:'🗑 User removed',body:'@'+u+' was removed'+(dd.by?' by @'+dd.by:'')});});
    msgEvents.sort(function(a,b){return b.at-a.at;});
    buildMsg(c);
    try{localStorage.setItem('mx_messages_seen_'+ME,String(Date.now()));}catch(e){}
  });
}
function msgVisible(){return msgEvents.filter(function(e){return msgPrefs[e.type]!==false;});}
function buildMsg(c){
  var vis=msgVisible();var newCount=vis.filter(function(e){return e.at>msgSeen;}).length;
  var h='<div class="hero"><span class="badge">🔔 MATIX</span><h1>Notifications</h1><p>'+(newCount?('You have <b>'+newCount+'</b> new notification'+(newCount===1?'':'s')+'.'):'All caught up — nothing new.')+'</p></div>';
  h+='<div class="chips" id="msgChips"></div><div id="msgList"></div>';
  h+='<div class="card" style="margin-top:24px"><h3 style="font-weight:800;color:#b8860b;text-transform:uppercase;font-size:.8rem;letter-spacing:.05em;margin-bottom:10px">⚙ Alert settings</h3><div id="msgToggles"></div></div>';
  $('msgBody').innerHTML=h;
  var chips=$('msgChips');
  MSG_CHIPS.forEach(function(cp){var cnt=vis.filter(function(e){return !cp.types||cp.types.indexOf(e.type)>-1;}).length;var b=el('button','chip'+(msgFilter===cp.id?' active':''),esc(cp.label)+(cnt?' <span class="c">'+cnt+'</span>':''));b.onclick=function(){msgFilter=cp.id;buildMsg(c);};chips.appendChild(b);});
  var tg=$('msgToggles');
  NOTIF_ORDER.forEach(function(k){var meta=TYPE_META[k];var row=el('label','toggle');var cb=el('input');cb.type='checkbox';cb.checked=msgPrefs[k]!==false;cb.onchange=function(){msgPrefs[k]=cb.checked;savePrefs();buildMsg(c);};var sp=el('span',null,meta.icon+'  '+meta.label);row.appendChild(cb);row.appendChild(sp);tg.appendChild(row);});
  drawMsgList(c);
}
function drawMsgList(c){
  var chip=MSG_CHIPS.filter(function(x){return x.id===msgFilter;})[0];
  var events=msgVisible().filter(function(e){return !chip||!chip.types||chip.types.indexOf(e.type)>-1;});
  var list=$('msgList');list.innerHTML='';
  if(!events.length){list.innerHTML='<div class="empty"><div class="big">✨</div>Nothing here yet.</div>';return;}
  events.slice(0,150).forEach(function(e){
    var meta=TYPE_META[e.type]||{icon:'🔔',color:'#3b82f6'};
    var item=el('div','nitem');item.style.setProperty('--accent2',meta.color);
    var ic=el('div','nic');ic.style.background=meta.color;
    if(e.user&&msgProfiles[e.user]&&msgProfiles[e.user].avatar){ic.style.backgroundImage='url('+msgProfiles[e.user].avatar+')';ic.style.backgroundSize='cover';ic.textContent='';}
    else if(e.user){ic.textContent=initials(e.user);ic.style.fontSize='.85rem';}
    else ic.textContent=meta.icon;
    item.appendChild(ic);
    var body=el('div','nbody');var line=el('div','nl');
    if(e.type==='follower')line.innerHTML='@'+esc(e.user)+' started following you.';
    else if(e.type==='joined')line.innerHTML='@'+esc(e.user)+' joined Matix.';
    else if(e.type==='comment')line.innerHTML='@'+esc(e.user)+' commented on your profile.';
    else line.textContent=e.title||'Notification';
    if(e.at>msgSeen)line.innerHTML+='<span class="new">NEW</span>';
    body.appendChild(line);
    if(e.type==='comment'&&e.text){var q=el('div','nq');q.textContent=e.text;body.appendChild(q);}
    else if(e.body){var d=el('div','nd');d.textContent=e.body;body.appendChild(d);}
    var t=el('div','nt');t.textContent=timeAgo(e.at);body.appendChild(t);
    /* owner / approver actions */
    if(e.type==='points_request'&&msgApprove&&e.requestId){var a=el('button','btn sm',' ✓ Approve');a.style.marginTop='8px';a.style.marginRight='6px';a.onclick=function(){approvePoints(e,a,c);};var r=el('button','btn sm danger','✕ Deny');r.style.marginTop='8px';r.onclick=function(){fbPut('/point_requests/'+encodeURIComponent(e.requestId)+'/status','rejected');fbDel('/notifications/ghadi/'+encodeURIComponent(e.notifKey)).then(function(){renderMessages(c);});};body.appendChild(a);body.appendChild(r);}
    if(e.type==='deleted'&&msgOwner&&e.user){var rv=el('button','btn sm danger','↩ Revert deletion');rv.style.marginTop='8px';rv.onclick=function(){revertDeletion(e.user,rv,c);};body.appendChild(rv);}
    item.appendChild(body);list.appendChild(item);
  });
}
function approvePoints(e,btn,c){btn.disabled=true;btn.textContent='Approving…';fbGet('/points/'+encodeURIComponent(e.targetUser)).then(function(cur){var prev=cur||0;var nv=(e.amount==='reset')?0:Math.max(0,prev+Number(e.amount));fbPut('/points/'+encodeURIComponent(e.targetUser),nv).then(function(){fbPut('/point_requests/'+encodeURIComponent(e.requestId)+'/status','approved');fbDel('/notifications/ghadi/'+encodeURIComponent(e.notifKey)).then(function(){renderMessages(c);});});});}
function revertDeletion(username,btn,c){username=normUser(username);customConfirm('Restore @'+username+' and their data?',function(){btn.disabled=true;btn.textContent='Restoring…';fbGet('/deletion_backups/'+encodeURIComponent(username)).then(function(b){if(!b){customAlert('No backup found.');btn.disabled=false;btn.textContent='↩ Revert deletion';return;}var tasks=[];if(b.member)tasks.push(fbPut('/members/'+encodeURIComponent(username),b.member));if(b.profile)tasks.push(fbPut('/profiles/'+encodeURIComponent(username),b.profile));if(b.role)tasks.push(fbPut('/roles/'+encodeURIComponent(username),b.role));if(b.comments)tasks.push(fbPut('/profile_comments/'+encodeURIComponent(username),b.comments));if(b.follows)tasks.push(fbPut('/follows/'+encodeURIComponent(username),b.follows));Promise.all(tasks).then(function(){Promise.all([fbDel('/deletions/'+encodeURIComponent(username)),fbDel('/deletion_backups/'+encodeURIComponent(username))]).then(function(){toast('@'+username+' restored.','ok');renderMessages(c);});});});});}
