var paletteGames=[];var paletteSel=0;var paletteResults=[];
function openPalette(){
  $('overlay').classList.add('open');$('paletteInput').value='';$('paletteInput').focus();
  fbGet('/hubprojects').then(function(o){o=o||{};paletteGames=Object.keys(o).map(function(k){var v=o[k]||{};return {id:k,name:v.name||'Untitled',author:v.author,pub:v.published!==false};}).filter(function(g){return g.pub;});paletteFilter($('paletteInput').value);});
  fbGet('/apppages').then(function(o){CUSTOM_PAGES=o||{};paletteFilter($('paletteInput').value);});
  paletteFilter('');
}
function closePalette(){$('overlay').classList.remove('open');}
function paletteFilter(q){
  q=(q||'').toLowerCase();var items=[];
  STATIC.concat(isOwner()?OWNER_SECTIONS:[]).forEach(function(s){items.push({icon:s.icon,title:s.name,sub:'Section',kind:'Page',open:{kind:s.kind}});});
  Object.keys(CUSTOM_PAGES).forEach(function(k){var p=CUSTOM_PAGES[k];items.push({icon:p.icon||'📄',title:p.name||'Untitled',sub:p.searchOnly?'🔎 Search-only page':'App page',kind:'Page',open:{kind:'page',refId:k},del:{kind:'page',refId:k,name:p.name||'Untitled'}});});
  paletteGames.forEach(function(g){items.push({icon:'🎮',title:g.name,sub:'by @'+(g.author||'?'),kind:'Game',open:{kind:'game',refId:g.id,title:g.name},del:{kind:'game',refId:g.id,name:g.name}});});
  paletteResults=items.filter(function(it){return !q||it.title.toLowerCase().indexOf(q)>-1||it.sub.toLowerCase().indexOf(q)>-1;});
  paletteSel=0;drawPalette();
}
function drawPalette(){
  var box=$('presults');box.innerHTML='';
  if(!paletteResults.length){box.innerHTML='<div class="empty" style="padding:30px">No matches.</div>';return;}
  var lastKind='';
  paletteResults.forEach(function(it,i){
    if(it.kind!==lastKind){box.appendChild(el('div','pres-lbl',it.kind==='Game'?'Games':'Pages'));lastKind=it.kind;}
    var r=el('div','pres'+(i===paletteSel?' sel':''),'<span class="ic">'+it.icon+'</span><div style="min-width:0;flex:1"><div>'+esc(it.title)+'</div><div class="sub">'+esc(it.sub)+'</div></div><span class="kind">'+it.kind+'</span>');
    r.onclick=function(){choosePalette(i);};
    if(it.del&&canDeleteItem(it.del.kind)){
      var d=el('button','pres-del','🗑');d.title='Delete this '+(it.del.kind==='game'?'game':'page')+' (owner)';
      d.onclick=function(e){e.stopPropagation();var dd=it.del;deleteItem(dd.kind,dd.refId,dd.name,function(){
        if(dd.kind==='game')paletteGames=paletteGames.filter(function(g){return g.id!==dd.refId;});
        else delete CUSTOM_PAGES[dd.refId];
        paletteFilter($('paletteInput').value);
      });};
      r.appendChild(d);
    }
    box.appendChild(r);
  });
}
function choosePalette(i){var it=paletteResults[i];if(!it)return;closePalette();openTab(it.open);}
$('openSearch').onclick=openPalette;
$('paletteInput').addEventListener('input',function(){paletteFilter(this.value);});
$('paletteInput').addEventListener('keydown',function(e){
  if(e.key==='ArrowDown'){e.preventDefault();paletteSel=Math.min(paletteResults.length-1,paletteSel+1);drawPalette();scrollSel();}
  else if(e.key==='ArrowUp'){e.preventDefault();paletteSel=Math.max(0,paletteSel-1);drawPalette();scrollSel();}
  else if(e.key==='Enter'){e.preventDefault();choosePalette(paletteSel);}
  else if(e.key==='Escape'){closePalette();}
});
function scrollSel(){var s=$('presults').querySelector('.pres.sel');if(s)s.scrollIntoView({block:'nearest'});}
$('overlay').onclick=function(e){if(e.target.id==='overlay')closePalette();};

    LP.hearts=r[9]||{n:LRN_MAXH,at:Date.now()};
    LP.streak=r[10]||{count:0,last:'',freeze:0};
    LP.badges=r[11]||{};
    LP.boost=Number(r[12])||0;
    LP.quests=r[13]||{};
    LP.placed=!!r[14];
    LP.loaded=true;
  })['catch'](function(){LP.loaded=true;});
}

/* ---------- structure:  unit > chapter > lesson ---------- */
function lrnUnit(id){
  for(var i=0;i<LP.units.length;i++)if(LP.units[i].id===id)return LP.units[i];
  return null;
}
function lrnLesson(id){
  for(var i=0;i<LP.lessons.length;i++)if(LP.lessons[i].id===id)return LP.lessons[i];
  return null;
}
function lrnChapter(id){
  for(var i=0;i<LP.chapters.length;i++)if(LP.chapters[i].id===id)return LP.chapters[i];
  return null;
}
function lrnUnitChaps(uid){
  return LP.chapters.filter(function(c){return c.unitId===uid;});
}
function lrnChapLessons(cid){
  return LP.lessons.filter(function(l){return l.chapterId===cid;});
}
function lrnLooseLessons(uid){
  return LP.lessons.filter(function(l){
    return l.unitId===uid&&(!l.chapterId||!lrnChapter(l.chapterId));
  });
}
function lrnUnitLessons(uid){
  var out=[];
  lrnUnitChaps(uid).forEach(function(c){
    lrnChapLessons(c.id).forEach(function(l){out.push(l);});
  });
  lrnLooseLessons(uid).forEach(function(l){out.push(l);});
  return out;
}
function lrnLessonUnit(l){
  if(!l)return null;
  var c=l.chapterId?lrnChapter(l.chapterId):null;
  return c?c.unitId:(l.unitId||null);
}
function lrnExOf(o){return lrnArr(o&&o.ex);}
function lrnTestOf(o){return lrnArr(o&&o.test);}

/* ---------- progress + skipping ---------- */
function lrnCrowns(id){return Number((LP.prog[id]||{}).crowns)||0;}
function lrnDone(id){return lrnCrowns(id)>0;}
function lrnUnitSkipped(uid){return !!LP.tests[uid];}
function lrnChapSkipped(cid){
  if(LP.ctests[cid])return true;
  var c=lrnChapter(cid);
  return !!(c&&c.unitId&&lrnUnitSkipped(c.unitId));
}
function lrnLesCleared(l){
  if(!l)return false;
  if(lrnDone(l.id))return true;
  if(l.chapterId&&lrnChapSkipped(l.chapterId))return true;
  var uid=lrnLessonUnit(l);
  return !!(uid&&lrnUnitSkipped(uid));
}
function lrnChapDone(cid){
  if(lrnChapSkipped(cid))return true;
  var ls=lrnChapLessons(cid);
  if(!ls.length)return false;
  for(var i=0;i<ls.length;i++)if(!lrnLesCleared(ls[i]))return false;
  return true;
}
function lrnChapPct(cid){
  if(lrnChapSkipped(cid))return 100;
  var ls=lrnChapLessons(cid);
  if(!ls.length)return 0;
  var n=0;
  ls.forEach(function(l){if(lrnLesCleared(l))n++;});
  return Math.round(n/ls.length*100);
}
function lrnUnitDone(uid){
  if(lrnUnitSkipped(uid))return true;
  var ls=lrnUnitLessons(uid);
  if(!ls.length)return false;
  for(var i=0;i<ls.length;i++)if(!lrnLesCleared(ls[i]))return false;
  return true;
}
function lrnUnitPct(uid){
  if(lrnUnitSkipped(uid))return 100;
  var ls=lrnUnitLessons(uid);
  if(!ls.length)return 0;
  var n=0;
  ls.forEach(function(l){if(lrnLesCleared(l))n++;});
  return Math.round(n/ls.length*100);
}
function lrnUnitOpen(uid){
  if(isOwner())return true;
  for(var i=0;i<LP.units.length;i++){
    if(LP.units[i].id===uid)return true;
    if(!lrnUnitDone(LP.units[i].id))return false;
  }
  return false;
}
function lrnLessonOpen(l){
  if(isOwner())return true;
  if(!l)return false;
  var uid=lrnLessonUnit(l);
  if(!lrnUnitOpen(uid))return false;
  if(lrnLesCleared(l))return true;
  var seq=lrnUnitLessons(uid);
  for(var i=0;i<seq.length;i++){
    if(seq[i].id===l.id)return (i===0)||lrnLesCleared(seq[i-1]);
  }
  return false;
}
function lrnAnyProgress(){
  for(var k in LP.prog)if((LP.prog[k]||{}).crowns)return true;
  for(var t in LP.tests)if(LP.tests[t])return true;
  for(var c in LP.ctests)if(LP.ctests[c])return true;
  return false;
}

/* ---------- rewards ---------- */
function lrnBumpStreak(){
  var today=lrnDay(0),y=lrnDay(1),s=LP.streak||{count:0,last:'',freeze:0};
  if(s.last===today)return Promise.resolve();
  if(s.last===y)s.count=(Number(s.count)||0)+1;
  else if(s.last&&s.freeze){s.freeze=0;s.count=(Number(s.count)||0)+1;}
  else s.count=1;
  s.last=today;LP.streak=s;
  return fbPut('/learn/streak/'+lrnU(),s);
}
function lrnAddXp(n){
  if(!n)return Promise.resolve();
  LP.xp=(Number(LP.xp)||0)+n;
  var d=lrnDay(0);
  LP.xpday[d]=(Number(LP.xpday[d])||0)+n;
  return Promise.all([fbPut('/learn/xp/'+lrnU(),LP.xp),
                      fbPut('/learn/xpday/'+lrnU()+'/'+d,LP.xpday[d])]);
}
function lrnAddGems(n){
  if(!n)return Promise.resolve();
  LP.gems=Math.max(0,(Number(LP.gems)||0)+n);
  return fbPut('/learn/gems/'+lrnU(),LP.gems);
}

/* ---------- where am I in the unit? ---------- */
function lrnChapIndex(cid){
  var c=lrnChapter(cid);
  if(!c)return -1;
  var cs=lrnUnitChaps(c.unitId),ix=-1;
  cs.forEach(function(x,i){if(x.id===cid)ix=i;});
  return ix;
}
function lrnChapBefore(cid){
  var c=lrnChapter(cid);
  if(!c)return null;
  var cs=lrnUnitChaps(c.unitId),ix=lrnChapIndex(cid);
  return (ix>0)?cs[ix-1]:null;
}
function lrnChapReached(cid){
  var c=lrnChapter(cid);
  if(!c)return false;
  var cs=lrnUnitChaps(c.unitId),ix=lrnChapIndex(cid);
  for(var i=0;i<ix;i++)if(!lrnChapDone(cs[i].id))return false;
  return true;
}
function lrnUnitIndex(uid){
  var ix=-1;
  LP.units.forEach(function(u,i){if(u.id===uid)ix=i;});
  return ix;
}

/* ---------- friends ---------- */
function lrnViewFriends(b){
  b.innerHTML='<div class="lrn-empty">'+lrnIco('people','lrn-big')+'<div>Loading friends...</div></div>';
  Promise.all([fbGet('/learn/xp'),fbGet('/members'),fbGet('/learn/friends/'+lrnU()),
               fbGet('/profiles')]).then(function(r){
    var xp=r[0]||{},mem=r[1]||{},fr=r[2]||{},pro=r[3]||{},me=lrnU(),rows=[],seen={};
    LP.friends=fr;
    function add(u){
      u=normUser(u);
      if(!u||seen[u])return;
      seen[u]=1;
      rows.push({u:u,xp:Number(xp[u])||0,fr:!!fr[u]});
    }
    for(var k in mem)add(k);
    for(var k2 in xp)add(k2);
    add(me);
    rows.sort(function(a,c){
      if(a.u===me)return -1;
      if(c.u===me)return 1;
      if(a.fr!==c.fr)return a.fr?-1:1;
      return c.xp-a.xp;
    });
    var nf=0;
    rows.forEach(function(x){if(x.fr)nf++;});
    var h='<h3 class="lrn-h">'+lrnIco('people')+' Friends</h3>'+
      '<p class="lrn-sub">Add club members as friends to see how much XP they have. '+
      'You have <b>'+nf+' friend'+(nf===1?'':'s')+'</b>.</p>'+
      '<div class="lrn-frtop">'+
      '<button class="lrn-buy" data-fq="1">'+lrnIco('sparkle')+' Friend quest</button>'+
      '<button class="lrn-mini" data-fb="board">'+lrnIco('trophy')+' Leaderboard</button></div>'+
      '<div class="lrn-frlist">';
    rows.forEach(function(x){
      var isMe=(x.u===me);
      h+='<div class="fr-row'+(isMe?' me':'')+'">'+
        '<div class="fr-av">'+avatarHtml(x.u,(pro[x.u]||{}).img,'')+'</div>'+
        '<div class="fr-n"><b>'+esc(x.u)+(isMe?' (you)':'')+'</b>'+
        '<span>'+(isMe?'this is you':(x.fr?'friend':'club member'))+'</span></div>'+
        '<div class="fr-xp">'+lrnIco('bolt')+x.xp+' XP</div>'+
        (isMe?'':('<button class="fr-btn'+(x.fr?' on':'')+'" data-fr="'+esc(x.u)+'">'+
          lrnIco(x.fr?'check':'plusUser')+(x.fr?'Friends':'Add')+'</button>'))+'</div>';
    });
    b.innerHTML=h+'</div>';
    lrnWire(b,'data-fr',function(u){
      var on=!(LP.friends||{})[u];
      if(on)LP.friends[u]=true;
      else delete LP.friends[u];
      fbPut('/learn/friends/'+lrnU()+'/'+u,on?true:null);
      toast(on?('Added '+u+' as a friend'):('Removed '+u+' from your friends'),'ok');
      lrnViewFriends(b);
    });
    lrnWire(b,'data-fq',function(){lrnGo('quests');});
    lrnWire(b,'data-fb',function(v){lrnGo(v);});
  })['catch'](function(){
    b.innerHTML='<div class="lrn-empty">Could not load your friends. Try again in a moment.</div>';
  });
}
function lrnWire(root,attr,fn){
  if(!root)return;
  var ns=root.querySelectorAll('['+attr+']');
  for(var i=0;i<ns.length;i++)(function(n){
    n.onclick=function(ev){
      if(ev&&ev.stopPropagation)ev.stopPropagation();
      fn(n.getAttribute(attr),n);
    };
  })(ns[i]);
}

  chaps.forEach(function(c,i){

      esc((nextC&&nextC.name)||'the next chapter')+'">'+
      lrnIco('bolt')+' Skip this chapter</button>';
    else if(isOwner())h+='<span class="lrn-skip done dim">no final test on '+
      esc(before?(before.name||'the chapter before'):'this chapter')+'</span>';
    h+='</div>';
    h+=ls.length?nodes(ls):'<div class="lrn-empty" style="padding:14px">No lessons in this chapter yet.</div>';
    if(ct.length&&reached&&!done)h+='<div class="lrn-nodes"><div class="lrn-row">'+
      '<button class="lrn-node chest" data-ctest="'+c.id+'" style="--nc:'+
      esc(c.color||u.color||'#58cc02')+'">'+lrnIco('box')+'</button>'+
      '<div class="lrn-lbl">Chapter final test<span class="lrn-start">'+
      (nextC?('pass it to jump to '+esc(nextC.name||'the next chapter'))
            :'last chapter in this unit')+'</span></div></div></div>';
  });
  if(loose.length){
    if(chaps.length)h+='<div class="lrn-chap"><div class="ch-l"><span class="ch-n">More lessons</span></div></div>';
    h+=nodes(loose);
  }

  var tOpen=lrnUnitDone(u.id)||uSkipped;
  if(ut.length)
    h+='<div class="lrn-nodes"><div class="lrn-row">'+
       '<button class="lrn-node trophy'+(tOpen||isOwner()?'':' locked')+'" '+
       ((tOpen||isOwner())?('data-utest="'+u.id+'"'):'disabled')+'>'+lrnIco('trophy')+'</button>'+
       '<div class="lrn-lbl">Unit final test'+
       (tOpen?'<span class="lrn-start">'+(uSkipped?'passed':'try it')+'</span>':'')+'</div></div></div>';

  b.innerHTML=h;
  document.getElementById('lrnBack').onclick=function(){lrnGo('units',null);};
  lrnWire(b,'data-les',function(id){lrnOpenLesson(id);});
  lrnWire(b,'data-utest',function(id){lrnUnitTest(id);});
  lrnWire(b,'data-ctest',function(id){lrnChapTest(id);});
}

/* =====================================================================
   THE PLAYER  \u2014  lessons, chapter skip tests, unit tests, placement
   ===================================================================== */
var LQ={les:null,ex:[],i:0,right:0,wrong:0,mode:'lesson',target:null,
        sel:null,answered:false,order:[],pool:[],combo:0,done:0};

function lrnShuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function lrnNorm(s){
  return String(s==null?'':s).toLowerCase().replace(/\s+/g,'')
         .replace(/[,]/g,'').replace(/^\+/,'');
}
function lrnRight(e,given){
  if(!e)return false;
  if(e.type==='order'){
    return lrnArr(e.steps).map(lrnNorm).join('||')===lrnArr(given).map(lrnNorm).join('||');
  }
  var ok=String(e.answer==null?'':e.answer).split('|');
  for(var i=0;i<ok.length;i++)if(lrnNorm(ok[i])===lrnNorm(given))return true;
  return false;
}
function lrnShown(e){
  var q=String(e.q||'');
  return '<div class="lq-eq">'+esc(q)+'</div>';
}

/* ---------- opening a lesson: teach first, then play ---------- */
function lrnOpenLesson(id){
  var l=lrnLesson(id);
  if(!l)return;
  var ex=lrnExOf(l);
  if(!ex.length){
    customConfirm(isOwner()
      ? 'This lesson has no exercises yet. Open  Edit course to add some \u2014 or let the AI draft them.'
      : 'This lesson is still being written \u2014 no exercises yet!',
      function(){},{icon:'',alertOnly:true,okText:'OK'});
    return;
  }
  if(!isOwner()&&lrnHearts()<=0){lrnNoHearts();return;}
  var hints=lrnArr(l.hints),b=LP.host;
  if(!b)return;
  if(!String(l.howto||'').trim()){lrnRun(l,ex,'lesson',l.id);return;}
  var hh='';
  if(hints.length){
    hh='<div class="lq-tag">'+lrnIco('bulb')+' Keep in mind</div><ul>';
    hints.forEach(function(x){hh+='<li>'+esc(x)+'</li>';});
    hh+='</ul>';
  }
  b.innerHTML='<div class="lq"><div class="lq-teach" style="--nc:'+esc(l.color||'#58cc02')+'">'+
    '<div class="lq-tag">'+lrnIco(l.icon||'star')+' '+esc(l.title||'Lesson')+'</div>'+
    '<div class="lq-how">'+esc(String(l.howto||'')).replace(/\n/g,'<br>')+'</div>'+hh+
    '<div class="lq-foot-in"><button class="lq-go ok" id="lqStart">Got it \u2014 let\u2019s go</button>'+
    '<button class="lrn-mini" id="lqX">Back to the map</button></div></div></div>';
  document.getElementById('lqStart').onclick=function(){lrnRun(l,ex,'lesson',l.id);};
  document.getElementById('lqX').onclick=function(){lrnPaint();};
}
function lrnNoHearts(){
  customConfirm('You are out of hearts  One comes back in about '+lrnNextHeart()+
    ', or buy a refill in the  Shop.',function(){lrnGo('shop');},
    {icon:'',okText:'Open the shop'});
}

/* ---------- run a set of questions ---------- */
function lrnRun(les,ex,mode,targetId){
  LQ={les:les,ex:lrnShuffle(lrnArr(ex)),i:0,right:0,wrong:0,mode:mode||'lesson',
      target:targetId||null,sel:null,answered:false,order:[],pool:[],combo:0,done:0};
  LQ.total=LQ.ex.length;
  lrnQ();
}
function lrnQ(){
  var b=LP.host;if(!b)return;
  if(LQ.i>=LQ.ex.length){lrnFinish();return;}
  var e=LQ.ex[LQ.i],t=e.type||'input';
  LQ.sel=null;LQ.answered=false;LQ.order=[];
  var pct=Math.round(LQ.done/Math.max(1,LQ.total)*100);
  var hearts='';
  if(LQ.mode==='lesson'){
    var hn=lrnHearts();
    for(var i=0;i<LRN_MAXH;i++)hearts+=(i<hn?'':'');
  }
  var title=(LQ.mode==='ctest')?' Chapter final test'
           :(LQ.mode==='utest')?' Unit test'
           :(LQ.mode==='place')?' Placement test'
           :esc((LQ.les&&LQ.les.title)||'Lesson');
  var body='<div class="lq"><div class="lq-bar-row">'+
    '<button class="lq-quit" id="lqX">'+lrnIco('cross')+'</button>'+
    '<div class="lq-bar"><div class="lq-fill" style="width:'+pct+'%"></div></div>'+
    (hearts?'<div class="lq-hearts" id="lqHB">'+hearts+'</div>':'')+'</div>'+
    '<div class="lq-q"><div class="lq-tag">'+title+' \u00B7 '+(LQ.done+1)+' of '+LQ.total+'</div>'+
    '<div class="lq-prompt">'+esc(e.prompt||'Solve it')+'</div>'+lrnShown(e);
  if(t==='mc'){
    body+='<div class="lq-choices">';
    lrnShuffle(lrnArr(e.choices)).forEach(function(ch){
      body+='<button class="lq-choice" data-c="'+esc(ch)+'">'+esc(ch)+'</button>';
    });
    body+='</div>';
  }else if(t==='tf'){
    body+='<div class="lq-choices">'+
      '<button class="lq-choice" data-c="true">'+lrnIco('check')+' True</button>'+
      '<button class="lq-choice" data-c="false">'+lrnIco('times')+' False</button></div>';
  }else if(t==='order'){
    body+='<div class="lq-slotwrap"><div class="lq-slot ph" id="lqSlot"></div>'+
           '<div class="lq-bank" id="lqBank"></div></div>';
  }else{
    body+='<input class="lq-in" id="lqIn" placeholder="Your answer" autocomplete="off">';
  }
  if(e.hint)body+='<button class="lq-hintbtn" id="lqHint">'+lrnIco('bulb')+' Hint</button>'+
    '<div class="lq-hint" id="lqH" style="display:none">'+esc(e.hint)+'</div>';
  body+='</div><div class="lq-foot"><div class="lq-fb" id="lqFb"></div>'+
    '<div class="lq-foot-in"><button class="lq-go" id="lqGo">Check</button></div></div></div>';
  b.innerHTML=body;

  document.getElementById('lqX').onclick=function(){
    if(LQ.mode==='place'){lrnGo('units',null);return;}
    lrnGo(LP.unit?'path':'units');
  };
  var hb=document.getElementById('lqHint');
  if(hb)hb.onclick=function(){
    var el2=document.getElementById('lqH');
    if(el2)el2.style.display='block';
    hb.style.display='none';
  };
  if(t==='mc'||t==='tf'){
    lrnWire(b,'data-c',function(v,n){
      if(LQ.answered)return;
      var ns=b.querySelectorAll('[data-c]');
      for(var i=0;i<ns.length;i++)ns[i].classList.remove('sel');
      n.classList.add('sel');
      LQ.sel=v;
    });
  }else if(t==='order'){
    LQ.pool=lrnShuffle(lrnArr(e.steps));
    lrnDrawOrder();
  }else{
    var inp=document.getElementById('lqIn');
    if(inp){
      inp.focus();
      inp.onkeydown=function(ev){if(ev.keyCode===13)lrnCheck(e);};
    }
  }
  document.getElementById('lqGo').onclick=function(){lrnCheck(e);};
}

/* ---------- tap the steps in order ---------- */
function lrnDrawOrder(){
  var slot=document.getElementById('lqSlot'),bank=document.getElementById('lqBank');
  if(!slot||!bank)return;
  var used={},sh='';
  LQ.order.forEach(function(s,i){
    used[s]=(used[s]||0)+1;
    sh+='<button class="lq-tile in" data-o="'+i+'">'+esc(s)+'</button>';
  });
  slot.className='lq-slot'+(LQ.order.length?'':' ph');
  slot.innerHTML=sh||'<span>Tap the steps below in the right order\u2026</span>';
  var left={},bh='';
  LQ.pool.forEach(function(s){left[s]=(left[s]||0)+1;});
  LQ.pool.forEach(function(s,i){
    if((used[s]||0)>0){used[s]--;return;}
    bh+='<button class="lq-tile" data-b="'+i+'">'+esc(s)+'</button>';
  });
  bank.innerHTML=bh||'<span style="opacity:.6">all placed \u2014 hit Check</span>';
  if(LQ.answered)return;
  lrnWire(bank,'data-b',function(i){LQ.order.push(LQ.pool[Number(i)]);lrnDrawOrder();});
  lrnWire(slot,'data-o',function(i){LQ.order.splice(Number(i),1);lrnDrawOrder();});
}

/* ---------- checking ---------- */
function lrnCheck(e){
  if(LQ.answered){
    LQ.i++;
    lrnQ();
    return;
  }
  var t=e.type||'input',given;
  if(t==='mc'||t==='tf'){
    if(LQ.sel==null){toast('Pick an answer first.','err');return;}
    given=LQ.sel;
  }else if(t==='order'){
    if(LQ.order.length<lrnArr(e.steps).length){toast('Place all the steps first.','err');return;}
    given=LQ.order;
  }else{
    var inp=document.getElementById('lqIn');
    given=inp?inp.value:'';
    if(!String(given).trim()){toast('Type your answer first.','err');return;}
  }
  var ok=lrnRight(e,given);
  LQ.answered=true;
  LQ.done++;
  var fb=document.getElementById('lqFb'),go=document.getElementById('lqGo');
  if(ok){
    LQ.right++;LQ.combo++;
    if(LQ.combo>=3)lrnComboPop(LQ.combo);
    if(fb){fb.className='lq-fb ok';fb.innerHTML=' Nice one!';}
  }else{
    LQ.wrong++;LQ.combo=0;
    var right=(t==='order')?lrnArr(e.steps).join('  \u2192  ')
                           :String(e.answer||'').split('|')[0];
    if(fb){
      fb.className='lq-fb no';
      fb.innerHTML=''+lrnIco('cross')+' The answer is <b>'+esc(right)+'</b>'+(e.why?('<br>'+esc(e.why)):'');
    }
    if(LQ.mode==='lesson'&&!isOwner()){
      var hn=lrnHearts()-1;
      lrnSetHearts(hn);
      var hb=document.getElementById('lqHB');
      if(hb){
        var s='';
        for(var i=0;i<LRN_MAXH;i++)s+=(i<hn?'':'');
        hb.innerHTML=s;
      }
      if(hn<=0){lrnOutOfHearts();return;}
    }
    /* wrong ones come back round again, Duolingo style */
    LQ.ex.push(e);
    LQ.total++;
  }
  /* mark the visuals */
  if(t==='mc'||t==='tf'){
    var ns=document.querySelectorAll('[data-c]');
    for(var j=0;j<ns.length;j++){
      var v=ns[j].getAttribute('data-c');
      ns[j].disabled=true;
      if(lrnRight(e,v))ns[j].classList.add('right');
      else if(v===LQ.sel)ns[j].classList.add('wrong');
    }
  }else if(t==='order'){
    var slot=document.getElementById('lqSlot');
    if(slot)slot.className='lq-slot '+(ok?'right':'wrong');
  }else{
    var i2=document.getElementById('lqIn');
    if(i2){i2.disabled=true;i2.className='lq-in '+(ok?'right':'wrong');}
  }
  if(go){
    go.className='lq-go '+(ok?'ok':'no');
    go.textContent=(LQ.i+1>=LQ.ex.length)?'Finish':'Next';
    go.onclick=function(){LQ.i++;lrnQ();};
  }
}
function lrnComboPop(n){
  var d=el('div','lq-combo',' '+n+' in a row!');
  document.body.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},1200);
}
function lrnOutOfHearts(){
  var b=LP.host;if(!b)return;
  b.innerHTML='<div class="lrn-end"><div class="big">'+lrnIco('heartOff')+'</div>'+
    '<h3>Out of hearts</h3><p class="sub">You got '+LQ.right+' right before running out. '+
    'One heart comes back in about '+lrnNextHeart()+'.</p>'+
    '<div class="lrn-endb"><button class="lrn-buy" id="lrnSh">'+lrnIco('cart')+' Refill in the shop</button>'+
    '<button class="lrn-mini" id="lrnBk">Back to the map</button></div></div>';
  document.getElementById('lrnSh').onclick=function(){lrnGo('shop');};
  document.getElementById('lrnBk').onclick=function(){lrnGo(LP.unit?'path':'units');};
}

/* ---------- the end screen + saving ---------- */
function lrnFinish(){
  var b=LP.host;if(!b)return;
  var asked=LQ.right+LQ.wrong,
      pct=asked?Math.round(LQ.right/asked*100):0,
      perfect=(LQ.wrong===0&&LQ.right>0),
      mode=LQ.mode,pass=pct>=LRN_PASS;

  if(mode==='place'){lrnPlacementResult(pct);return;}

  var xp=LQ.right*LRN_XP_Q;
  if(perfect)xp+=20;
  if(mode==='ctest'||mode==='utest')xp=Math.round(xp*1.5);
  if(lrnBoosted())xp*=2;
  var gems=perfect?3:1;

  var jobs=[lrnAddXp(xp),lrnAddGems(gems),lrnBumpStreak()],
      head,sub,icon;

  if(mode==='lesson'&&LQ.target){
    var prev=Number((LP.prog[LQ.target]||{}).crowns)||0,
        cr=Math.min(3,prev+(perfect?1:(prev?0:1)));
    LP.prog[LQ.target]={crowns:cr,best:Math.max(pct,Number((LP.prog[LQ.target]||{}).best)||0),at:Date.now()};
    jobs.push(fbPut('/learn/prog/'+lrnU()+'/'+LQ.target,LP.prog[LQ.target]));
    icon=perfect?'':'';
    head=perfect?'Perfect lesson!':'Lesson complete!';
    sub=cr>=3?'That is all three crowns on this one ':('You are on '+cr+' crown'+(cr===1?'':'s')+' here.');
  }else if(mode==='ctest'&&LQ.target){
    if(pass){
      var c=lrnChapter(LQ.target),cls=c?lrnUnitChaps(c.unitId):[],hit=0,nx=null,seen=false;
      cls.forEach(function(cc){
        if(seen){if(!nx)nx=cc;return;}
        if(!LP.ctests[cc.id]){LP.ctests[cc.id]=true;hit++;
          jobs.push(fbPut('/learn/ctests/'+lrnU()+'/'+cc.id,true));}
        if(cc.id===LQ.target)seen=true;
      });
      icon='';
      head=(hit>1)?'Jumped ahead!':'Chapter skipped!';
      sub='You scored '+pct+'% \u2014 '+((hit>1)
        ? ('chapter'+(hit===1?'':'s')+' 1 to '+hit+' of this unit are all marked done. ')
        : ('every lesson in '+esc((c&&c.name)||'that chapter')+' is marked done. '))+
        (nx?('You are now at <b>'+esc(nx.name||'the next chapter')+'</b>.')
           :'That is the last chapter in the unit!');
    }else{
      icon='';
      head='Not quite \u2014 '+pct+'%';
      sub='You need '+LRN_PASS+'% to jump a chapter. Nothing lost \u2014 work through its lessons, '+
          'or retake the test whenever you like.';
    }
  }else if(mode==='utest'&&LQ.target){
    if(pass){
      LP.tests[LQ.target]=true;
      jobs.push(fbPut('/learn/tests/'+lrnU()+'/'+LQ.target,true));
      var u=lrnUnit(LQ.target);
      icon='';
      head='Whole unit cleared!';
      sub='You scored '+pct+'% on '+esc((u&&u.name)||'the unit')+' \u2014 every chapter inside it counts as done.';
    }else{
      icon='';
      head='Not quite \u2014 '+pct+'%';
      sub='You need '+LRN_PASS+'% to skip a whole unit. Try skipping it chapter by chapter instead \u2014 '+
          'those tests are shorter.';
    }
  }else{
    icon='';head='Done!';sub='You scored '+pct+'%.';
  }

  jobs.push(lrnQuestBump({xp:xp,lessons:(mode==='lesson'?1:0),right:LQ.right,perfect:perfect}));
  jobs.push(lrnFriendBump(xp));

  b.innerHTML='<div class="lrn-end"><div class="big">'+icon+'</div>'+
    '<h3>'+head+'</h3><p class="sub">'+sub+'</p>'+
    '<div class="lrn-stats">'+
    '<div class="lrn-stat x"><b>'+pct+'%</b><span>score</span></div>'+
    '<div class="lrn-stat a"><b>+'+xp+'</b><span>XP'+(lrnBoosted()?' (x2)':'')+'</span></div>'+
    '<div class="lrn-stat g"><b>+'+gems+'</b><span>gems</span></div></div>'+
    '<div class="lrn-endb">'+
    ((mode==='lesson')?'<button class="lrn-mini" id="lrnAgain">Practise again</button>':'')+
    ((!pass&&(mode==='ctest'||mode==='utest'))?'<button class="lrn-mini" id="lrnAgain">Try the test again</button>':'')+
    '<button class="lrn-buy" id="lrnBk">'+(LP.unit?'Back to the map':'Back to my units')+'</button></div></div>';

  var again=document.getElementById('lrnAgain');
  if(again)again.onclick=function(){
    if(mode==='lesson'&&LQ.les)lrnRun(LQ.les,lrnExOf(LQ.les),'lesson',LQ.target);
    else if(mode==='ctest')lrnChapTest(LQ.target);
    else lrnUnitTest(LQ.target);
  };
  document.getElementById('lrnBk').onclick=function(){
    lrnGo(LP.unit?'path':'units');
  };

  Promise.all(jobs).then(function(){return lrnAwardBadges();}).then(function(){
    var head2=document.getElementById('lrnHead');
    if(head2){head2.innerHTML=lrnTopBar();lrnWireTop();}
  });
}

/* ---------- the two skip tests (owner written) ---------- */
function lrnChapTest(cid){
  var c=lrnChapter(cid);
  if(!c)return;
  var t=lrnTestOf(c);
  if(!t.length){
    customConfirm(isOwner()
      ? 'This chapter has no final test yet. Open  Edit course \u2192 Edit + final test on this chapter and add 4\u20136 questions (or let the AI draft them).'
      : 'There is no final test for this chapter yet \u2014 work through the lessons instead!',
      function(){},{icon:'',alertOnly:true,okText:'OK'});
    return;
  }
  var chaps=lrnUnitChaps(c.unitId),idx=lrnChapIndex(cid),nextC=chaps[idx+1],miss=0;
  for(var i2=0;i2<=idx;i2++)if(!lrnChapDone(chaps[i2].id))miss++;
  customConfirm('Final test for <b>'+esc(c.name||'this chapter')+'</b>: '+t.length+' question'+
    (t.length===1?'':'s')+', and you need '+LRN_PASS+'% to pass.<br><br>Pass it and '+
    (nextC?('you skip straight to <b>'+esc(nextC.name||'the next chapter')+'</b>')
          :'this whole chapter counts as done')+
    ((miss>1)?(', and this chapter plus the '+(miss-1)+' before it all get marked done.')
             :'.')+
    '<br><br>No hearts are lost, and you can retake it whenever you like.',
    function(){lrnRun(null,t,'ctest',cid);},{icon:'',okText:'I know this, start the test',html:true});
}
function lrnUnitTest(uid){
  var u=lrnUnit(uid);
  if(!u)return;
  var t=lrnTestOf(u);
  if(!t.length){
    customConfirm(isOwner()
      ? 'This unit has no final test yet. Open  Edit course \u2192 Edit + final test on the unit to add one.'
      : 'There is no test for this unit yet \u2014 skip forward one chapter at a time instead!',
      function(){},{icon:'',alertOnly:true,okText:'OK'});
    return;
  }
  customConfirm('Final test for the whole <b>'+esc(u.name||'unit')+'</b>: '+t.length+' question'+
    (t.length===1?'':'s')+', '+LRN_PASS+'% to pass. Pass it and every chapter in the unit counts as done. '+
    'No hearts are lost.',function(){lrnRun(null,t,'utest',uid);},
    {icon:'',okText:'Start the test',html:true});
}

/* ---------- AI placement test ---------- */
function lrnPlacement(){
  if(!GEMINI_KEY){
    customConfirm('The placement test needs the AI. Ask Ghadi to add a key in the  Matix AI tab, '+
      'or just start at Unit 1 \u2014 it is quick if you already know it.',
      function(){},{icon:'',alertOnly:true,okText:'OK'});
    return;
  }
  var b=LP.host;if(!b)return;
  b.innerHTML='<div class="lrn-empty"><div class="big">'+lrnIco('compass')+'</div>Writing you a quick test\u2026</div>';
  var names=[];
  LP.units.forEach(function(u){
    var cs=lrnUnitChaps(u.id).map(function(c){return c.name||'';});
    names.push((u.name||'')+(cs.length?(' ('+cs.join(', ')+')'):''));
  });
  var prompt='You are placing a student in a maths course. Reply with STRICT JSON only, no prose, '+
    'no code fence. Shape: {"ex":[{"type":"input","prompt":"Solve for x","q":"x + 5 = 12","answer":"7"}]}\n'+
    'Give exactly 8 questions that get harder as they go, covering these units in order: '+
    names.join(' | ')+'. Types may be "input", "mc" (with 4 "choices") or "tf" ("answer" true/false). '+
    'For "input", if several forms are right join them with a pipe like "1/2|0.5". Keep the maths correct.';
  lrnAiJson(prompt,1800).then(function(data){
    var ex=[];
    lrnArr(data&&data.ex).forEach(function(e){
      if(!e||!e.q||e.answer==null||e.answer==='')return;
      var t=(e.type==='mc'||e.type==='tf')?e.type:'input';
      ex.push({type:t,prompt:e.prompt||'Solve it',q:String(e.q),answer:String(e.answer),
               choices:lrnArr(e.choices).map(function(x){return String(x);}),
               steps:[],hint:'',why:e.why||''});
    });
    if(ex.length<3)throw new Error('short');
    lrnRun(null,ex,'place',null);
  })['catch'](function(){
    toast('Could not build the test right now \u2014 just start at Unit 1!','err');
    lrnGo('units',null);
  });
}
function lrnPlacementResult(pct){

  else if(pct>=45)open=Math.min(1,LP.units.length-1);
  var jobs=[fbPut('/learn/placed/'+lrnU(),true)],named=[];
  LP.placed=true;

  {id:'les2', icon:'books', name:'Finish 2 lessons', goal:2,  gems:5, k:'lessons'},

function lrnCheckDailyQuests(){
  var d=lrnDay(0);
  if((LP.quests||{}).__d===d)return Promise.resolve();
  LP.quests={__d:d};
  return fbPut('/learn/quests/'+lrnU()+'/'+d,LP.quests);
}
function lrnQuestBump(got){
  var d=lrnDay(0),q=LP.quests||{__d:d},gems=0,won=[];
  LRN_QUESTS.forEach(function(t){
    var add=Number(got[t.k])||0;
    if(t.k==='perfect')add=got.perfect?1:0;
    if(!add)return;
    var was=Number(q[t.id])||0;
    if(was>=t.goal)return;
    var now=was+add;
    q[t.id]=now;
    if(now>=t.goal){gems+=t.gems;won.push(t);}
  });
  q.__d=d;LP.quests=q;
  var jobs=[fbPut('/learn/quests/'+lrnU()+'/'+d,q)];
  if(gems)jobs.push(lrnAddGems(gems));
  if(won.length)setTimeout(function(){
    toast(' Quest done: '+won[0].name+' \u00B7 +'+won[0].gems+' ','ok');
  },700);
  return Promise.all(jobs);
}
function lrnFqId(a,b){return [normUser(a),normUser(b)].sort().join('__');}

function lrnFriendBump(xp){
  if(!xp)return Promise.resolve();
  var me=lrnU(),mid=null,f=null;
  for(var k in (LP.fqAll||{})){
    var x=LP.fqAll[k];
    if(!x||x.done)continue;
    if(normUser(x.a)===me||normUser(x.b)===me){mid=k;f=x;}
  }
  if(!f)return Promise.resolve();
  var mineIsA=(normUser(f.a)===me),key=mineIsA?'pa':'pb';
  f[key]=(Number(f[key])||0)+xp;
  var tot=(Number(f.pa)||0)+(Number(f.pb)||0),goal=Number(f.goal)||200,jobs=[];
  jobs.push(fbPut('/learn/fq/'+mid+'/'+key,f[key]));
  if(tot>=goal&&!f.done){
    f.done=true;LP.fqDone=(LP.fqDone||0)+1;
    jobs.push(fbPut('/learn/fq/'+mid+'/done',true));
    jobs.push(lrnAddGems(15));
    setTimeout(function(){toast(' Friend quest complete \u00B7 +15 ','ok');},900);
  }
  return Promise.all(jobs);
}

function lrnStats(){
  var lessons=0,maxCrowns=0;
  for(var k in LP.prog){
    var cr=Number((LP.prog[k]||{}).crowns)||0;
    if(cr>0)lessons++;
    if(cr>maxCrowns)maxCrowns=cr;
  }
  var units=0,tests=0,chaps=0;
  LP.units.forEach(function(u){if(lrnUnitDone(u.id))units++;});
  for(var t in LP.tests)if(LP.tests[t])tests++;
  for(var c in LP.ctests)if(LP.ctests[c])chaps++;
  return {lessons:lessons,maxCrowns:maxCrowns,units:units,tests:tests,chaps:chaps,
          xp:Number(LP.xp)||0,gems:Number(LP.gems)||0,
          streak:Number((LP.streak||{}).count)||0,fq:Number(LP.fqDone)||0};
}
function lrnAwardBadges(){
  var s=lrnStats(),jobs=[],got=[];
  LRN_BADGES.forEach(function(bd){
    if(LP.badges[bd.id])return;
    var ok=false;
    try{ok=bd.t(s);}catch(e){ok=false;}
    if(!ok)return;
    LP.badges[bd.id]=Date.now();
    got.push(bd);
    jobs.push(fbPut('/learn/badges/'+lrnU()+'/'+bd.id,LP.badges[bd.id]));
  });
  if(got.length)setTimeout(function(){
    customConfirm('<b>'+got[0].name+'</b><br>'+got[0].desc+
      (got.length>1?('<br><br>\u2026and '+(got.length-1)+' more!'):''),
      function(){},{icon:got[0].icon,alertOnly:true,okText:'Nice!',html:true});
  },500);
  return Promise.all(jobs);
}

  LRN_COLORS.forEach(function(c){
    h+='<button type="button" class="lrn-sw'+(c.toLowerCase()===String(sel).toLowerCase()?' on':'')+
       '" data-col="'+esc(c)+'" style="background:'+esc(c)+'"></button>';
  });
  return h+'<input type="color" class="lrn-swx" id="lrnColX" value="'+esc(sel||'#58cc02')+'" title="Any colour"></div>';
}
function lrnWirePickers(onChange){
  var ib=document.getElementById('lrnIcons'),cb=document.getElementById('lrnCols');
  if(ib)lrnWire(ib,'data-ic',function(ic){
    LP.edIcon=ic;
    var ns=ib.querySelectorAll('[data-ic]');
    for(var i=0;i<ns.length;i++)ns[i].classList.remove('on');
    for(var j=0;j<ns.length;j++)if(ns[j].getAttribute('data-ic')===ic)ns[j].classList.add('on');
    if(onChange)onChange();
  });
  if(cb){
    lrnWire(cb,'data-col',function(c){
      LP.edColor=c;
      var ns=cb.querySelectorAll('[data-col]');
      for(var i=0;i<ns.length;i++)ns[i].classList.remove('on');
      for(var j=0;j<ns.length;j++)if(ns[j].getAttribute('data-col')===c)ns[j].classList.add('on');
      var x=document.getElementById('lrnColX');if(x)x.value=c;
      if(onChange)onChange();
    });
    var x=document.getElementById('lrnColX');
    if(x)x.oninput=function(){
      LP.edColor=x.value;
      var ns=cb.querySelectorAll('[data-col]');
      for(var i=0;i<ns.length;i++)ns[i].classList.remove('on');
      if(onChange)onChange();
    };
  }
}

   the shared exercise builder (lessons, chapter skip tests, unit tests)
   ===================================================================== */
function lrnExOk(e){return e&&e.q&&((e.type==='order')?lrnArr(e.steps).length>1:(e.answer!==''&&e.answer!=null));}
function lrnExBoxHtml(withAi){
  return '<div id="lEx"></div><div class="lrn-exbtns">'+
    '<button class="lrn-mini" id="lAdd">+ Add exercise</button>'+
    (withAi!==false?'<button class="lrn-ai" id="lAi">'+lrnIco('sparkle')+' Let the AI write some</button>':
     '<button class="lrn-ai" id="lAi">'+lrnIco('sparkle')+' AI: draft this test</button>')+
    '</div>';
}
function lrnExBox(){
  var box=document.getElementById('lEx');if(!box)return;
  var h='';
  LP.edEx.forEach(function(e,i){
    var t=e.type||'input';
    h+='<div class="lrn-ex"><div class="lrn-ex-h"><span>#'+(i+1)+'</span>'+
      '<div class="lrn-exmv">'+
      (i>0?'<button class="lrn-mini" data-up="'+i+'">\u2191</button>':'')+
      (i<LP.edEx.length-1?'<button class="lrn-mini" data-dn="'+i+'">\u2193</button>':'')+
      '<button class="del" data-x="'+i+'">Remove</button></div></div>'+
      '<div class="lrn-row2">'+
      '<label class="lrn-f"><span>Type</span><select data-f="type" data-i="'+i+'">'+
        '<option value="input"'+(t==='input'?' selected':'')+'>Type the answer (solve equation)</option>'+
        '<option value="mc"'+(t==='mc'?' selected':'')+'>Multiple choice</option>'+
        '<option value="tf"'+(t==='tf'?' selected':'')+'>True / False</option>'+
        '<option value="order"'+(t==='order'?' selected':'')+'>Tap the steps in order</option></select></label>'+
      '<label class="lrn-f"><span>Instruction on top</span>'+
      '<input data-f="prompt" data-i="'+i+'" value="'+esc(e.prompt||'Solve it')+'"></label></div>'+
      '<label class="lrn-f"><span>The question or equation</span>'+
      '<input data-f="q" data-i="'+i+'" value="'+esc(e.q||'')+'" placeholder="x + 5 = 12"></label>';
    if(t==='mc')
      h+='<label class="lrn-f"><span>Choices \u2014 separate with |</span>'+
         '<input data-f="choices" data-i="'+i+'" value="'+esc(lrnArr(e.choices).join('|'))+'" placeholder="5|7|12|17"></label>';
    if(t==='order'){
      h+='<label class="lrn-f"><span>The steps in the CORRECT order \u2014 separate with |</span>'+
         '<input data-f="steps" data-i="'+i+'" value="'+esc(lrnArr(e.steps).join('|'))+'" '+
         'placeholder="x + 5 = 12|x = 12 - 5|x = 7"></label>';
    }else{
      h+='<div class="lrn-row2"><label class="lrn-f"><span>Correct answer'+
        (t==='input'?' (use | for other accepted forms)':'')+'</span>'+
        (t==='tf'
          ? '<select data-f="answer" data-i="'+i+'"><option value="true"'+(lrnNorm(e.answer)==='true'?' selected':'')+'>True</option>'+
            '<option value="false"'+(lrnNorm(e.answer)==='false'?' selected':'')+'>False</option></select>'
          : '<input data-f="answer" data-i="'+i+'" value="'+esc(e.answer||'')+'" placeholder="7">')+
        '</label>'+
        '<label class="lrn-f"><span>Hint (optional)</span>'+
        '<input data-f="hint" data-i="'+i+'" value="'+esc(e.hint||'')+'" placeholder="Take 5 off both sides"></label></div>';
    }
    h+='<label class="lrn-f"><span>Explanation if they get it wrong (optional)</span>'+
       '<input data-f="why" data-i="'+i+'" value="'+esc(e.why||'')+'"></label></div>';
  });
  if(!LP.edEx.length)h='<p class="lrn-sub">Nothing here yet \u2014 add one below, or ask the AI.</p>';
  box.innerHTML=h;
  lrnWire(box,'data-x',function(i){lrnExPull();LP.edEx.splice(Number(i),1);lrnExBox();});
  lrnWire(box,'data-up',function(i){
    lrnExPull();i=Number(i);
    var t=LP.edEx[i-1];LP.edEx[i-1]=LP.edEx[i];LP.edEx[i]=t;lrnExBox();
  });
  lrnWire(box,'data-dn',function(i){
    lrnExPull();i=Number(i);
    var t=LP.edEx[i+1];LP.edEx[i+1]=LP.edEx[i];LP.edEx[i]=t;lrnExBox();
  });
  var fs=box.querySelectorAll('[data-f]');
  for(var k=0;k<fs.length;k++)(function(f){
    f.onchange=function(){
      lrnExPull();
      if(f.getAttribute('data-f')==='type')lrnExBox();
    };
  })(fs[k]);
  var add=document.getElementById('lAdd');
  if(add)add.onclick=function(){
    lrnExPull();
    LP.edEx.push({type:'input',prompt:'Solve it',q:'',answer:'',hint:'',why:'',choices:[],steps:[]});
    lrnExBox();
  };
  var ai=document.getElementById('lAi');
  if(ai)ai.onclick=lrnAiEx;
}
function lrnExPull(){
  var box=document.getElementById('lEx');if(!box)return;
  var fs=box.querySelectorAll('[data-f]');
  for(var i=0;i<fs.length;i++){
    var f=fs[i],idx=Number(f.getAttribute('data-i')),key=f.getAttribute('data-f');
    if(!LP.edEx[idx])continue;
    if(key==='choices'||key==='steps'){
      LP.edEx[idx][key]=f.value.split('|').map(function(x){return x.trim();})
                        .filter(function(x){return x;});
    }else LP.edEx[idx][key]=f.value;
  }
}

/* =====================================================================
   AI writes exercises straight into whichever form is open
   ===================================================================== */
function lrnAiJson(prompt,maxTok){
  if(!GEMINI_KEY)return Promise.reject(new Error('nokey'));
  var h={'Content-Type':'application/json','Authorization':'Bearer '+GEMINI_KEY};
  if(aiProvider()==='openrouter'){h['HTTP-Referer']='https://matixthemathclub.com';h['X-Title']='Matix';}
  return fetch(aiEndpoint(),{method:'POST',headers:h,body:JSON.stringify({
    model:aiModel(),messages:[{role:'user',content:prompt}],
    temperature:0.3,max_tokens:maxTok||2200
  })}).then(function(r){return r.json();}).then(function(j){
    var txt='';
    try{txt=j.choices[0].message.content||'';}catch(e){txt='';}
    if(!txt)throw new Error('empty');
    txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
    var a=txt.indexOf('{'),b=txt.lastIndexOf('}');
    if(a<0||b<0)throw new Error('shape');
    return JSON.parse(txt.slice(a,b+1));
  });
}
function lrnAiEx(){
  if(!GEMINI_KEY){
    customConfirm('The AI needs a key first. Open the  Matix AI tab and paste a free Groq key, then come back.',
      function(){},{icon:'',alertOnly:true,okText:'Got it'});
    return;
  }
  var lT=document.getElementById('lT'),cN=document.getElementById('cN'),uN=document.getElementById('uN');
  var kind=lT?'lesson':(cN?'chapter':'unit');
  var topic=(lT||cN||uN||{}).value||'';
  var howto=(document.getElementById('lH')||{}).value||'';
  var ctx='';
  if(kind==='lesson'){
    var sel=document.getElementById('lC');
    ctx=sel?((sel.options[sel.selectedIndex]||{}).text||''):'';
  }else if(kind==='chapter'){
    var su=document.getElementById('cU');
    ctx=su?((su.options[su.selectedIndex]||{}).text||''):'';
    var cid=(lrnChapter(LP.editingChap)||{}).id;
    var titles=[];
    if(cid)lrnChapLessons(cid).forEach(function(l){titles.push(l.title||'');});
    if(titles.length)ctx+=' covering: '+titles.join(', ');
  }
  var btn=document.getElementById('lAi');
  if(!topic){toast('Type a name first so the AI knows the topic.','err');return;}
  if(btn){btn.disabled=true;btn.textContent=' Writing\u2026';}
  var what=(kind==='lesson')
    ? 'exercises for a single lesson'
    : ('questions for a '+kind+' SKIP TEST \u2014 someone who already knows the whole '+kind+
       ' should pass it, so cover the '+kind+' broadly, not one narrow trick');
  var prompt='You write maths '+what+' for a childrens learning app. Reply with STRICT JSON only, '+
    'no prose and no code fence. Shape:\n'+
    '{"ex":[{"type":"input","prompt":"Solve for x","q":"x + 5 = 12","answer":"7","hint":"Take 5 off both sides","why":""},'+
    '{"type":"mc","prompt":"Pick the answer","q":"12 x 5","choices":["50","55","60","65"],"answer":"60","hint":""},'+
    '{"type":"tf","prompt":"True or false","q":"8 x 3 equals 3 x 8","answer":"true","why":"Order never changes a product"},'+
    '{"type":"order","prompt":"Put the steps in order","q":"Solve 2x + 3 = 11","steps":["2x + 3 = 11","2x = 8","x = 4"],"hint":""}]}\n'+
    'Rules: exactly 6 exercises. Mix the four types, include at least one "order" one. '+
    'For "mc" always give 4 choices and make "answer" match one of them exactly. '+
    'For "input" the answer must be a plain number or simple expression; if several forms are right, '+
    'join them with a pipe like "1/2|0.5". For "order", "steps" must be in the CORRECT order. '+
    'Keep the maths correct and age appropriate. '+
    'The '+kind+' is called "'+topic+'"'+(ctx?(' ('+ctx+')'):'')+'. '+
    (howto?('The teacher explained it like this: '+howto.slice(0,700)):'');
  lrnAiJson(prompt,2400).then(function(data){
    var add=[];
    lrnArr(data&&data.ex).forEach(function(e){
      if(!e||!e.q)return;
      var t=(e.type==='mc'||e.type==='tf'||e.type==='order')?e.type:'input';
      var o={type:t,prompt:e.prompt||'Solve it',q:String(e.q),
             hint:e.hint||'',why:e.why||'',choices:[],steps:[],answer:''};
      if(t==='order'){
        o.steps=lrnArr(e.steps).map(function(x){return String(x);});
        if(o.steps.length<2)return;
      }else{
        o.answer=String(e.answer==null?'':e.answer);
        if(o.answer==='')return;
        if(t==='mc'){
          o.choices=lrnArr(e.choices).map(function(x){return String(x);});
          if(o.choices.length<2)return;
        }
      }
      add.push(o);
    });
    if(!add.length)throw new Error('none');
    lrnExPull();
    LP.edEx=LP.edEx.concat(add);
    lrnExBox();
    toast(' The AI added '+add.length+' \u2014 check them, then save.','ok');
  })['catch'](function(){
    if(btn){btn.disabled=false;btn.textContent=' Let the AI write some';}
    toast('The AI could not write them this time. Try again, or add them by hand.','err');
  });
}

function lrnConvEx(raw){
  var out=[];
  lrnArr(raw).forEach(function(e){
    if(!e||typeof e==='string')return;
    var q=e.q||e.question||e.prompt||e.text||e.title||'';
    var ans=e.answer||e.a||e.correct||e.sol||e.solution||'';
    if(!q||ans===''||ans==null)return;
    var ch=lrnArr(e.choices||e.options||e.opts);
    out.push({type:ch.length?'mc':'input',prompt:e.prompt||'Solve it',q:String(q),
              answer:String(ans),choices:ch.map(function(x){return String(x);}),
              steps:[],hint:e.hint||'',why:e.why||e.explanation||''});
  });
  return out;
}

/* --- profile helpers -------------------------------------------------
   safeEmoji: the avatar field must be a tiny emoji. Some older profiles
   stored an entire base64 image in 'avatar', which used to get printed on
   screen as raw text where the name should be.
   profileImg: the real picture lives at profiles/<user>/profileImage. */
function safeEmoji(v){
  if(!v||typeof v!=='string')return '';
  v=v.trim();
  if(!v||v.length>6)return '';
  if(/^data:|^https?:/i.test(v))return '';
  if(/[<>{}\\/]/.test(v))return '';
  return v;
}
function profileImg(pr){
  if(!pr)return '';
  var v=pr.profileImage||pr.photo||pr.image||pr.picture||pr.avatarUrl||'';
  if(typeof v!=='string')return '';
  v=v.trim();
  if(/^data:image\//i.test(v))return v;
  if(/^https?:\/\//i.test(v))return v;
  return '';
}

/* =====================================================================
   BUGS - members report problems and talk about them
   ===================================================================== */
var BUG_STATUS={open:{l:'Open',c:'#e0762b'},fixed:{l:'Fixed',c:'#1f9d55'}};
var bugFilter='all';

function renderBugs(c){
  c.innerHTML='<div class="wrap"><div class="page-title"><span class="emoji">\uD83D\uDC1E</span>Bugs</div>'+
    '<div class="page-sub">Something broken or acting weird? Report it here so it can get fixed. Everyone can post and reply.</div>'+
    '<div class="card"><label class="fl">Report a bug</label>'+
    '<input id="bugTitle" placeholder="Short summary \u2014 e.g. My game won\'t save">'+
    '<textarea id="bugText" rows="3" style="margin-top:8px" placeholder="What happened? What were you doing just before it broke?"></textarea>'+
    '<div class="err" id="bugErr"></div>'+
    '<button class="btn" id="bugAdd" style="margin-top:10px">Report it</button></div>'+
    '<div class="u-toolbar" style="margin-top:18px"><div class="seg" id="bugSeg">'+
    '<button data-f="all" class="active">All</button><button data-f="open">Open</button><button data-f="fixed">Fixed</button>'+
    '</div></div><div id="bugList">Loading\u2026</div></div>';

  $('bugAdd').onclick=function(){
    var t=$('bugTitle').value.trim(),d=$('bugText').value.trim();
    if(!t){$('bugErr').textContent='Give it a short summary first.';return;}
    var b=$('bugAdd');b.disabled=true;b.textContent='Sending\u2026';
    fbPost('/bugs',{title:t,text:d,by:ME,at:Date.now(),status:'open',votes:1,voters:{},replies:{}}).then(function(){
      toast('Bug reported \u2014 thanks!','ok');renderBugs(c);
    });
  };
  document.querySelectorAll('#bugSeg button').forEach(function(b){
    b.onclick=function(){
      bugFilter=b.dataset.f;
      document.querySelectorAll('#bugSeg button').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');loadBugs();
    };
  });
  loadBugs();
}

function loadBugs(){
  fbGet('/bugs').then(function(o){
    o=o||{};
    var arr=Object.keys(o).map(function(k){var v=o[k]||{};v.id=k;return v;});
    if(bugFilter!=='all')arr=arr.filter(function(b){return (b.status||'open')===bugFilter;});
    arr.sort(function(a,b){
      var ao=(a.status||'open')==='open'?0:1,bo=(b.status||'open')==='open'?0:1;
      return ao-bo||(b.votes||0)-(a.votes||0)||(b.at||0)-(a.at||0);
    });
    var l=$('bugList');if(!l)return;
    if(!arr.length){
      l.innerHTML='<div class="empty"><div class="big">\uD83C\uDF89</div>'+(bugFilter==='all'?'No bugs reported \u2014 nice!':'Nothing here.')+'</div>';
      return;
    }
    l.innerHTML=arr.map(function(it){
      var st=BUG_STATUS[it.status||'open']||BUG_STATUS.open;
      var voted=it.voters&&it.voters[ME];
      var mine=(it.by===ME);
      var reps=it.replies?Object.keys(it.replies).map(function(k){var r=it.replies[k]||{};r.id=k;return r;}):[];
      reps.sort(function(a,b){return (a.at||0)-(b.at||0);});
      var h='<div class="bug">'+
        '<div class="vote"><button data-bvote="'+it.id+'" '+(voted?'style="opacity:.5" disabled':'')+' title="Happened to me too">\u25B2</button><b>'+(it.votes||0)+'</b></div>'+
        '<div class="bug-b">'+
        '<div class="bug-h"><b>'+esc(it.title||'Untitled')+'</b><span class="bug-st" style="background:'+st.c+'">'+st.l+'</span></div>'+
        (it.text?'<div class="bug-t">'+esc(it.text)+'</div>':'')+
        '<div class="by">by @'+esc(it.by||'?')+' \u00B7 '+timeAgo(it.at)+(reps.length?' \u00B7 \uD83D\uDCAC '+reps.length:'')+'</div>';
      if(reps.length){
        h+='<div class="bug-reps">';
        reps.forEach(function(r){
          h+='<div class="bug-rep"><b>@'+esc(r.by||'?')+'</b> '+esc(r.text||'')+'<span class="wh">'+timeAgo(r.at)+'</span></div>';
        });
        h+='</div>';
      }
      h+='<div class="bug-acts">'+
        '<button class="btn ghost sm" data-brep="'+it.id+'">\uD83D\uDCAC Reply</button>'+
        (isOwner()?'<button class="btn ghost sm" data-bst="'+it.id+'" data-cur="'+esc(it.status||'open')+'">'+((it.status||'open')==='open'?'\u2705 Mark fixed':'\u21A9\uFE0F Reopen')+'</button>':'')+
        ((isOwner()||mine)?'<button class="btn sm danger" data-bdel="'+it.id+'">Delete</button>':'')+
        '</div><div class="bug-form" id="bf-'+it.id+'"></div></div></div>';
      return h;
    }).join('');

    l.querySelectorAll('[data-bvote]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.bvote,cur=arr.filter(function(x){return x.id===id;})[0]||{},v=cur.voters||{};
      v[ME]=true;fbPatch('/bugs/'+id,{votes:(cur.votes||0)+1,voters:v}).then(loadBugs);
    };});

    l.querySelectorAll('[data-bst]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.bst,nx=(b.dataset.cur==='open')?'fixed':'open';
      fbPatch('/bugs/'+id,{status:nx}).then(function(){toast(nx==='fixed'?'Marked as fixed':'Reopened','ok');loadBugs();});
    };});

    l.querySelectorAll('[data-bdel]').forEach(function(b){b.onclick=function(){
      customConfirm('Delete this bug report?',function(){
        fbDel('/bugs/'+b.dataset.bdel).then(function(){toast('Bug deleted');loadBugs();});
      },{danger:true,okText:'Delete'});
    };});

    l.querySelectorAll('[data-brep]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.brep,box=$('bf-'+id);
      if(!box)return;
      if(box.innerHTML){box.innerHTML='';return;}
      box.innerHTML='<textarea rows="2" placeholder="Add what you know\u2026"></textarea>'+
        '<button class="btn sm" style="margin-top:6px">Post reply</button>';
      var ta=box.querySelector('textarea'),btn=box.querySelector('button');
      ta.focus();
      btn.onclick=function(){
        var v=ta.value.trim();if(!v)return;
        btn.disabled=true;
        fbPost('/bugs/'+id+'/replies',{by:ME,text:v,at:Date.now()}).then(function(){loadBugs();});
      };
    };});
  });
}

/* ---------- THEME (dark mode) ---------- */
var THEME_KEY='matix_theme';
function getTheme(){try{return localStorage.getItem(THEME_KEY)||'light';}catch(e){return 'light';}}
function saveTheme(t){try{localStorage.setItem(THEME_KEY,t);}catch(e){}}
function applyTheme(t){
  var dark=(t==='dark');
  document.body.classList[dark?'add':'remove']('dark');
  var sw=$('darkSwitch'),ic=$('darkIcon');
  if(sw)sw.classList[dark?'add':'remove']('on');
  if(ic)ic.textContent=dark?'☀️':'🌙';
  var lb=$('tbLight'),db2=$('tbDark');
  if(lb)lb.classList[dark?'remove':'add']('on');
  if(db2)db2.classList[dark?'add':'remove']('on');
  var mt=document.querySelector('meta[name="theme-color"]');
  if(mt)mt.setAttribute('content',dark?'#191919':'#ffffff');
}
function toggleTheme(){
  var t=(getTheme()==='dark')?'light':'dark';
  saveTheme(t);applyTheme(t);
  toast(t==='dark'?'🌙 Dark mode on':'☀️ Light mode on','ok');
}
function initTheme(){
  applyTheme(getTheme());
  applyCustomTheme();
  aiLoadKey();
  refreshBans();
  refreshCustomTheme();
  var b=$('darkToggle');
  if(b)b.onclick=toggleTheme;
}



/* =====================================================================
   POINTS
   ===================================================================== */
var PT={points:{},roles:{},profiles:{},members:{},notes:{},reqs:{}};
var ptView='ledger';var ptOpen=null;
var EARN=[
  {i:'\u2705',t:'Finish a lesson',p:'+10',d:'Work through a lesson on the Lessons page.'},
  {i:'\u270F\uFE0F',t:'Do the exercises',p:'+5 to +15',d:'Depends how hard the set is.'},
  {i:'📝',t:'Create a lesson',p:'+20',d:'Write a lesson that gets published to the club.'},
  {i:'💡',t:'Teach us something new',p:'+5',d:'Share a new thing you learned with everybody.'}
];
var REWARDS=[
  {i:'🏅',t:'A badge on your profile',c:50},
  {i:'🎨',t:'Your own colour theme',c:75},
  {i:'🛡\uFE0F',t:'Admin for a week',c:100},
  {i:'👑',t:'Manager for a week',c:200}
];
function ptRole(u){return PT.roles[u]||'member';}
function ptScore(u){var v=PT.points[u];return typeof v==='number'?v:(parseInt(v,10)||0);}
function ptNameOf(u){var p=PT.profiles[u]||{};return p.displayName||u;}
function ptCanDirect(){return isOwner()||ptRole(ME)==='manager';}
function ptCanAsk(){return ptRole(ME)==='admin';}
function ptPeople(){
  var seen={},out=[];
  [PT.members,PT.points,PT.roles,PT.profiles].forEach(function(o){
    for(var k in o){if(o.hasOwnProperty(k)&&!seen[k]){seen[k]=1;out.push(k);}}
  });
  out.sort(function(a,b){return ptScore(b)-ptScore(a)||a.localeCompare(b);});
  return out;
}
function ptPendingCount(){var n=0;for(var k in PT.reqs){if(PT.reqs[k]&&PT.reqs[k].status==='pending')n++;}return n;}
function renderPoints(c){
  c.innerHTML='<div class="wrap"><div id="ptBody"><div class="empty">Loading points\u2026</div></div></div>';
  loadPoints();
}
function loadPoints(){
  Promise.all([
    fbGet('/points'),fbGet('/roles'),fbGet('/profiles'),
    fbGet('/members'),fbGet('/member_notes'),fbGet('/point_requests')
  ]).then(function(r){
    PT.points=r[0]||{};PT.roles=r[1]||{};PT.profiles=r[2]||{};
    PT.members=r[3]||{};PT.notes=r[4]||{};PT.reqs=r[5]||{};
    paintPoints();
  })['catch'](function(){
    var b=$('ptBody');
    if(b)b.innerHTML='<div class="empty">Could not load the points \u2014 check your connection, then hit the reload button in the top bar.</div>';
  });
}
function paintPoints(){
  var b=$('ptBody');if(!b)return;
  var segs=[['ledger','🏆 Ledger'],['earn','\u2795 How to get points'],['rewards','🎁 Use your points']];
  if(isOwner())segs.push(['reqs','📥 Requests'+(ptPendingCount()?' ('+ptPendingCount()+')':'')]);
  var h='<div class="pt-head"><div><h1 style="margin:0">\u2B50 Points</h1>'
   +'<div class="sub">Earn points for doing maths, spend them on club perks.</div></div>'
   +'<div class="pt-bal"><b>'+ptScore(ME)+'</b><span>Your points</span></div></div>';
  h+='<div class="pt-segs">';
  segs.forEach(function(s){h+='<button class="pt-seg'+(ptView===s[0]?' on':'')+'" data-v="'+s[0]+'">'+s[1]+'</button>';});
  h+='</div><div id="ptMain"></div>';
  b.innerHTML=h;
  b.querySelectorAll('[data-v]').forEach(function(n){
    n.onclick=function(){ptView=n.getAttribute('data-v');ptOpen=null;paintPoints();};
  });
  paintPtMain();
}
function paintPtMain(){
  var m=$('ptMain');if(!m)return;
  if(ptView==='earn'){
    var h='';
    EARN.forEach(function(e){
      h+='<div class="pt-card"><span class="ic">'+e.i+'</span><div><b>'+esc(e.t)+'</b><small>'+esc(e.d)+'</small></div><span class="pt-cost">'+e.p+'</span></div>';
    });
    h+='<div class="sub" style="margin-top:12px">Points are given out by the owner and the managers \u2014 do the work, then ask them.</div>';
    m.innerHTML=h;return;
  }
  if(ptView==='rewards'){
    var mine=ptScore(ME),h2='';
    REWARDS.forEach(function(r,i){
      var can=mine>=r.c;
      h2+='<div class="pt-card"><span class="ic">'+r.i+'</span><div><b>'+esc(r.t)+'</b><small>'
        +(can?'You can afford this one.':'You need '+(r.c-mine)+' more.')+'</small></div>'
        +'<span class="pt-cost">'+r.c+'</span>'
        +'<button class="btn sm" data-rw="'+i+'"'+(can?'':' disabled')+' style="margin-left:10px">Ask for it</button></div>';
    });
    m.innerHTML=h2;
    m.querySelectorAll('[data-rw]').forEach(function(n){
      n.onclick=function(){ptAskReward(REWARDS[Number(n.getAttribute('data-rw'))]);};
    });
    return;
  }
  if(ptView==='reqs'){paintPtReqs(m);return;}
  if(ptOpen){paintPtUser(m,ptOpen);return;}
  var people=ptPeople(),h3='';
  if(!people.length){m.innerHTML='<div class="empty">Nobody has any points yet.</div>';return;}
  people.forEach(function(u,i){
    var medal=i===0?'🥇':(i===1?'🥈':(i===2?'🥉':'#'+(i+1)));
    var role=ptRole(u),chip='';
    if(role!=='member')chip='<span class="pt-chip '+role+'">'+role+'</span>';
    if(u===ME)chip+='<span class="pt-chip me">you</span>';
    h3+='<div class="pt-row" data-u="'+esc(u)+'"><div class="pt-rank">'+medal+'</div>'
      +'<div class="pt-who">'+esc(ptNameOf(u))+chip+'<small>@'+esc(u)+'</small></div>'
      +'<div class="pt-sc">'+ptScore(u)+'</div></div>';
  });
  m.innerHTML=h3;
  m.querySelectorAll('[data-u]').forEach(function(n){
    n.onclick=function(){ptOpen=n.getAttribute('data-u');paintPtMain();};
  });
}
function paintPtUser(m,u){
  var role=ptRole(u);
  var h='<button class="btn ghost sm" id="ptBack">\u2190 Back to the ledger</button>'
   +'<div class="pt-detail" style="margin-top:12px">'
   +'<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">'
   +'<div><div class="pt-big">'+ptScore(u)+'</div><div class="sub">points</div></div>'
   +'<div><b style="font-size:1.05rem">'+esc(ptNameOf(u))+'</b>'
   +(role!=='member'?' <span class="pt-chip '+role+'">'+role+'</span>':'')
   +'<div class="sub">@'+esc(u)+'</div></div></div>';
  if(ptCanDirect()||ptCanAsk()){
    h+='<div class="pt-lbl">'+(ptCanAsk()?'Ask the owner to change this':'Change their points')+'</div><div class="pt-ctrls">';
    [1,5,10,25].forEach(function(n){h+='<button class="btn sm" data-add="'+n+'">+'+n+'</button>';});
    [-1,-5,-10].forEach(function(n){h+='<button class="btn ghost sm" data-add="'+n+'">'+n+'</button>';});
    h+='<button class="btn ghost sm" id="ptCustom">Custom\u2026</button>';
    h+='<button class="btn danger sm" id="ptReset">Reset to 0</button></div>';
  }else{
    h+='<div class="sub" style="margin-top:14px">Only the owner and the managers can change points.</div>';
  }
  if(isOwner()){
    h+='<div class="pt-lbl">Your private note about them</div>'
     +'<textarea class="pt-note" id="ptNote" placeholder="e.g. really good at geometry">'+esc(PT.notes[u]||'')+'</textarea>'
     +'<button class="btn sm" id="ptNoteSave" style="margin-top:8px">Save note</button>';
  }
  h+='</div>';
  m.innerHTML=h;
  $('ptBack').onclick=function(){ptOpen=null;paintPtMain();};
  m.querySelectorAll('[data-add]').forEach(function(n){
    n.onclick=function(){ptChange(u,Number(n.getAttribute('data-add')),n);};
  });
  if($('ptCustom'))$('ptCustom').onclick=function(){
    var v=prompt('How many points? Use a minus sign to take points away.');
    if(v===null)return;
    var num=parseInt(v,10);
    if(isNaN(num)||num===0){customAlert('That is not a number I can use.',null,{icon:'🤔'});return;}
    ptChange(u,num,null);
  };
  if($('ptReset'))$('ptReset').onclick=function(){
    customConfirm('Set '+ptNameOf(u)+' back to 0 points?',function(){ptChange(u,'reset',null);},{icon:'\u267B\uFE0F',okText:'Reset'});
  };
  if($('ptNoteSave'))$('ptNoteSave').onclick=function(){
    var txt=$('ptNote').value;
    fbPut('/member_notes/'+encodeURIComponent(u),txt).then(function(){
      PT.notes[u]=txt;toast('Note saved','ok');
    })['catch'](function(){toast('Could not save the note.','err');});
  };
}
function ptNotify(user,title,body){
  return fbPost('/notifications/'+encodeURIComponent(user),
    {type:'points',title:title,body:body,at:Date.now(),from:ME,read:false});
}
function ptChange(u,amount,btn){
  var cur=ptScore(u);
  var next=(amount==='reset')?0:Math.max(0,cur+amount);
  if(btn)btn.disabled=true;
  if(ptCanAsk()&&!ptCanDirect()){
    fbPost('/point_requests',{requestedBy:ME,targetUser:u,amount:amount,status:'pending',timestamp:Date.now()})
     .then(function(){
       toast('Sent to the owner for approval','ok');
       if(btn)btn.disabled=false;
     })['catch'](function(){toast('Could not send the request.','err');if(btn)btn.disabled=false;});
    return;
  }
  if(!ptCanDirect()){if(btn)btn.disabled=false;return;}
  fbPut('/points/'+encodeURIComponent(u),next).then(function(){
    PT.points[u]=next;
    var word=(amount==='reset')?'reset to 0':((amount>0?'+':'')+amount);
    ptNotify(u,'\u2B50 Your points changed','You are now on '+next+' points ('+word+') \u2014 by '+ptNameOf(ME)+'.');
    toast(ptNameOf(u)+' is now on '+next+' points','ok');
    if(btn)btn.disabled=false;
    paintPoints();
  })['catch'](function(){toast('Could not change the points.','err');if(btn)btn.disabled=false;});
}
function ptAskReward(r){
  fbPost('/point_requests',{requestedBy:ME,targetUser:ME,reward:r.t,amount:-r.c,status:'pending',timestamp:Date.now()})
   .then(function(){customAlert('Asked for \u201C'+r.t+'\u201D. The owner will see it in the Requests tab.',null,{icon:'🎁'});})

function paintPtReqs(m){
  var ids=[];
  for(var k in PT.reqs){if(PT.reqs[k]&&PT.reqs[k].status==='pending')ids.push(k);}
  if(!ids.length){m.innerHTML='<div class="empty">Nothing waiting for you \u2014 nice.</div>';return;}
  ids.sort(function(a,b){return (PT.reqs[b].timestamp||0)-(PT.reqs[a].timestamp||0);});
  var h='';
  ids.forEach(function(id){
    var r=PT.reqs[id];
    var what=r.reward?('the reward \u201C'+esc(r.reward)+'\u201D'):((r.amount==='reset')?'a reset to 0':((r.amount>0?'+':'')+r.amount+' points'));
    h+='<div class="pt-req"><div class="who">'+esc(ptNameOf(r.requestedBy||'?'))+' wants '+what+'</div>'
     +'<div class="mt">for '+esc(ptNameOf(r.targetUser||'?'))+' \u00B7 @'+esc(r.targetUser||'?')+'</div>'
     +'<button class="btn sm" data-ok="'+id+'">Approve</button> '
     +'<button class="btn ghost sm" data-no="'+id+'">Deny</button></div>';
  });
  m.innerHTML=h;
  m.querySelectorAll('[data-ok]').forEach(function(n){n.onclick=function(){ptDecide(n.getAttribute('data-ok'),true,n);};});
  m.querySelectorAll('[data-no]').forEach(function(n){n.onclick=function(){ptDecide(n.getAttribute('data-no'),false,n);};});
}
function ptDecide(id,ok,btn){
  var r=PT.reqs[id];if(!r)return;
  if(btn)btn.disabled=true;
  var done=function(){
    PT.reqs[id].status=ok?'approved':'denied';
    ptNotify(r.requestedBy,ok?'\u2705 Request approved':'\u274C Request denied',
      (ok?'The owner approved':'The owner denied')+' your points request.');
    toast(ok?'Approved':'Denied','ok');
    paintPoints();
  };
  fbPatch('/point_requests/'+id,{status:ok?'approved':'denied',decidedBy:ME,decidedAt:Date.now()})
   .then(function(){
     if(!ok){done();return;}
     var u=r.targetUser,next=(r.amount==='reset')?0:Math.max(0,ptScore(u)+Number(r.amount||0));
     fbPut('/points/'+encodeURIComponent(u),next).then(function(){
       PT.points[u]=next;
       if(r.reward){
         ptGrantReward(u,r.reward);
         ptNotify(u,'\U0001F381 Reward unlocked','You spent points on \u201C'+r.reward+'\u201D \u2014 enjoy!');
       } else {
         ptNotify(u,'\u2B50 Your points changed','You are now on '+next+' points.');
       }
       done();
     })['catch'](function(){toast('Approved, but the points did not save.','err');if(btn)btn.disabled=false;});
   })['catch'](function(){toast('Could not save that decision.','err');if(btn)btn.disabled=false;});
}
/* apply the effect of a redeemed reward — right now only the profile badge has a real effect to grant */
function ptGrantReward(u,reward){
  if(/badge/i.test(reward))fbPut('/profiles/'+encodeURIComponent(u)+'/hasBadge',true)['catch'](function(){});
}

function shrinkImage(file,max,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var im=new Image();
    im.onload=function(){
      var w=im.width,h=im.height;
      var sc=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement('canvas');
      cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      try{cb(cv.toDataURL('image/jpeg',0.82));}catch(e){cb('');}
    };
    im.onerror=function(){cb('');};
    im.src=fr.result;
  };
  fr.onerror=function(){cb('');};
  fr.readAsDataURL(file);
}

function aiChatsPath(){return '/ai_chats/'+encodeURIComponent(ME);}

function aiTool(name){

    return {type:'function',function:{name:t.name,description:t.desc||'',parameters:{type:'object',properties:props,required:t.req||[]}}};

}
function aiSystem(){

   +'You have a search_web tool that searches Wikipedia \u2014 use it whenever the user asks about facts, current events, or anything you are not sure about. '
   +'You also have add_todo/list_todos/add_note/list_notes tools for the user\u2019s own Private page \u2014 use them whenever they ask you to remember something, keep a list, or take notes for them. '

   +'Never invent a tool that is not in your list. If a tool result starts with ERROR, tell the user plainly what went wrong. '
   +'Keep replies short and friendly, one or two sentences, no markdown headings.';
}
function aiCall(strict){
  var body={model:aiModel(),messages:[{role:'system',content:aiSystem()}].concat(AI_TURNS),tools:aiDeclarations(),tool_choice:'auto',temperature:(strict?0:0.3),max_tokens:8192};
  var h={'Content-Type':'application/json','Authorization':'Bearer '+(GEMINI_KEY||'')};
  if(aiProvider()==='openrouter'){h['HTTP-Referer']='https://matixthemathclub.com';h['X-Title']='Matix';}
  return fetch(aiEndpoint(),{method:'POST',headers:h,body:JSON.stringify(body)}).then(function(r){
    return r.json().then(function(j){return {status:r.status,json:j};})['catch'](function(){return {status:r.status,json:{}};});
  });
}
function aiToolFail(j){
  var e=(j&&j.error)||{};
  if(e.failed_generation)return true;
  var m=String(e.message||'');
  return /failed to call a function|failed_generation|tool call|tool_use_failed/i.test(m);
}
function aiErrorText(status,j){
  var prov=aiProvider();
  if(status===401||status===403){
    if(prov==='github')return 'Matix can\u2019t connect with that GitHub key. Open the key box above, make sure the token has "Models" access turned on, and save it again.';
    return 'Matix can\u2019t connect with that key. Open the key box above and try adding a fresh one.';
  }
  if(status===400&&aiToolFail(j))return 'That was a bit too much for the AI to build in one go \u2014 it garbled its own instructions. Try asking for something smaller, like one game or one change at a time.';
  return 'Failed \u2014 please try restarting Matix and try again.';
}

function aiSend(text,files){
  if(AI_BUSY)return;
  if(!GEMINI_KEY){aiPush({role:'error',text:'No AI key yet. Open this tab as the owner and paste a free Groq key \u2014 get one at console.groq.com/keys.'});return;}
  AI_BUSY=true;
  var clean=(files||[]).filter(function(f){return f&&!f.skipped;});
  aiPush({role:'me',text:text,files:(files&&files.length)?files:null});
  var sendText=text;
  if(clean.length){
    sendText+='\n\n[The user attached '+clean.length+' file(s):]\n'+clean.map(function(f){
      return '--- '+f.name+' ---\n'+f.content;
    }).join('\n\n');
  }
  AI_TURNS.push({role:'user',content:sendText});
  aiPush({role:'think'});
  aiStep(0);
}
function aiStep(depth,retried,tf){
  if(depth>6){aiDropThink();aiPush({role:'error',text:'That turned into too many steps, so I stopped. Try asking for one thing at a time.'});AI_BUSY=false;return;}
  aiCall((tf||0)>0).then(function(res){
    var j=res.json||{};
    if(res.status!==200){
      if(res.status===429&&!retried){
        /* stay quiet and just keep "thinking" — no need to show the user technical retry/rate-limit details */
        setTimeout(function(){aiStep(depth,true,tf);},8000);return;
      }
      if(res.status===400&&aiToolFail(j)&&(tf||0)<2){
        /* the model garbled its own tool call -- quietly retry, colder */
        setTimeout(function(){aiStep(depth,retried,(tf||0)+1);},700);return;
      }
      console.warn('Matix AI request failed',res.status,j);
      aiDropThink();aiPush({role:'error',text:aiErrorText(res.status,j)});AI_BUSY=false;return;
    }
    var msg=(j.choices&&j.choices[0]&&j.choices[0].message)||null;
    if(!msg){aiDropThink();aiPush({role:'error',text:'The AI sent back an empty answer. Try rewording it.'});AI_BUSY=false;return;}
    AI_TURNS.push(msg);
    var calls=msg.tool_calls||[];
    var said=msg.content||'';
    if(!calls.length){aiDropThink();aiPush({role:'ai',text:said||'(nothing to say)'});AI_BUSY=false;return;}
    if(said&&said.trim()){aiDropThink();aiPush({role:'ai',text:said});aiPush({role:'think'});}
    aiRunCalls(calls,0,function(){aiStep(depth+1);});
  })['catch'](function(){
    aiDropThink();aiPush({role:'error',text:'Failed \u2014 please check your connection or try restarting Matix.'});AI_BUSY=false;
  });
}
function aiRunCalls(calls,i,done){
  if(i>=calls.length){done();return;}
  var call=calls[i]||{};
  var fc=call.function||{};
  var name=fc.name;
  var args={};
  try{args=JSON.parse(fc.arguments||'{}');}catch(e){args={};}
  var t=aiTool(name);
  var next=function(result){
    AI_TURNS.push({role:'tool',tool_call_id:call.id||('call_'+i),name:name,content:String(result)});
    aiRunCalls(calls,i+1,done);
  };
  if(!t){next('ERROR: there is no tool called '+name+'.');return;}
  if(t.owner&&!isOwner()){aiNote('Blocked: only the owner can do that',false);next('ERROR: '+ME+' is not the owner, so this was blocked. Tell them to ask Ghadi.');return;}
  var go=function(){
    var out;
    try{out=t.run(args);}catch(e){next('ERROR: '+(e&&e.message?e.message:'that failed'));return;}
    Promise.resolve(out).then(function(r){
      var bad=/^ERROR/.test(String(r));
      if(t.say&&!bad)aiNote(t.say(args),true);
      else if(bad)aiNote(String(r).replace(/^ERROR:\s*/,''),false);
      if(!bad&&t.risk==='read'&&String(r).length>0)aiPush({role:'source',tool:name,text:String(r)});
      next(r);
    })['catch'](function(){next('ERROR: that failed while it was running.');});
  };
  if(t.risk==='big'){
    aiDropThink();
    customConfirm(t.confirm?t.confirm(args):('Let Matix AI run '+name+'?'),function(){aiPush({role:'think'});go();},
      {icon:'\u2728',okText:'Do it',danger:false,onCancel:function(){next('ERROR: '+ME+' said no, so nothing was changed.');}});
    return;
  }
  go();
}

function aiPush(m){AI_LOG.push(m);aiPaint();}
function aiDropThink(){
  for(var i=AI_LOG.length-1;i>=0;i--){if(AI_LOG[i].role==='think'){AI_LOG.splice(i,1);break;}}
  aiPaint();
}
function aiNote(text,ok){AI_LOG.push({role:'act',text:text,ok:ok!==false});aiPaint();}
function aiBubbleText(s){
  return esc(String(s||''))
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\n/g,'<br>');
}
function aiSourceLabel(tool){
  var m={search_web:'\uD83C\uDF10 Web search results',list_games:'\uD83C\uDFAE Games list',get_points:'\u2B50 Points lookup',who_am_i:'\uD83D\uDC64 Account info'};
  return m[tool]||('\uD83D\uDCC4 '+tool);
}
function aiPaint(){
  var box=$('aiScroll');if(!box)return;
  box.innerHTML=AI_LOG.map(function(m){
    if(m.role==='think')return '<div class="ai-msg"><div class="av">\u2728</div><div class="ai-bub"><div class="ai-think"><i></i><i></i><i></i></div></div></div>';
    if(m.role==='act')return '<div class="ai-act'+(m.ok?'':' fail')+'"><span class="tick">'+(m.ok?'\u2713':'\u2715')+'</span><span>'+esc(m.text)+'</span></div>';
    if(m.role==='error')return '<div class="ai-act fail"><span class="tick">\u2715</span><span>'+esc(m.text)+'</span></div>';
    if(m.role==='source')return '<details class="ai-src"><summary>'+esc(aiSourceLabel(m.tool))+'</summary><div class="ai-src-body">'+esc(m.text)+'</div></details>';
    var me=(m.role==='me');

        return '<details class="ai-file"><summary>\uD83D\uDCCE '+esc(f.name)+'</summary><div class="ai-file-body">'+(f.skipped?'(not sent \u2014 too large or an image)':esc(f.content))+'</div></details>';
      }).join('')+'</div>';
    }
    return '<div class="ai-msg'+(me?' me':'')+'"><div class="av">'+(me?esc(initials(ME)):'\u2728')+'</div>'
      +'<div class="ai-bub">'+aiBubbleText(m.text)+filesHtml+'</div></div>';
  }).join('');
  box.scrollTop=box.scrollHeight;

var AI_PENDING_FILES=[];
function aiReadFiles(fileList){
  var arr=Array.prototype.slice.call(fileList||[]).slice(0,8);
  return Promise.all(arr.map(function(f){
    return new Promise(function(res){
      var nm=f.webkitRelativePath||f.name;
      if(/^image\//.test(f.type)||f.size>1500000){res({name:nm,content:'',skipped:true});return;}
      var fr=new FileReader();
      fr.onload=function(){res({name:nm,content:String(fr.result||'').slice(0,6000)});};
      fr.onerror=function(){res({name:nm,content:'',skipped:true});};
      fr.readAsText(f);
    });
  }));
}
