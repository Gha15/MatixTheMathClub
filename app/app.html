/* ---------- 1:1 calling (audio+video) via WebRTC, signalled over Firebase polling ---------- */
var CALL={pc:null,local:null,remote:null,cid:null,who:null,role:null,status:'idle',camOn:true,micOn:true,seenIceKeys:{},startedAt:0,timerT:null};
function callIcePath(cid,who){return '/calls/'+cid+'/ice_'+who;}
function callOverlay(){
  var o=$('callOv');
  if(o)return o;
  o=el('div','call-ov');o.id='callOv';o.style.display='none';
  document.body.appendChild(o);
  return o;
}
function callTeardownMedia(){
  if(CALL.pc){try{CALL.pc.close();}catch(e){}CALL.pc=null;}
  if(CALL.local){CALL.local.getTracks().forEach(function(t){try{t.stop();}catch(e){}});CALL.local=null;}
  CALL.remote=null;
  if(CALL.timerT){clearInterval(CALL.timerT);CALL.timerT=null;}
}
function callReset(){
  callTeardownMedia();
  CALL.cid=null;CALL.who=null;CALL.role=null;CALL.status='idle';CALL.seenIceKeys={};CALL.startedAt=0;CALL.camOn=true;CALL.micOn=true;
  var o=$('callOv');if(o){o.style.display='none';o.innerHTML='';}
}
function callHangupIfActive(){
  if(CALL.status==='idle')return;
  var cid=CALL.cid;
  callReset();
  if(cid)fbPut('/calls/'+cid+'/status','ended').then(function(){fbDel('/calls/'+cid);});
}
function callDeclineOrHangup(){
  if(CALL.status==='idle')return;
  var cid=CALL.cid,wasRinging=CALL.status==='ringing-in';
  callReset();
  if(!cid)return;
  if(wasRinging)fbPut('/calls/'+cid+'/status','declined');
  else fbPut('/calls/'+cid+'/status','ended').then(function(){fbDel('/calls/'+cid);});
}
function callMakePC(u){
  var pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
  pc.onicecandidate=function(e){
    if(e.candidate)fbPost(callIcePath(CALL.cid,ME),{c:JSON.stringify(e.candidate)});
  };
  pc.ontrack=function(e){
    CALL.remote=e.streams[0];
    var v=$('callRemoteVid');if(v)v.srcObject=CALL.remote;
  };
  pc.onconnectionstatechange=function(){
    if(pc.connectionState==='connected'&&!CALL.startedAt){CALL.startedAt=Date.now();CALL.status='connected';callStartTimer();}
  };
  return pc;
}
function callStartTimer(){
  callPaint();
  if(CALL.timerT)clearInterval(CALL.timerT);
  CALL.timerT=setInterval(callPaint,1000);
}
function callFmtDur(){
  if(!CALL.startedAt)return '';
  var s=Math.floor((Date.now()-CALL.startedAt)/1000);
  var m=Math.floor(s/60);s=s%60;
  return '  '+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function callPaint(){
  var o=callOverlay();o.style.display='flex';
  var who=CALL.who;
  var body;
  if(CALL.status==='ringing-in'){
    body='<div class="call-who">\uD83D\uDCDE Incoming call from '+esc(mcName(who))+'</div>'
      +'<div class="call-btns">'
      +'<button class="call-btn" id="callAcceptBtn" title="Accept">\u2705</button>'
      +'<button class="call-btn hangup" id="callDeclineBtn" title="Decline">\u2715</button>'
      +'</div>';
  } else {
    var title=CALL.status==='ringing-out'?('Calling '+esc(mcName(who))+'\u2026'):CALL.status==='connecting'?'Connecting\u2026':(esc(mcName(who))+callFmtDur());
    body='<div class="call-remote"><video id="callRemoteVid" autoplay playsinline></video>'
       +'<div class="call-local"><video id="callLocalVid" autoplay playsinline muted></video></div></div>'
       +'<div class="call-who">'+title+'</div>'
       +'<div class="call-btns">'
       +'<button class="call-btn'+(CALL.micOn?'':' off')+'" id="callMicBtn" title="Mute/unmute">'+(CALL.micOn?'\uD83C\uDFA4':'\uD83D\uDD07')+'</button>'
       +'<button class="call-btn'+(CALL.camOn?'':' off')+'" id="callCamBtn" title="Camera on/off">'+(CALL.camOn?'\uD83D\uDCF9':'\uD83D\uDCF7')+'</button>'
       +'<button class="call-btn hangup" id="callHangBtn" title="Hang up">\u260E\uFE0F</button>'
       +'</div>';
  }
  o.innerHTML=body;
  var lv=$('callLocalVid');if(lv&&CALL.local)lv.srcObject=CALL.local;
  var rv=$('callRemoteVid');if(rv&&CALL.remote)rv.srcObject=CALL.remote;
  var ab=$('callAcceptBtn');if(ab)ab.onclick=callAccept;
  var db=$('callDeclineBtn');if(db)db.onclick=callDeclineOrHangup;
  var hb=$('callHangBtn');if(hb)hb.onclick=callDeclineOrHangup;
  var mb=$('callMicBtn');if(mb)mb.onclick=function(){
    CALL.micOn=!CALL.micOn;
    if(CALL.local)CALL.local.getAudioTracks().forEach(function(t){t.enabled=CALL.micOn;});
    callPaint();
  };
  var cb=$('callCamBtn');if(cb)cb.onclick=function(){
    CALL.camOn=!CALL.camOn;
    if(CALL.local)CALL.local.getVideoTracks().forEach(function(t){t.enabled=CALL.camOn;});
    callPaint();
  };
}
function callStart(u){
  if(!u||CALL.status!=='idle')return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('This device cannot make calls','err');return;}
  CALL.who=u;CALL.cid=mcId(ME,u);CALL.role='caller';CALL.status='ringing-out';
  callPaint();
  navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(function(stream){
    CALL.local=stream;CALL.pc=callMakePC(u);
    stream.getTracks().forEach(function(t){CALL.pc.addTrack(t,stream);});
    callPaint();
    return CALL.pc.createOffer().then(function(offer){return CALL.pc.setLocalDescription(offer).then(function(){return offer;});});
  }).then(function(offer){
    fbPut('/calls/'+CALL.cid,{from:ME,to:u,status:'ringing',offer:{sdp:offer.sdp,type:offer.type},at:Date.now()});
    var myCid=CALL.cid;
    setTimeout(function(){
      if(CALL.cid===myCid&&CALL.status==='ringing-out'){
        toast(mcName(u)+' didn\u2019t answer');
        callReset();fbDel('/calls/'+myCid);
      }
    },30000);
  }).catch(function(){
    toast('Could not start the call \u2014 check camera/microphone permissions','err');
    callReset();
  });
}
function callAccept(){
  if(!CALL.cid||!CALL.who)return;
  var u=CALL.who,cid=CALL.cid;
  navigator.mediaDevices.getUserMedia({audio:true,video:true}).then(function(stream){
    CALL.local=stream;CALL.pc=callMakePC(u);
    stream.getTracks().forEach(function(t){CALL.pc.addTrack(t,stream);});
    CALL.status='connecting';callPaint();
    return fbGet('/calls/'+cid+'/offer').then(function(offer){
      return CALL.pc.setRemoteDescription(new RTCSessionDescription(offer));
    }).then(function(){return CALL.pc.createAnswer();})
     .then(function(answer){return CALL.pc.setLocalDescription(answer).then(function(){return answer;});});
  }).then(function(answer){
    fbPut('/calls/'+cid+'/answer',{sdp:answer.sdp,type:answer.type});
    fbPut('/calls/'+cid+'/status','accepted');
  }).catch(function(){
    toast('Could not answer the call \u2014 check camera/microphone permissions','err');
    callHangupIfActive();
  });
}
function callPoll(){
  var u=MC.who;if(!u)return;
  var cid=mcId(ME,u);
  fbGet('/calls/'+cid).then(function(call){
    if(!call){if(CALL.status!=='idle'&&CALL.cid===cid)callReset();return;}
    if(call.status==='ended'){
      var was=CALL.status!=='idle'&&CALL.cid===cid;
      if(was)callReset();
      if(was||call.from===ME||call.to===ME)fbDel('/calls/'+cid);
      return;
    }
    if(call.status==='declined'&&CALL.role==='caller'&&CALL.cid===cid){
      toast(mcName(u)+' declined the call');
      callReset();fbDel('/calls/'+cid);
      return;
    }
    if(call.status==='ringing'&&call.from===u&&call.to===ME&&CALL.status==='idle'&&Date.now()-(call.at||0)<25000){
      CALL.cid=cid;CALL.who=u;CALL.role='callee';CALL.status='ringing-in';
      callPaint();
    }
    if(call.status==='accepted'&&CALL.role==='caller'&&CALL.cid===cid&&CALL.pc&&!CALL.pc.currentRemoteDescription&&call.answer){
      CALL.pc.setRemoteDescription(new RTCSessionDescription(call.answer)).then(function(){CALL.status='connecting';callPaint();});
    }
    if(CALL.pc&&CALL.cid===cid){
      fbGet(callIcePath(cid,u)).then(function(ic){
        ic=ic||{};
        Object.keys(ic).forEach(function(k){
          if(CALL.seenIceKeys[k])return;
          CALL.seenIceKeys[k]=true;
          var rec=ic[k];if(!rec||!rec.c)return;
          try{CALL.pc.addIceCandidate(new RTCIceCandidate(JSON.parse(rec.c)));}catch(e){}
        });
      });
    }
  });
}

function mcRefreshPreviews(){
  mcPeople().slice(0,12).forEach(function(u){
    var cid=mcId(ME,u);
    fbGet('/chats/'+cid+'/messages').then(function(o){
      var arr=mcArr(o);
      MC.last[u]=arr.length?arr[arr.length-1]:null;
      fbGet('/chatMeta/'+cid+'/read/'+ME).then(function(rd){
        rd=rd||0;
        var n=0;arr.forEach(function(m){if(m.from!==ME&&(m.at||0)>rd)n++;});

        if(mcAlive()&&MC.who!==u)mcDrawList();
      });
    });
  });
}
function mcArr(o){
  o=o||{};
  return Object.keys(o).map(function(k){var v=o[k]||{};v._k=k;return v;})
    .filter(function(v){return !v.deleted;})
    .sort(function(a,b){return (a.at||0)-(b.at||0);});
}

function mcGrid(id,arr){

function mcTogglePick(id){

function mcFire(){

function mcSend(type,text){
  if(!MC.who)return;
  var u=MC.who,cid=mcId(ME,u),at=Date.now();
  var msg={from:ME,to:u,type:type,text:text,at:at};
  MC.msgs.push(msg);mcPaint();
  fbPost('/chats/'+cid+'/messages',msg).then(function(){
    fbPut('/chats/'+cid+'/typing/'+ME,0);
    mcRead();
    fbPost('/notifications/'+u,{type:'chat',title:'💬 New message from '+mcName(ME),
      body:type==='text'?(text.length>90?text.slice(0,90)+'…':text):(type==='sticker'?(text+'  (sticker)'):'📐 sent an equation'),
      at:at,from:ME,url:'/chat'});
    MC.last[u]=msg;mcDrawList();
  }).catch(function(){toast('Message did not send — check your internet','err');});
}
function mcRead(){
  if(!MC.who)return;
  fbPut('/chatMeta/'+mcId(ME,MC.who)+'/read/'+ME,Date.now());
  MC.unread[MC.who]=0;
}
function mcPresence(){
  if(!ME)return;
  fbPut('/presence/'+ME,{online:true,at:Date.now()});
  if(!MC.who)return;
  fbGet('/presence/'+MC.who).then(function(p){
    p=p||{};
    var fresh=p.at&&(Date.now()-p.at<70000);
    MC.online=!!(p.online&&fresh);
    mcStatus();
  });
}
function mcStatus(){
  var st=$('mcSt');if(!st||!MC.who)return;
  if(MC.otherTyping&&Date.now()-MC.otherTyping<7000){st.textContent='typing…';st.className='mc-st on';return;}
  if(MC.online){st.textContent='online now';st.className='mc-st on';return;}
  st.textContent='@'+MC.who;st.className='mc-st';
}
function mcPull(first){
  var u=MC.who;if(!u)return;
  var cid=mcId(ME,u);
  fbGet('/chats/'+cid+'/messages').then(function(o){
    if(MC.who!==u)return;
    var arr=mcArr(o);
    var grew=arr.length!==MC.msgs.length;
    MC.msgs=arr;
    if(grew||first)mcPaint(first);
    if(arr.length){
      var last=arr[arr.length-1];
      MC.last[u]=last;
      if(last.from!==ME&&grew&&!first)mcRead();
    }
  });
  fbGet('/chatMeta/'+cid+'/read/'+u).then(function(r){MC.otherRead=r||0;});
  fbGet('/chats/'+cid+'/typing/'+u).then(function(t){
    MC.otherTyping=(typeof t==='number'&&t>1000000)?t:(t?Date.now():0);
    mcStatus();
  });
}
function mcPaint(jump){
  var box=$('mcMsgs');if(!box||!MC.who)return;
  var nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<140;
  var h='<div class="mc-enc">🔒 Messages here are private between you and '+esc(mcName(MC.who))+'.</div>';
  var lastDay='';
  MC.msgs.forEach(function(m){
    var dl=mcDay(m.at||Date.now());
    if(dl!==lastDay){lastDay=dl;h+='<div class="mc-day">'+esc(dl)+'</div>';}
    var out=m.from===ME;
    var cls='mc-b '+(out?'out':'in')+(m.type==='sticker'?' sticker':'')+(m.type==='math'?' math':'');
    var body=(m.type==='math')?('ƒ  '+esc(m.text||'')):esc(m.text||'');
    var tick='';
    if(out&&m.type!=='sticker')tick=' '+((m.at||0)<=MC.otherRead?'✓✓':'✓');
    h+='<div class="'+cls+'">'+body+(m.type==='sticker'?'':'<span class="mc-meta">'+mcTime(m.at)+tick+'</span>')+'</div>';
  });
  if(MC.otherTyping&&Date.now()-MC.otherTyping<7000)h+='<div class="mc-type"><i></i><i></i><i></i></div>';
  box.innerHTML=h;
  if(jump||nearBottom)box.scrollTop=box.scrollHeight;
}

var BRIGHT_KEY='matix_brightness';
function getBright(){var v=parseInt(lsGet(BRIGHT_KEY)||'100',10);if(isNaN(v)||v<60||v>120)v=100;return v;}
function applyBright(v){
  v=Number(v)||100;
  document.documentElement.style.filter=(v===100)?'':('brightness('+(v/100)+')');
  var s=$('tbBright'),l=$('tbBrightVal');
  if(s&&Number(s.value)!==v)s.value=v;

function barPanel(force){

  if($('tbLight'))$('tbLight').onclick=function(){saveTheme('light');applyTheme('light');};
  if($('tbDark'))$('tbDark').onclick=function(){saveTheme('dark');applyTheme('dark');};
  if($('tbSettings'))$('tbSettings').onclick=function(e){e.stopPropagation();barPanel();};
  if($('tbReload'))$('tbReload').onclick=reloadActiveTab;
  if($('tbMenu'))$('tbMenu').onclick=function(){$('sidebar').classList.toggle('open');};
  document.addEventListener('click',function(e){

/* ---------- which desktop shell are we in? ---------- */
function desktopBridge(){
  if(window.matixDesktop)return window.matixDesktop;
  if(window.chrome&&window.chrome.webview){
    var send=function(m){try{window.chrome.webview.postMessage(m);}catch(e){}};
    return {
      platform:'win32',
      minimize:function(){send('matix:minimize');},
      maximize:function(){send('matix:maximize');},
      close:function(){send('matix:close');},
      onMaximizeChange:function(cb){window.mxSetMaximized=function(v){cb(!!v);};}
    };
  }
  return null;
}

/* ---------- DESKTOP SHELL (custom window bar) ---------- */
function initDesktop(){
  var D=desktopBridge();
  var ua=(navigator.userAgent||'');
  var looksElectron=/Electron/i.test(ua);
  if(D||looksElectron)document.body.classList.add('desktop');
  if(!D){
    /* keep window buttons visible in Electron even if the preload bridge failed */
    var fmn=$('tbMin'),fmx=$('tbMax'),fcl=$('tbClose');
    if(fmn)fmn.onclick=function(){toast('Minimize is unavailable in this build','err');};
    if(fmx)fmx.onclick=function(){toast('Maximize is unavailable in this build','err');};
    if(fcl)fcl.onclick=function(){window.close();};
    return;
  }
  var tl=$('tbLogo');if(tl)tl.innerHTML=LOGO_SVG;
  var mn=$('tbMin'),mx=$('tbMax'),cl=$('tbClose');
  if(mn)mn.onclick=function(){D.minimize();};
  if(mx)mx.onclick=function(){D.maximize();};
  if(cl)cl.onclick=function(){
    customConfirm('Close Matix? Any unsaved work in an open tab will be lost.',function(){D.close();},{icon:'👋',okText:'Close app'});
  };
  if(D.onMaximizeChange){D.onMaximizeChange(function(isMax){if(mx){mx.textContent=isMax?'❐':'☐';mx.title=isMax?'Restore':'Maximize';}});}
}

/* =====================================================================
   MATIX UI v5  —  menu filter, recent pages, folding groups,
   density + text size, shortcuts, back-to-top
   ===================================================================== */
var U5={fold:'mx_u5_fold',dens:'mx_u5_dens',fs:'mx_u5_fs',rec:'mx_u5_recent'};
var U5_READY=false;
function u5Get(k,d){try{var v=localStorage.getItem(k);return (v===null||v===undefined)?d:v;}catch(e){return d;}}
function u5Set(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function u5Json(k){var o={};try{o=JSON.parse(u5Get(k,'{}'))||{};}catch(e){o={};}return o;}
function u5List(k){var l=[];try{l=JSON.parse(u5Get(k,'[]'))||[];}catch(e){l=[];}return (l&&l.length!==undefined)?l:[];}

/* ---------- density + text size ---------- */
function u5ApplyPrefs(){

  b.classList.remove('u5-fs-s');b.classList.remove('u5-fs-l');
  if(f==='s')b.classList.add('u5-fs-s');
  if(f==='l')b.classList.add('u5-fs-l');
  var lab=document.getElementById('u5Dens');
  if(lab)lab.textContent=(d==='compact')?'Compact':'Comfy';
  var segs=document.querySelectorAll('#u5Fs [data-fs]');
  for(var i=0;i<segs.length;i++)
    segs[i].className='u5-seg'+((segs[i].getAttribute('data-fs')===f)?' on':'');

/* ---------- filter the menu ---------- */
function u5FilterBox(){
  if(document.getElementById('u5Find'))return;
  var s=document.querySelector('.sb-search');
  if(!s||!s.parentNode)return;
  var w=document.createElement('div');
  w.className='u5-find';
  w.innerHTML='<input id="u5Find" placeholder="Filter this menu\u2026" autocomplete="off">'+
    '<span class="u5-fx" id="u5Fx" title="Clear">\u2715</span>';
  s.parentNode.insertBefore(w,s.nextSibling);
  document.getElementById('u5Find').oninput=function(){u5DoFilter(this.value);};
  document.getElementById('u5Fx').onclick=function(){
    var i=document.getElementById('u5Find');
    if(i){i.value='';u5DoFilter('');i.focus();}
  };
}
function u5DoFilter(q){
  q=(''+(q||'')).toLowerCase().replace(/^\s+/,'').replace(/\s+$/,'');
  var nav=document.getElementById('nav');
  if(!nav)return;
  var items=nav.querySelectorAll('.nav-item'),hit=0,i;
  for(i=0;i<items.length;i++){
    var nm=items[i].querySelector('.nm');
    var txt=(nm?(nm.textContent||''):'').toLowerCase();
    var ok=(!q||txt.indexOf(q)>=0);
    items[i].style.display=ok?'':'none';
    if(ok&&q)hit++;
  }
  var lbls=nav.querySelectorAll('.nav-lbl');
  for(i=0;i<lbls.length;i++)lbls[i].style.display=q?'none':'';
  var seps=nav.querySelectorAll('.nav-sep');
  for(i=0;i<seps.length;i++)seps[i].style.display=q?'none':'';
  if(!q){
    for(i=0;i<lbls.length;i++)if(lbls[i].classList.contains('folded'))u5PaintFold(lbls[i]);
  }
  var none=document.getElementById('u5None');
  if(q&&!hit){
    if(!none){none=document.createElement('div');none.id='u5None';none.className='u5-none';nav.appendChild(none);}
    none.innerHTML='Nothing in the menu matches <b>'+esc(q)+'</b>.<br>'+
      '<span>Press Ctrl K to search games, ideas and pages too.</span>';
    none.style.display='';
  }else if(none)none.style.display='none';
}

/* ---------- folding menu groups ---------- */
function u5PaintFold(l){
  var hide=l.classList.contains('folded'),n=l.nextSibling;
  while(n){
    if(n.nodeType===1){
      var cls=''+(n.className||'');
      if(cls.indexOf('nav-lbl')>=0||cls.indexOf('nav-sep')>=0)break;
      n.style.display=hide?'none':'';
    }
    n=n.nextSibling;
  }
}
function u5Folds(){
  var nav=document.getElementById('nav');
  if(!nav)return;
  var lbls=nav.querySelectorAll('.nav-lbl');
  for(var i=0;i<lbls.length;i++)(function(l){
    if(l.getAttribute('data-u5'))return;
    l.setAttribute('data-u5','1');
    l.classList.add('u5-lbl');
    var sp=l.querySelector('.sect-tx')||l.querySelector('span');
    var key=sp?(sp.textContent||'group'):'group';
    l.title='Click to fold or unfold this group';
    if(u5Json(U5.fold)[key])l.classList.add('folded');
    u5PaintFold(l);
    l.addEventListener('click',function(ev){
      if(ev&&ev.target&&ev.target.tagName==='BUTTON')return;
      l.classList.toggle('folded');
      var f=u5Json(U5.fold);
      if(l.classList.contains('folded'))f[key]=1;else delete f[key];
      u5Set(U5.fold,JSON.stringify(f));
      u5PaintFold(l);
    });
  })(lbls[i]);
}

/* ---------- recently opened ---------- */
function u5RecentAdd(spec){
  if(!spec||!spec.kind)return;
  var m={icon:'\uD83D\uDCC4',title:spec.kind};
  try{m=tabMeta(spec)||m;}catch(e){}
  var key=spec.kind+':'+(spec.refId||''),l=u5List(U5.rec),out=[];
  out.push({k:key,kind:spec.kind,refId:spec.refId||'',t:m.title||spec.kind,i:m.icon||''});
  for(var i=0;i<l.length;i++)if(l[i]&&l[i].k!==key&&out.length<5)out.push(l[i]);
  u5Set(U5.rec,JSON.stringify(out));
  u5RecentPaint();
}
function u5RecentPaint(){
  var nav=document.getElementById('nav');
  if(!nav)return;
  var l=u5List(U5.rec),w=document.getElementById('u5Rec'),h=document.getElementById('u5RecL');
  if(!l.length){
    if(w&&w.parentNode)w.parentNode.removeChild(w);
    if(h&&h.parentNode)h.parentNode.removeChild(h);
    return;
  }
  if(!w){
    w=document.createElement('div');w.id='u5Rec';
    h=document.createElement('div');h.className='nav-lbl nav-sect';h.id='u5RecL';
    h.innerHTML='<span class="sect-emo">\uD83D\uDD52</span><span class="sect-tx">Recent</span>';
    nav.insertBefore(w,nav.firstChild);
    nav.insertBefore(h,w);
  }
  w.innerHTML='';
  for(var i=0;i<l.length;i++)(function(x){
    if(!x||!x.kind)return;
    var it=document.createElement('div');
    it.className='nav-item u5-rec';
    it.innerHTML='<span class="ic">'+(x.i||'\uD83D\uDCC4')+'</span>'+
      '<span class="nm">'+esc(x.t||x.kind)+'</span>';
    it.title=(x.t||x.kind)+' \u2014 opened recently';
    it.onclick=function(){
      var sp={kind:x.kind};
      if(x.refId)sp.refId=x.refId;
      openTab(sp);
    };
    w.appendChild(it);
  })(l[i]);
}

/* ---------- after every menu re-render ---------- */
function u5AfterNav(){
  var nav=document.getElementById('nav');
  if(!nav)return;
  var items=nav.querySelectorAll('.nav-item');
  for(var i=0;i<items.length;i++){
    var nm=items[i].querySelector('.nm');
    if(nm&&!items[i].title)items[i].title=nm.textContent||'';
  }
  u5RecentPaint();
  u5Folds();
  var f=document.getElementById('u5Find');
  if(f&&f.value)u5DoFilter(f.value);
}
function u5Hook(){
  if(typeof renderNav==='function'&&!renderNav.__u5){
    var rn=renderNav;
    renderNav=function(){var r=rn.apply(null,arguments);setTimeout(u5AfterNav,0);return r;};
    renderNav.__u5=1;
  }
  if(typeof loadCustomPages==='function'&&!loadCustomPages.__u5){
    var lc=loadCustomPages;
    loadCustomPages=function(){var r=lc.apply(null,arguments);setTimeout(u5AfterNav,120);return r;};
    loadCustomPages.__u5=1;
  }
  if(typeof openTab==='function'&&!openTab.__u5){
    var ot=openTab;
    openTab=function(spec){
      var r=ot.apply(null,arguments);
      try{u5RecentAdd(spec);}catch(e){}
      return r;
    };
    openTab.__u5=1;
  }
}

/* ---------- shortcuts ---------- */
function u5Keys(){
  if(document.body.getAttribute('data-u5keys'))return;
  document.body.setAttribute('data-u5keys','1');
  document.addEventListener('keydown',function(e){
    var k=e.key||'',meta=(e.ctrlKey||e.metaKey);
    var tag=(e.target&&e.target.tagName)?e.target.tagName:'';
    if(meta&&(k==='b'||k==='B')){
      e.preventDefault();
      document.body.classList.toggle('u5-sb-hide');
      return;
    }
    if(meta&&(k==='f'||k==='F')){
      var i=document.getElementById('u5Find');
      if(i){e.preventDefault();i.focus();i.select();}
      return;
    }
    if(e.altKey&&k>='1'&&k<='9'&&tag!=='INPUT'&&tag!=='TEXTAREA'){
      var n=Number(k)-1;
      if(typeof TABS!=='undefined'&&TABS[n]){
        e.preventDefault();
        ACTIVE=TABS[n].id;
        if(typeof drawTabs==='function')drawTabs();
        if(typeof renderContent==='function')renderContent();
        if(typeof highlightNav==='function')highlightNav();
      }
    }
  });
}

/* ---------- back to top ---------- */
function u5Top(){
  if(document.getElementById('u5Top'))return;
  var b=document.createElement('button');
  b.id='u5Top';b.className='u5-top';b.title='Back to top';b.innerHTML='\u2191';
  document.body.appendChild(b);
  var c=document.getElementById('content');
  function upd(){
    var y=(c&&c.scrollTop)?c.scrollTop:(window.pageYOffset||0);
    b.className='u5-top'+((y>280)?' on':'');
  }
  if(c)c.addEventListener('scroll',upd);
  window.addEventListener('scroll',upd);
  b.onclick=function(){
    if(c){
      if(c.scrollTo)c.scrollTo({top:0,behavior:'smooth'});
      else c.scrollTop=0;
    }
    window.scrollTo(0,0);
  };
}

function initUi5(){
  if(U5_READY)return;
  if(!document.body)return;
  U5_READY=true;
  try{u5ApplyPrefs();}catch(e){}
  try{u5FilterBox();}catch(e){}
  try{u5Settings();}catch(e){}
  try{u5Hook();}catch(e){}
  try{u5Keys();}catch(e){}
  try{u5Top();}catch(e){}
  try{u5AfterNav();}catch(e){}
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',function(){initUi5();});
else initUi5();
setTimeout(function(){try{initUi5();u5AfterNav();}catch(e){}},900);
</script>
