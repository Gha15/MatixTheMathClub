<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matix — Workspace</title>
<style>
  :root{
    --bg:#ffffff;--card:#ffffff;--sidebar:#f7f7f5;--sidebar2:#efeeec;--text:#2c2c2b;--muted:#7d7a75;
    --border:#e6e5e3;--hover:#efedeb;--soft:#f9f8f7;
    --brand:#5b46c9;--brand2:#283f71;--accent:#f7a600;--blue:#2783de;--blue-soft:#e5f2fc;
    --green:#46a171;--red:#e56458;--radius:8px;
    --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(91,70,201,.2)}

  /* ---------- Sign in ---------- */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(900px 500px at 15% -10%,#ece8ff,transparent),radial-gradient(800px 500px at 100% 0,#fdeecf,transparent),var(--soft);z-index:200}
  .gate-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow);text-align:center;animation:pop .28s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .gate-logo{width:56px;height:56px;border-radius:16px;margin:0 auto 14px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.7rem;font-weight:800}
  .gate-card h1{font-size:1.4rem;font-weight:800;margin-bottom:4px}
  .gate-card p{color:var(--muted);font-size:.92rem;margin-bottom:20px}
  .fld{text-align:left;margin-bottom:12px}
  .fld label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:5px}
  input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.95rem;background:#fff;font-family:inherit;color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--radius);padding:10px 16px;font-size:.92rem;font-weight:700;background:var(--brand);color:#fff;transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.block{width:100%}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--hover);filter:none}
  .btn.accent{background:linear-gradient(90deg,var(--accent),#ff8a4c);color:#3a1d00}
  .btn.sm{padding:6px 11px;font-size:.82rem}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--border)}
  .err{color:var(--red);font-size:.83rem;min-height:16px;margin-top:8px;font-weight:600}
  .swap{margin-top:16px;font-size:.88rem;color:var(--muted)}
  .swap a{color:var(--brand);font-weight:700;cursor:pointer}

  /* ---------- App shell ---------- */
  #app{display:none;height:100%}
  .layout{display:flex;height:100%}
  .sidebar{width:250px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100%;transition:margin-left .22s ease}
  .sb-top{padding:12px 10px 6px}
  .ws{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);cursor:default}
  .ws-logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex-shrink:0}
  .ws-name{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ws-name small{display:block;font-weight:600;font-size:.72rem;color:var(--muted)}
  .sb-search{margin:8px 8px 4px;display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius);background:var(--sidebar2);color:var(--muted);font-size:.86rem;cursor:pointer;transition:background .12s}
  .sb-search:hover{background:var(--hover)}
  .sb-search kbd{margin-left:auto;font-size:.68rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted)}
  .nav{padding:6px 8px;overflow-y:auto;flex:1}
  .nav-lbl{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px;display:flex;align-items:center;justify-content:space-between}
  .nav-lbl button{border:none;background:transparent;color:var(--muted);font-size:1.05rem;line-height:1;border-radius:5px;padding:0 5px}
  .nav-lbl button:hover{background:var(--hover);color:var(--text)}
  .nav-item{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:var(--radius);font-size:.9rem;color:#4b4a47;cursor:pointer;transition:background .1s;position:relative}
  .nav-item:hover{background:var(--hover)}
  .nav-item.active{background:var(--sidebar2);color:var(--text);font-weight:600}
  .nav-item .ic{width:20px;text-align:center;flex-shrink:0}
  .nav-item .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .nav-item .del{opacity:0;border:none;background:transparent;color:var(--muted);border-radius:5px;font-size:.85rem;padding:2px 5px}
  .nav-item:hover .del{opacity:1}
  .nav-item .del:hover{background:#fff;color:var(--red)}
  .nav-group{margin-bottom:2px}
  .nav-chev{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.65rem;padding:2px 6px;flex-shrink:0;transform:rotate(90deg);transition:transform .12s}
  .nav-chev.collapsed{transform:rotate(0deg)}
  .nav-chev:hover{color:var(--text)}
  .nav-body{display:flex;flex-direction:column;gap:1px;padding-left:14px}
  .nav-body.hide{display:none}
  .nav-lbl.nav-lblclick{cursor:pointer}
  .nav-newchat{color:var(--brand);font-weight:600}
  .sb-foot{border-top:1px solid var(--border);padding:8px;display:flex;align-items:center;gap:9px}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a5b4fc,#c4b5fd);color:#312e81;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78rem;flex-shrink:0;background-size:cover;background-position:center}
  .sb-foot .u{flex:1;min-width:0}
  .sb-foot .u b{font-size:.86rem;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-foot .u span{font-size:.72rem;color:var(--muted)}
  .icon-btn{border:none;background:transparent;color:var(--muted);border-radius:6px;padding:5px 7px;font-size:.95rem}
  .icon-btn:hover{background:var(--hover);color:var(--text)}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
  .tabstrip{display:flex;align-items:center;gap:2px;height:42px;padding:0 8px;border-bottom:1px solid var(--border);background:var(--soft);overflow-x:auto;flex-shrink:0}
  .tabstrip::-webkit-scrollbar{height:0}
  .menu-toggle{display:none;border:none;background:transparent;font-size:1.2rem;padding:4px 8px;border-radius:6px;color:var(--muted)}
  .menu-toggle:hover{background:var(--hover)}
  .tab{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px 8px 0 0;font-size:.85rem;color:var(--muted);cursor:pointer;max-width:190px;white-space:nowrap;border:1px solid transparent;border-bottom:none;position:relative;top:1px}
  .tab .ic{flex-shrink:0}
  .tab .lb{overflow:hidden;text-overflow:ellipsis}
  .tab:hover{background:var(--hover)}
  .tab.active{background:var(--bg);color:var(--text);border-color:var(--border);font-weight:600}
  .tab .x{border:none;background:transparent;color:var(--muted);border-radius:4px;font-size:.9rem;line-height:1;padding:1px 4px;opacity:.6}
  .tab .x:hover{background:rgba(0,0,0,.08);opacity:1;color:var(--red)}
  .tab-add{border:none;background:transparent;color:var(--muted);font-size:1.2rem;line-height:1;border-radius:6px;padding:3px 9px;flex-shrink:0}
  .tab-add:hover{background:var(--hover);color:var(--text)}
  .content{flex:1;overflow-y:auto;position:relative}
  .frame{width:100%;height:100%;border:none;display:block;background:#fff}
  .wrap{max-width:860px;margin:0 auto;padding:40px 32px 80px}
  .wrap.wide{max-width:1080px}

  /* ---------- Content styling ---------- */
  .page-title{font-size:2.1rem;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .page-title .emoji{font-size:2rem}
  .page-sub{color:var(--muted);font-size:1rem;margin-bottom:26px}
  .hero{border-radius:16px;padding:30px 30px;margin-bottom:26px;color:#fff;background:linear-gradient(120deg,var(--brand2),var(--brand) 60%,#8b5cf6);position:relative;overflow:hidden}
  .hero:after{content:'';position:absolute;right:-50px;top:-50px;width:220px;height:220px;background:radial-gradient(circle,rgba(247,166,0,.45),transparent 70%)}
  .hero .badge{display:inline-block;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.04em;margin-bottom:12px}
  .hero h1{font-size:1.9rem;font-weight:800;margin-bottom:8px}
  .hero p{opacity:.94;max-width:560px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:14px;transition:box-shadow .15s}
  .card.hover:hover{box-shadow:var(--shadow)}
  .callout{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .callout .ci{font-size:1.3rem;flex-shrink:0}
  .callout h3{font-size:1rem;margin-bottom:3px}
  .callout p{color:#565450;font-size:.92rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .pcard{border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;background:#fff;transition:transform .14s,box-shadow .14s;animation:pop .3s ease}
  .pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
  .thumb{width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background-size:cover;background-position:center;color:#fff}
  .pcard .meta{padding:11px 13px}
  .pcard .pn{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .pb{font-size:.8rem;color:var(--muted);margin-top:2px}
  .tag{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:20px;background:var(--blue-soft);color:var(--blue);margin-left:6px;vertical-align:middle}
  .tag.ai{background:#efe9ff;color:var(--brand)}
  .tag.draft{background:#f0efed;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .seg{display:inline-flex;background:var(--soft);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;padding:6px 13px;border-radius:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
  .seg button.active{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .empty{text-align:center;color:var(--muted);padding:50px 10px}
  .empty .big{font-size:2.4rem;margin-bottom:10px}
  .stage{width:100%;height:min(70vh,640px);border:1px solid var(--border);border-radius:12px;background:#fff}
  label.fl{display:block;font-weight:700;font-size:.85rem;margin:16px 0 5px}
  .hint-item{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff}
  .hint-item h3{font-size:1rem;margin-bottom:4px}
  .hint-item p{color:#565450;font-size:.93rem;white-space:pre-wrap}
  .hint-item .meta{font-size:.74rem;color:var(--muted);margin-top:8px;display:flex;gap:10px;align-items:center}
  .idea-item{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-bottom:10px;background:#fff}
  .idea-item .vote{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
  .idea-item .vote button{border:1px solid var(--border);background:var(--soft);border-radius:7px;width:34px;height:30px;font-size:.9rem}
  .idea-item .vote button:hover{background:var(--hover)}
  .idea-item .vote b{font-size:.85rem}
  .idea-item .txt{flex:1}
  .idea-item .txt .by{font-size:.75rem;color:var(--muted);margin-top:5px}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
  .chip{font-size:.8rem;font-weight:600;padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:#fff;color:var(--muted);cursor:pointer}
  .chip.active{background:var(--brand);color:#fff;border-color:transparent}
  .chip .c{font-size:.68rem;background:rgba(0,0,0,.08);border-radius:10px;padding:0 6px;margin-left:5px}
  .chip.active .c{background:rgba(255,255,255,.25)}
  .nitem{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--border);border-left:4px solid var(--accent2,#3b82f6);border-radius:11px;padding:12px 14px;margin-bottom:9px;background:#fff}
  .nitem .nic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;color:#fff}
  .nitem .nbody{flex:1;min-width:0}
  .nitem .nl{font-weight:600;font-size:.92rem}
  .nitem .nd{font-size:.85rem;color:#565450;margin-top:2px;word-break:break-word}
  .nitem .nq{font-size:.84rem;color:var(--muted);border-left:2px solid var(--border);padding-left:9px;margin-top:5px;white-space:pre-wrap}
  .nitem .nt{font-size:.72rem;color:var(--muted);margin-top:5px}
  .new{font-size:.58rem;font-weight:800;color:#052e16;background:linear-gradient(90deg,#fbbf24,#fde047);border-radius:9px;padding:1px 6px;margin-left:7px;vertical-align:middle}
  .toggle{display:flex;align-items:center;gap:10px;font-size:.88rem;color:#4b4a47;padding:5px 0;cursor:pointer}
  .toggle input{width:16px;height:16px;accent-color:var(--brand)}
  .ide{border-radius:11px;overflow:hidden;border:1px solid #26263a;margin-top:6px}
  .ide-bar{display:flex;align-items:center;gap:9px;background:linear-gradient(90deg,#2b2b40,#1c1c2b);padding:9px 13px}
  .ide-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .ide-bar i:nth-child(1){background:#ff5f56}.ide-bar i:nth-child(2){background:#ffbd2e}.ide-bar i:nth-child(3){background:#27c93f}
  .ide-bar .f{color:#aab0c6;font:600 13px ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
  .ide-ta{display:block;width:100%;min-height:300px;background:#16161f;color:#e7e7f2;caret-color:#a78bfa;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.6;white-space:pre;tab-size:2;border:none;outline:none;padding:15px;resize:vertical}

  /* ---------- Command palette ---------- */
  .overlay{position:fixed;inset:0;background:rgba(30,30,30,.4);display:none;align-items:flex-start;justify-content:center;padding:90px 16px 16px;z-index:150;backdrop-filter:blur(2px)}
  .overlay.open{display:flex}
  .palette{width:100%;max-width:560px;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;animation:pop .18s ease}
  .palette .pin{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .palette .pin input{border:none;padding:0;font-size:1.05rem}
  .palette .pin input:focus{outline:none}
  .presults{max-height:52vh;overflow-y:auto;padding:6px}
  .pres-lbl{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:10px 12px 4px}
  .pres{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:.92rem}
  .pres:hover,.pres.sel{background:var(--hover)}
  .pres .ic{width:22px;text-align:center;flex-shrink:0}
  .pres .sub{color:var(--muted);font-size:.78rem}
  .pres .kind{margin-left:auto;font-size:.7rem;color:var(--muted);background:var(--soft);border:1px solid var(--border);padding:1px 7px;border-radius:5px}

  /* ---------- Modal ---------- */
  .modal{position:fixed;inset:0;background:rgba(30,30,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:180;backdrop-filter:blur(2px)}
  .modal.open{display:flex}
  .modal-card{width:100%;max-width:460px;background:#fff;border-radius:16px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .2s ease;max-height:90vh;overflow-y:auto}
  .modal-card h2{font-size:1.25rem;font-weight:800;margin-bottom:4px}
  .modal-card .mh-sub{color:var(--muted);font-size:.9rem;margin-bottom:8px}
  .modal-x{float:right;border:none;background:transparent;font-size:1.4rem;color:var(--muted);line-height:1}
  .emoji-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .emoji-pick button{width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:1.2rem}
  .emoji-pick button.sel{border-color:var(--brand);background:#efe9ff}

  @media(max-width:820px){
    .sidebar{position:fixed;z-index:120;box-shadow:var(--shadow);margin-left:-250px}
    .sidebar.open{margin-left:0}
    .menu-toggle{display:block}
    .wrap{padding:26px 18px 70px}
    .page-title{font-size:1.7rem}
  }
</style>
<style>
.gate-logo,.ws-logo{background:#fff!important;color:transparent!important;overflow:hidden}
.gate-logo{padding:10px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(40,63,113,.12)}
.ws-logo{padding:3px;border:1px solid var(--border)}
.gate-logo svg,.ws-logo svg{width:100%;height:100%;display:block}
body{background:linear-gradient(180deg,#faf9ff,#ffffff)}
/* dark mode must undo the hard-coded light gradient above, or the page
   stays white behind the cards and light text becomes unreadable */
body.dark{background:linear-gradient(180deg,#191919,#141414)}
#gate{background:radial-gradient(1200px 600px at 15% -10%,rgba(91,70,201,.14),transparent),radial-gradient(1000px 500px at 110% 10%,rgba(247,166,0,.12),transparent),linear-gradient(180deg,#f7f6fb,#ffffff)}
.card{transition:box-shadow .16s ease,transform .16s ease,border-color .16s}
.card:hover{box-shadow:0 8px 24px rgba(40,63,113,.09);border-color:#d9d7f2}
.nav-item{transition:background .12s,color .12s}
.nav-item.active{position:relative;background:linear-gradient(90deg,rgba(91,70,201,.13),rgba(91,70,201,.02))}
.nav-item.active:before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--brand),var(--brand2))}
.tab.active{box-shadow:inset 0 -2px 0 var(--brand)}
.page-title .emoji{filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.ls-card .ls-top{display:flex;align-items:baseline;gap:10px}
.ls-card .ls-top h3{font-weight:800;font-size:1.05rem}
.ls-by{margin-left:auto;color:var(--muted);font-size:.78rem;white-space:nowrap}
.ls-desc{color:var(--muted);font-size:.9rem;margin:4px 0}
.ls-content{margin-top:8px;font-size:.94rem;line-height:1.55}
.utbl{width:100%;border-collapse:collapse;font-size:.9rem;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.utbl th{text-align:left;padding:10px 12px;background:var(--soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.utbl td{padding:10px 12px;border-top:1px solid var(--border)}
.utbl .pw{font-family:ui-monospace,Menlo,monospace;color:var(--brand2)}
.rolechip{background:var(--blue-soft);color:var(--blue);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;text-transform:uppercase}
</style>
<style>
/* ===== cooler polish ===== */
.btn{background:linear-gradient(135deg,var(--brand),#7d5cff);box-shadow:0 2px 8px rgba(91,70,201,.28)}
.btn:hover{box-shadow:0 5px 16px rgba(91,70,201,.4);filter:brightness(1.03)}
.btn.ghost,.btn.danger{background:#fff;box-shadow:none}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.accent{background:linear-gradient(135deg,var(--accent),#ff8a4c);color:#3a1d00;box-shadow:0 2px 8px rgba(247,166,0,.3)}
.sidebar{background:linear-gradient(180deg,#f8f7fc,#f1f0f6)}
.content{scroll-behavior:smooth}
.nav::-webkit-scrollbar,.content::-webkit-scrollbar{width:10px}
.nav::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb{background:#d9d7e6;border-radius:10px;border:3px solid transparent;background-clip:content-box}
.wrap{animation:fadeUp .34s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-title{background:linear-gradient(90deg,var(--brand2),var(--brand));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-title .emoji{-webkit-text-fill-color:initial}
.hero{box-shadow:0 14px 34px rgba(40,63,113,.24)}
.hero:before{content:"";position:absolute;left:-50px;bottom:-70px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-2px)}
.pcard:hover{box-shadow:0 12px 26px rgba(40,63,113,.16)}
.ws-logo{transition:transform .3s ease}
.ws:hover .ws-logo{transform:rotate(-6deg) scale(1.06)}
.tab-add{font-weight:700}
.tab-add:hover{background:linear-gradient(135deg,rgba(91,70,201,.14),rgba(247,166,0,.14));color:var(--brand)}
.chip{transition:transform .1s,background .12s}
.chip:hover{transform:translateY(-1px)}
.chip.active{background:linear-gradient(135deg,var(--brand),#7d5cff);border-color:transparent;box-shadow:0 2px 8px rgba(91,70,201,.3)}
.nav-lbl button{transition:transform .1s}
.nav-lbl button:hover{transform:scale(1.15)}
.gate-card{box-shadow:0 20px 50px rgba(40,63,113,.16)}
.u-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.u-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;transition:transform .12s,box-shadow .12s}
.u-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(40,63,113,.12)}
.u-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;overflow:hidden;flex-shrink:0}
.u-avatar.img,.u-hero-av.img{background-size:cover;background-position:center;background-repeat:no-repeat;font-size:0;color:transparent}
.av-wrap{position:relative;display:inline-flex;flex-shrink:0}
.av-badge{position:absolute;left:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--card);display:flex;align-items:center;justify-content:center}
.av-badge svg{width:14px;height:14px;display:block}
.u-hero .av-badge{width:22px;height:22px;left:-2px;bottom:-2px}
.u-hero .av-badge svg{width:19px;height:19px}
.u-contrib{display:flex;flex-direction:column;gap:8px}
.bug{display:flex;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--soft)}
.bug .vote{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.bug .vote button{width:30px;height:26px;border:1px solid var(--border);background:transparent;border-radius:7px;color:var(--muted)}
.bug .vote b{font-size:.8rem}
.bug-b{flex:1;min-width:0}
.bug-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bug-h b{font-size:.98rem}
.bug-st{font-size:.68rem;font-weight:800;color:#fff;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.bug-t{font-size:.9rem;margin-top:4px;white-space:pre-wrap;word-wrap:break-word}
.bug-reps{margin-top:8px;border-left:2px solid var(--border);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.bug-rep{font-size:.86rem}
.bug-rep .wh{font-size:.7rem;color:var(--muted);margin-left:6px}
.bug-acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.bug-form{margin-top:8px}
.u-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px}
.u-row .t{flex:1;min-width:0;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.u-cmt:last-child{border-bottom:0}
.u-cmt .b{flex:1;min-width:0}
.u-cmt .who{font-weight:700;font-size:.82rem}
.u-cmt .tx{font-size:.9rem;margin-top:2px;word-wrap:break-word}
.u-cmt .wh{font-size:.72rem;color:var(--muted);margin-top:3px}
.u-name{font-weight:700;font-size:.92rem}
.u-pw{font-family:ui-monospace,Menlo,monospace;color:var(--brand2);font-size:.78rem;background:var(--soft);padding:2px 7px;border-radius:6px;margin-top:2px;word-break:break-all}
/* ===== users directory ===== */
.u-stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
.u-stat{background:linear-gradient(135deg,rgba(91,70,201,.09),rgba(247,166,0,.09));border:1px solid var(--border);border-radius:14px;padding:12px 18px;min-width:96px;text-align:center}
.u-stat b{display:block;font-size:1.35rem;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1.15}
.u-stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.u-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 18px}
.u-toolbar input{max-width:280px;flex:1;min-width:180px}
.u-loading{color:var(--muted);padding:30px 0;font-size:.9rem}
.u-card{cursor:pointer;position:relative;overflow:hidden}
.u-card:after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:0;transition:opacity .16s}
.u-card:hover:after{opacity:1}
.u-card.owner{border-color:rgba(247,166,0,.5);background:linear-gradient(#fff,#fffcf5)}
.u-bio{font-size:.78rem;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.u-mini{display:flex;gap:9px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:2px}
.u-view{font-size:.74rem;font-weight:700;color:var(--brand);opacity:0;transition:opacity .16s,transform .16s;transform:translateX(-4px);margin-top:auto}
.u-card:hover .u-view,.u-game:hover .u-view{opacity:1;transform:none}
.rolechip.own{background:linear-gradient(135deg,var(--brand2),#ffb52e);color:#fff;border-color:transparent}
.u-hero{display:flex;gap:18px;align-items:center;padding:26px;border-radius:20px;background:linear-gradient(135deg,var(--brand),#7d5cff);color:#fff;box-shadow:0 18px 44px rgba(91,70,201,.3)}
.u-hero.owner{background:linear-gradient(135deg,#5b46c9,var(--brand2))}
.u-hero-av{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:800;flex-shrink:0;border:2px solid rgba(255,255,255,.45)}
.u-hero-name{font-size:1.5rem;font-weight:800;margin-bottom:6px}
.u-hero-sub{font-size:.8rem;opacity:.85;margin-top:6px}
.u-hero .rolechip{background:rgba(255,255,255,.24);color:#fff;border-color:transparent}
.u-games{display:flex;flex-direction:column;gap:8px}
.u-game{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s}
.u-game:hover{transform:translateX(3px);border-color:var(--brand);box-shadow:0 8px 20px rgba(40,63,113,.1)}
.u-game-n{font-weight:600;font-size:.9rem}
.u-game .sub{font-size:.75rem;color:var(--muted)}
.owner-note{border-color:rgba(247,166,0,.45);background:linear-gradient(#fff,#fffdf6)}
/* ===== desktop title bar (shown only inside the Matix desktop app) ===== */
.titlebar{display:none;position:fixed;top:0;left:0;right:0;height:36px;z-index:500;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff;user-select:none;-webkit-user-select:none}
body.desktop .titlebar{display:flex}
body.desktop{padding-top:36px}
body.desktop #gate{top:36px}
.tb-drag{display:flex;align-items:center;gap:9px;padding-left:12px;flex:1;height:100%;-webkit-app-region:drag;app-region:drag;min-width:0}
.tb-logo{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.tb-logo svg{width:100%;height:100%}
.tb-logo svg path{fill:#fff}
.tb-title{font-size:.78rem;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.95}
.tb-btns{display:flex;height:100%;-webkit-app-region:no-drag;app-region:no-drag}
.tb-btn{width:46px;height:100%;border:0;background:transparent;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;transition:background .12s}
.tb-btn:hover{background:rgba(255,255,255,.16)}
.tb-btn.close:hover{background:#e81123}
/* ===== settings block at the bottom of the menu ===== */
.sb-settings{border-top:1px solid var(--border);padding:4px 8px 8px}
.set-item{width:100%;border:0;background:transparent;color:var(--text);display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius);font-size:.88rem;text-align:left;transition:background .12s}
.set-item:hover{background:var(--hover)}
.set-item .nm{flex:1}
.switch{width:34px;height:19px;border-radius:20px;background:var(--border);position:relative;transition:background .18s;flex-shrink:0}
.switch:after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.switch.on{background:var(--brand)}
.switch.on:after{transform:translateX(15px)}
/* ===== dark mode ===== */
body.dark{
  --bg:#191919;--card:#242424;--sidebar:#202020;--sidebar2:#262626;--text:#e8e6e3;--muted:#9b9894;
  --border:#343434;--hover:#2c2c2c;--soft:#1f1f1f;
  --brand:#8b73ff;--brand2:#7d5cff;--blue-soft:#1d2f42;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
}
body.dark .card,body.dark .u-card,body.dark .u-game,body.dark .pcard,body.dark .gate-card,body.dark .modal-card,body.dark .cc-box,body.dark .palette{background:#242424;border-color:var(--border);color:var(--text)}
body.dark .cc-box{background:linear-gradient(#262626,#212121)}
body.dark .u-card.owner{background:linear-gradient(#282520,#242424);border-color:rgba(247,166,0,.4)}
body.dark .owner-note{background:linear-gradient(#282520,#242424)}
body.dark input,body.dark textarea,body.dark select{background:#1d1d1d;border-color:var(--border);color:var(--text)}
body.dark input::placeholder,body.dark textarea::placeholder{color:#7a7772}
body.dark #gate{background:radial-gradient(900px 500px at 15% -10%,#241f3d,transparent),radial-gradient(800px 500px at 100% 0,#2d2517,transparent),var(--soft)}
body.dark .tabstrip{background:var(--sidebar)}
body.dark .tab{color:var(--muted)}
body.dark .tab.active{background:var(--bg);color:var(--text)}
body.dark .u-stat{background:linear-gradient(135deg,rgba(139,115,255,.14),rgba(247,166,0,.12))}
body.dark .toast{background:linear-gradient(135deg,#3a3852,#2a2838)}
body.dark .seg{background:var(--soft)}
body.dark .seg button{color:var(--muted)}
body.dark .seg button.active{background:#2f2f2f;color:var(--text)}
body.dark .empty{color:var(--muted)}
body.dark .stage{background:#fff}
body.dark ::selection{background:rgba(139,115,255,.35)}
/* dark: fix elements that had hard-coded light colours */
body.dark .sidebar{background:linear-gradient(180deg,#1e1e22,#1a1a1d);border-right-color:var(--border)}
body.dark .sb-search{background:#2a2a2e;color:var(--muted)}
body.dark .sb-search:hover{background:#323238}
body.dark .sb-search kbd{background:#3a3a40;color:var(--muted);border-color:#45454c}
body.dark .nav-item{color:var(--text)}
body.dark .nav-item:hover{background:rgba(255,255,255,.06)}
body.dark .nav-item.active{background:linear-gradient(90deg,rgba(139,115,255,.26),rgba(139,115,255,.05));color:#fff}
body.dark .ws-name{color:var(--text)}
body.dark .ws-name small{color:var(--muted)}
body.dark .sb-foot .u b{color:var(--text)}
body.dark .sb-settings{border-top-color:var(--border)}
body.dark .set-item{color:var(--text)}
body.dark .switch{background:#3a3a40}
body.dark .page-title{background:linear-gradient(90deg,#b9a8ff,#8b73ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.dark .hint-item{background:#242424;border-color:var(--border)}
body.dark .hint-item h3{color:var(--text)}
body.dark .hint-item p{color:#c9c6c2}
body.dark .card h2,body.dark .card h3,body.dark h1,body.dark h2,body.dark h3{color:var(--text)}
body.dark h2:not(.page-title),body.dark h3:not(.page-title){color:#f0eeeb!important;-webkit-text-fill-color:#f0eeeb!important}
body.dark .wrap h2 .emoji,body.dark .page-title .emoji{-webkit-text-fill-color:initial}
body.dark .icon-btn{color:var(--muted)}
body.dark .icon-btn:hover{background:var(--hover);color:var(--text)}
/* the light theme forces .btn.ghost/.btn.danger to a white background, so
   dark mode has to undo it or the label text is white-on-white */
body.dark .btn.ghost,body.dark .btn.danger{background:#262626}
body.dark .btn.ghost:hover,body.dark .btn.danger:hover{background:#333}
body.dark .btn.ghost{color:var(--text);border-color:var(--border)}
body.dark .btn.ghost:hover{background:var(--hover)}
body.dark .tab-add{color:var(--muted)}
body.dark .tab-add:hover{background:var(--hover);color:var(--text)}
body.dark .nav-lbl{color:var(--muted)}
body.dark .u-toolbar input{background:#1d1d1d}
body.dark .pres-lbl{color:var(--muted)}
body.dark .pres:hover,body.dark .pres.sel{background:rgba(255,255,255,.07)}
/* ===== owner delete affordances ===== */
.tab .tdel{border:0;background:transparent;cursor:pointer;font-size:.72rem;opacity:.45;padding:0 3px;border-radius:5px;line-height:1;transition:opacity .14s,background .14s,transform .1s}
.tab:hover .tdel,.tab.active .tdel{opacity:.8}
.tab .tdel:hover{opacity:1;background:rgba(192,57,43,.14);transform:scale(1.15)}
.pres{display:flex;align-items:center;gap:10px}
.pres-del{border:0;background:rgba(192,57,43,.08);cursor:pointer;font-size:.85rem;opacity:.55;padding:5px 8px;border-radius:8px;transition:opacity .14s,background .14s,transform .1s;flex-shrink:0}
.pres:hover .pres-del,.pres.sel .pres-del{opacity:.95}
.pres-del:hover{opacity:1;background:rgba(192,57,43,.14);transform:scale(1.12)}
/* ===== cooler custom dialogs ===== */
.cc-modal{position:fixed;inset:0;background:rgba(24,22,44,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000;animation:ccFade .16s ease}
@keyframes ccFade{from{opacity:0}to{opacity:1}}
@keyframes ccPop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ccGlow{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.cc-modal.open{display:flex}
.cc-box{position:relative;background:linear-gradient(#fff,#fbfaff);border:1px solid rgba(91,70,201,.14);border-radius:20px;padding:30px 28px 24px;max-width:380px;width:90%;box-shadow:0 30px 70px rgba(30,28,60,.36),0 0 0 1px rgba(255,255,255,.7) inset;animation:ccPop .2s cubic-bezier(.2,.9,.3,1.3);text-align:center;overflow:hidden}
.cc-box:before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand),#7d5cff,var(--brand2))}
.cc-icon{font-size:2.2rem;margin-bottom:10px;display:block;animation:ccGlow 2s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(91,70,201,.28))}
.cc-msg{font-size:.96rem;color:var(--text);line-height:1.55;white-space:pre-line;font-weight:500}
.cc-actions{display:flex;gap:10px;justify-content:center;margin-top:20px}
.cc-actions .btn{flex:1}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:1001;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:linear-gradient(135deg,#32304a,#232135);color:#fff;padding:11px 20px;border-radius:12px;font-size:.85rem;font-weight:500;box-shadow:0 14px 32px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.08) inset;opacity:0;transform:translateY(10px) scale(.96);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:none}
.toast.err{background:linear-gradient(135deg,#e05a45,#c0392b)}
.toast.ok{background:linear-gradient(135deg,#2fa86c,#1c7d50)}
input,textarea,select{transition:border-color .14s,box-shadow .14s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,70,201,.14)}
.stage{box-shadow:0 10px 26px rgba(40,63,113,.1);transition:box-shadow .16s}
.empty .big{animation:floaty 2.6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pcard{transition:transform .14s,box-shadow .14s}
.pcard:hover{transform:translateY(-3px)}
.tag.draft{background:var(--soft);color:var(--muted)}
.tag.ai{background:linear-gradient(135deg,rgba(91,70,201,.16),rgba(247,166,0,.16));color:var(--brand2)}
.btn.sm{transition:transform .1s}
.btn.sm:active{transform:scale(.96)}
.seg button.active{box-shadow:0 2px 8px rgba(91,70,201,.28)}
::selection{background:rgba(91,70,201,.22)}

/* ---------- title bar v2: always on, tabs live up here, Notion style ---------- */
.titlebar,#titlebar{display:flex}
body{padding-top:40px}
#gate{top:40px}
body.desktop{padding-top:40px}
body.desktop #gate{top:40px}
#titlebar{height:40px;justify-content:flex-start;gap:0}
body.dark #titlebar{background:#1b1b1b;border-bottom:1px solid #303030}
body:not(.desktop) #tbMin,body:not(.desktop) #tbMax,body:not(.desktop) #tbClose{display:none}
.tb-left{display:flex;align-items:center;gap:5px;height:100%;padding-left:11px;flex-shrink:0;-webkit-app-region:drag;app-region:drag}
.tb-ico-btn{width:26px;height:26px;border:0;border-radius:7px;background:rgba(255,255,255,.14);color:#fff;font-size:.82rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;-webkit-app-region:no-drag;app-region:no-drag;transition:background .12s}
.tb-ico-btn:hover{background:rgba(255,255,255,.3)}
body.dark .tb-ico-btn{background:rgba(255,255,255,.08);color:var(--text)}
